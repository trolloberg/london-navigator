<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stundenplan</title>
<meta name="description" content="Dein persönlicher Stundenplan: perfekte Woche, Routinen, Blocker und To-Dos.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stundenplan">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --sbg:#f2f2f7; --scard:#fff; --seg:#fff;
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.29); --grid:rgba(60,60,67,.12);
  --fill:rgba(120,120,128,.12); --press:rgba(120,120,128,.16);
  --tint:#007aff; --red:#ff3b30; --green:#34c759; --orange:#ff9500;
  --bar:rgba(249,249,249,.9); --alert:rgba(242,242,247,.96);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --sbg:#1c1c1e; --scard:#2c2c2e; --seg:#636366;
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.65); --grid:rgba(84,84,88,.4);
    --fill:rgba(118,118,128,.24); --press:rgba(118,118,128,.3);
    --tint:#0a84ff; --red:#ff453a; --green:#30d158; --orange:#ff9f0a;
    --bar:rgba(22,22,24,.9); --alert:rgba(44,44,46,.97);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--label);
  font:17px/1.29 var(--font);letter-spacing:-.2px;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
a{color:var(--tint);text-decoration:none}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.xs{width:13px;height:13px;stroke-width:2.3;vertical-align:-1px;margin-right:3px}
.i.ck{width:15px;height:15px;stroke-width:3.2}

/* ---------- Gerüst ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.nav{flex:none;position:relative;z-index:5;padding-top:var(--safe-t);background:var(--bg);transition:background-color .2s,box-shadow .2s}
.nav.sc{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 .5px 0 var(--sep)}
.nav-in{height:44px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px}
.nl{justify-self:start;display:flex;min-width:0}
.nr{justify-self:end;display:flex;gap:2px}
.nt{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:52vw;opacity:0;transition:opacity .15s}
.nav.st .nt,.nav.always .nt{opacity:1}
.nb{color:var(--tint);font-size:17px;min-height:44px;padding:0 8px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.nb.b{font-weight:600}
.nb:active,.ib:active{opacity:.4}
.nb .i{width:24px;height:24px}
.nb.ic{padding:0 6px}
#scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;position:relative}
.page{max-width:700px;margin:0 auto;padding:0 16px 32px}
.tabs{flex:none;display:flex;background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 -.5px 0 var(--sep);padding-bottom:var(--safe-b);z-index:5}
.tabs button{flex:1;height:50px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;font-weight:500;letter-spacing:.1px;color:#8e8e93;text-align:center}
.tabs button .i{width:27px;height:27px;stroke-width:1.7}
.tabs button.on{color:var(--tint)}
.tabs button.on .i{stroke-width:2.1}

/* ---------- Typografie ---------- */
.lt{font-size:34px;font-weight:700;letter-spacing:.35px;line-height:41px;margin:0}
.lts{font-size:15px;color:var(--label2);margin-top:1px}
.gh{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:-.05px;margin:24px 16px 7px;display:flex;justify-content:space-between}
.gh .ghr{text-transform:none;font-variant-numeric:tabular-nums}
.gf{font-size:13px;color:var(--label2);margin:7px 16px 0;line-height:1.38}
.muted{color:var(--label2)}
.mt{margin-top:24px}

/* ---------- Listen (Inset Grouped) ---------- */
.grp{background:var(--card);border-radius:10px;overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:44px;padding:10px 16px;position:relative;width:100%;font-size:17px;text-align:left;color:var(--label)}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:16px;border-top:.5px solid var(--sep)}
.cell.tap:active{background:var(--press)}
.cell .cg{flex:1;min-width:0;display:block}
.cell .ct{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cs{display:block;font-size:14px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cs.late{color:var(--red)} .cell .cs.warn{color:var(--orange)} .cell .cs.today{color:var(--tint)}
.cell .cv{color:var(--label2);white-space:nowrap}
.cell .chev{color:var(--label3);width:18px;height:18px;stroke-width:2.4;margin-right:-4px}
.cell.tint{color:var(--tint)} .cell.red{color:var(--red)}
.cell.tint .i,.cell.red .i{margin-left:-2px}
.cbar{width:4px;align-self:stretch;border-radius:2px;background:var(--c);flex:none;margin:2px 0}
.pi{width:30px;height:30px;border-radius:7px;display:flex;align-items:center;justify-content:center;background:var(--tint);color:#fff;flex:none}
.pi .i{width:19px;height:19px;stroke-width:2}
.pi.o{background:var(--orange)} .pi.g{background:#8e8e93} .pi.gr{background:var(--green)} .pi.r{background:var(--red)}
.ib{color:var(--label3);display:flex;align-items:center;justify-content:center;width:34px;height:34px;margin:-6px -8px -6px 0;flex:none}
.ib.t{color:var(--tint)}
.struck{text-decoration:line-through;color:var(--label2)}

/* ---------- Formular ---------- */
.fi{width:100%;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);padding:0;margin:0;min-width:0}
.fi::placeholder{color:var(--label3)}
textarea.fi{resize:none;min-height:96px;line-height:1.35;display:block}
.cell.ta{align-items:flex-start;padding-top:12px;padding-bottom:12px}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;border:0;outline:none;background:var(--fill);border-radius:7px;padding:6px 11px;font:inherit;font-size:17px;color:var(--label);min-width:98px;min-height:34px;text-align:center;font-variant-numeric:tabular-nums;margin:-4px 0}
input[type=date]{min-width:130px}
input::-webkit-date-and-time-value{text-align:center}
input[type=time]::-webkit-calendar-picker-indicator,input[type=date]::-webkit-calendar-picker-indicator{display:none}
.seg{display:flex;background:var(--fill);border-radius:9px;padding:2px;gap:0}
.seg button{flex:1;min-height:30px;border-radius:7px;font-size:13px;font-weight:500;text-align:center;padding:5px 4px;line-height:1.2;position:relative}
.seg button.on{background:var(--seg);box-shadow:0 3px 8px rgba(0,0,0,.12),0 3px 1px rgba(0,0,0,.04);font-weight:600}
.seg.big button{min-height:34px;font-size:14px}
.seg .sc{display:block;font-size:10px;color:var(--label2);font-weight:500}
.days{display:flex;justify-content:space-between;gap:4px;padding:12px 14px}
.days button{width:38px;height:38px;border-radius:50%;background:var(--fill);font-size:15px;font-weight:600;text-align:center}
.days button.on{background:var(--tint);color:#fff}
.presets{display:flex;gap:8px;padding:0 14px 12px}
.presets button{font-size:13px;color:var(--tint);background:var(--fill);border-radius:14px;padding:5px 11px;font-weight:500}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:14px 18px}
.cols button{aspect-ratio:1;border-radius:50%;background:var(--c);position:relative;max-width:40px;justify-self:center;width:100%}
.cols button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--c)}
.minus,.plusc{width:22px;height:22px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.minus{background:var(--red)} .plusc{background:var(--green)}
.minus::after{content:"";width:10px;height:2px;border-radius:1px;background:#fff}
.plusc .i{width:14px;height:14px;stroke-width:3}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .2s}
.sw.on{background:var(--green)} .sw.on::after{transform:translateX(20px)}

/* ---------- Haken ---------- */
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--label3);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .15s,border-color .15s}
.ck.on{background:var(--c,var(--tint));border-color:var(--c,var(--tint));color:#fff}
.ck.dash{border-style:dashed}
.ck .i.ck{stroke:currentColor}

/* ---------- Tag ---------- */
.wnav{display:flex;align-items:center;justify-content:space-between;margin:14px -6px 0}
.wnav span{font-size:13px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.2px}
.wnav button{color:var(--tint);width:40px;height:32px;display:flex;align-items:center;justify-content:center}
.wnav button:active{opacity:.4}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);margin:2px -6px 4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:3px 0;text-align:center}
.wd .w{font-size:11px;color:var(--label2);font-weight:600;text-transform:uppercase}
.wd .n{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:500;font-variant-numeric:tabular-nums}
.wd.today .n{color:var(--red);font-weight:600}
.wd.sel .n{background:var(--label);color:var(--bg);font-weight:600}
.wd.sel.today .n{background:var(--red);color:#fff}
.wd .dot{width:5px;height:5px;border-radius:50%}
.wd .dot.on{background:var(--label3)} .wd .dot.ex{background:var(--orange)}
.banner{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;display:flex;align-items:center;gap:12px}
.banner .pi{width:34px;height:34px;border-radius:9px}
.banner .bg{flex:1;min-width:0;font-size:15px}
.banner .bg b{font-weight:600}
.banner .bs{font-size:13px;color:var(--label2);margin-top:1px}
.pill{background:var(--fill);color:var(--tint);font-size:15px;font-weight:600;border-radius:16px;padding:7px 13px;white-space:nowrap;flex:none}
.pill:active{opacity:.5}
.pill.full{display:block;width:100%;text-align:center;margin-top:10px}
.banner.col{flex-wrap:wrap}
.nowc{background:var(--card);border-radius:12px;padding:14px;margin-top:12px}
.nowc .k{font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--c,var(--tint))}
.nowc .t{font-size:20px;font-weight:700;letter-spacing:-.3px;margin-top:2px}
.nowc .s{font-size:15px;color:var(--label2);margin-top:2px}
.prog{height:5px;border-radius:3px;background:var(--fill);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c,var(--tint));border-radius:3px}
.tl{margin-top:16px}
.slot{display:flex;gap:10px;align-items:stretch;background:var(--card);border-radius:12px;padding:11px 12px 11px 0;margin-bottom:8px;position:relative;cursor:pointer}
.slot:active{filter:brightness(.96)}
.slot.blocker{background:linear-gradient(var(--ct),var(--ct)),var(--card)}
.slot.now{box-shadow:inset 0 0 0 2px var(--c)}
.slot .tm{width:56px;flex:none;text-align:right;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:20px}
.slot .tm span{display:block;font-weight:400;color:var(--label2);font-size:13px}
.slot .bar{width:4px;border-radius:2px;background:var(--c);flex:none}
.slot .bd{flex:1;min-width:0}
.slot .tt{font-size:17px;font-weight:600;line-height:21px;overflow-wrap:anywhere}
.slot .meta{font-size:13px;color:var(--label2);margin-top:3px;display:flex;flex-wrap:wrap;gap:2px 10px}
.slot .np{font-size:13px;color:var(--label2);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;overflow-wrap:anywhere}
.slot .ck{align-self:center}
.slot.done .tt{color:var(--label2)}
.slot.skip{opacity:.5}
.slot.skip .tt{text-decoration:line-through}
.nowp{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:#fff;background:var(--c);border-radius:5px;padding:1px 6px;margin-bottom:3px}
.gap{font-size:13px;color:var(--label2);padding:0 0 8px 66px;opacity:.8}
.addrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;color:var(--tint);font-weight:500;font-size:16px;padding:12px;border-radius:12px;border:1.5px dashed var(--sep);margin-top:4px}
.addrow:active{background:var(--press)}
.empty{text-align:center;color:var(--label2);padding:36px 20px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--label);font-size:20px;margin-bottom:6px;font-weight:600}
.welcome{background:var(--card);border-radius:14px;padding:22px 18px;margin-top:16px;text-align:center}
.welcome .pi{width:56px;height:56px;border-radius:14px;margin:0 auto 12px}
.welcome .pi .i{width:32px;height:32px}
.welcome h2{font-size:22px;margin:0 0 6px;letter-spacing:-.3px}
.welcome p{margin:0 0 16px;color:var(--label2);font-size:15px;line-height:1.45}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:50px;border-radius:12px;background:var(--tint);color:#fff;font-weight:600;font-size:17px}
.btn.sec{background:var(--fill);color:var(--tint);margin-top:10px}
.btn:active{opacity:.7}
.hint{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px 14px;margin-top:16px;font-size:15px;width:100%}
.hint .cg{flex:1}

/* ---------- Woche ---------- */
.page.wk{padding:0 8px 24px}
.wkh{display:flex;align-items:center;justify-content:space-between;padding:4px 8px 10px}
.wkh .r{font-size:15px;color:var(--label2)}
.wk{background:var(--card);border-radius:12px}
.wk-h{position:sticky;top:0;z-index:3;display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr));background:var(--card);border-radius:12px 12px 0 0;box-shadow:0 .5px 0 var(--sep);padding:7px 0 5px}
.hd{text-align:center;font-size:11px;color:var(--label2);font-weight:600;text-transform:uppercase;min-width:0}
.hd b{display:block;font-size:17px;color:var(--label);font-weight:500;margin:1px auto 0;width:28px;height:28px;line-height:28px;border-radius:50%;font-variant-numeric:tabular-nums}
.hd.today b{background:var(--red);color:#fff;font-weight:600}
.hd .pl{display:block;font-size:9px;color:var(--orange);font-weight:700;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:12px;line-height:12px;padding:0 1px}
.wk-b{position:relative;display:grid;grid-template-columns:34px repeat(7,minmax(0,1fr))}
.wk-t{position:relative}
.wk-t span{position:absolute;right:5px;font-size:10px;color:var(--label2);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.wk-c{position:relative;border-left:.5px solid var(--grid);min-width:0}
.wk-c.today{background:rgba(255,59,48,.045)}
.wk-l{position:absolute;left:34px;right:0;border-top:.5px solid var(--grid);pointer-events:none}
.blk{position:absolute;border-radius:5px;background:linear-gradient(var(--cs),var(--cs)),var(--card);border-left:2.5px solid var(--c);padding:2px 2px 2px 3px;overflow:hidden;font-size:10.5px;line-height:1.18;color:var(--label);text-align:left;display:block}
.blk.routine{background:linear-gradient(var(--ct),var(--ct)),var(--card)}
.blk b{display:block;font-weight:600;overflow-wrap:anywhere;hyphens:auto;-webkit-hyphens:auto}
.blk i{display:block;font-style:normal;color:var(--label2);font-size:9.5px;font-variant-numeric:tabular-nums}
.blk.done{opacity:.5}
.blk.ed::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:var(--orange)}
.nowl{position:absolute;left:-3px;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.nowl::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* ---------- Detail ---------- */
.od{display:flex;gap:12px;background:var(--card);border-radius:12px;padding:14px 14px 14px 0;margin-top:4px}
.od .odb{width:5px;border-radius:0 3px 3px 0;background:var(--c);flex:none}
.od .odm{flex:1;min-width:0}
.od .odt{font-size:22px;font-weight:700;letter-spacing:-.3px;line-height:1.2;overflow-wrap:anywhere}
.od .ods{font-size:15px;color:var(--label2);margin-top:3px;font-variant-numeric:tabular-nums}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.tag{font-size:12px;font-weight:600;border-radius:6px;padding:2px 7px;background:var(--fill);color:var(--label2)}
.tag.o{background:rgba(255,149,0,.16);color:var(--orange)} .tag.r{background:rgba(255,59,48,.14);color:var(--red)} .tag.n{background:var(--c);color:#fff}
.rowmsg{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:13px;color:var(--label2);margin:10px 4px 0}
.lnk{color:var(--tint);font-size:13px;font-weight:600}
.bigck{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:48px;margin-top:14px;border-radius:12px;background:var(--card);color:var(--c);font-weight:600;font-size:17px}
.bigck .i{stroke-width:2.6}
.bigck.on{background:var(--c);color:#fff}
.bigck:active{opacity:.7}
.ntx{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.4;font-size:16px;-webkit-user-select:text;user-select:text}
.item.on .cg{color:var(--label2);text-decoration:line-through}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px -16px 0;padding:2px 16px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:58px;padding:7px 8px;border-radius:12px;background:var(--card);text-align:center;font-size:12px;color:var(--label2);font-weight:500}
.chip b{display:block;font-size:16px;color:var(--label);font-weight:600;margin-top:1px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--tint);color:rgba(255,255,255,.85)} .chip.on b{color:#fff}
.cell.sel{background:var(--press)}

/* ---------- Ebenen: Sheets, Alerts, Menüs ---------- */
.layer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);transition:background-color .3s}
.layer.in{background:rgba(0,0,0,.32)}
.layer.out{background:rgba(0,0,0,0)}
.sheet{--card:var(--scard);position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:700px;height:calc(100% - var(--safe-t) - 10px);background:var(--sbg);border-radius:12px 12px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .4s cubic-bezier(.32,.72,0,1);box-shadow:0 -1px 12px rgba(0,0,0,.08)}
.sheet.auto{height:auto;max-height:calc(100% - var(--safe-t) - 10px)}
.layer.in .sheet{transform:translateY(0)}

</style>

<body>

  </nav>
</div>

<script>
'use strict';
const APP_VERSION = '1.0.0';
const KEY = 'sp.data.v1', DATA_V = 1;

/* ================= Hilfen ================= */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

const P = {
  chevL:'<path d="M14.5 5 7.5 12l7 7"/>', chevR:'<path d="M9.5 5l7 7-7 7"/>', plus:'<path d="M12 5v14M5 12h14"/>',
  more:'<circle cx="12" cy="12" r="9.3"/><circle cx="7.9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="16.1" cy="12" r="1" fill="currentColor" stroke="none"/>',
  check:'<path d="M5 12.5 10 17.5 19 7"/>', lock:'<rect x="5" y="11" width="14" height="9.5" rx="2.2"/><path d="M8.5 11V8a3.5 3.5 0 0 1 7 0v3"/>',
  list:'<path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.8" cy="7" r="1" fill="currentColor" stroke="none"/><circle cx="4.8" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="4.8" cy="17" r="1" fill="currentColor" stroke="none"/>',
  x:'<path d="M7 7l10 10M17 7 7 17"/>', pencil:'<path d="M4 20h4L19 9a2.8 2.8 0 0 0-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>',
  trash:'<path d="M4.5 6.5h15M9.5 6.5v-2h5v2M6.5 6.5l1 13h9l1-13"/>', undo:'<path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/>',
  skip:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>', sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4"/>',
  star:'<path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.8z"/>', layers:'<path d="M12 4 3.5 8.5 12 13l8.5-4.5z"/><path d="M3.5 12.5 12 17l8.5-4.5"/>',
  calplus:'<rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4M12 12.5v5M9.5 15h5"/>',
  share:'<path d="M12 3.5v11M7.5 8 12 3.5 16.5 8"/><path d="M8 11H5.5v9.5h13V11H16"/>', down:'<path d="M12 4v11M7.5 10.5 12 15l4.5-4.5"/><path d="M5 19.5h14"/>',
  warn:'<path d="M12 4 2.8 20h18.4z"/><path d="M12 10v4.5M12 17.2v.3"/>', clock:'<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/>',
  week:'<rect x="3" y="4" width="18" height="16.5" rx="3.5"/><path d="M3 9h18M9 9v11.5M15 9v11.5M3 14.75h18"/>', copy:'<rect x="8" y="8" width="12" height="12" rx="2.5"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>'
};
const I = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n] || ''}</svg>`;
const CHEV = I('chevR', 'chev');

const COLORS = [
  ['blue','#007aff','#0a84ff'], ['indigo','#5856d6','#5e5ce6'], ['purple','#af52de','#bf5af2'], ['pink','#ff2d55','#ff375f'],
  ['red','#ff3b30','#ff453a'], ['orange','#ff9500','#ff9f0a'], ['yellow','#ffcc00','#ffd60a'], ['green','#34c759','#30d158'],
  ['mint','#00c7be','#63e6e2'], ['teal','#30b0c7','#40c8e0'], ['brown','#a2845e','#ac8e68'], ['gray','#8e8e93','#98989d']
];
(() => {
  const rgba = (h, a) => { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${a})`; };
  let l = '', d = '';
  for (const [k, a, b] of COLORS){ l += `.c-${k}{--c:${a};--ct:${rgba(a,.14)};--cs:${rgba(a,.24)}}`; d += `.c-${k}{--c:${b};--ct:${rgba(b,.2)};--cs:${rgba(b,.34)}}`; }
  const st = document.createElement('style'); st.textContent = l + `@media (prefers-color-scheme: dark){${d}}`; document.head.appendChild(st);
})();
const colorOk = c => COLORS.some(x => x[0] === c);

/* ================= Datum & Zeit ================= */
const WD_S = ['Mo','Di','Mi','Do','Fr','Sa','So'];
const WD_L = ['Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag','Sonntag'];
const MON_S = ['Jan.','Feb.','März','Apr.','Mai','Juni','Juli','Aug.','Sept.','Okt.','Nov.','Dez.'];
const MON_L = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const pad = n => String(n).padStart(2, '0');
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12); };
const isKey = k => typeof k === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(k) && dkey(pd(k)) === k;
const addD = (k, n) => { const d = pd(k); d.setDate(d.getDate() + n); return dkey(d); };
const diffD = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const wdOf = k => (pd(k).getDay() + 6) % 7 + 1;
const today = () => dkey(new Date());
const monday = k => addD(k, 1 - wdOf(k));
const isTime = t => typeof t === 'string' && /^\d{2}:\d{2}$/.test(t) && +t.slice(0, 2) < 24 && +t.slice(3) < 60;
const tmin = t => +t.slice(0, 2) * 60 + +t.slice(3);
const fmtT = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} Std. ${r} Min.` : `${h} Std.`) : `${r} Min.`; };
function fD(k, o = {}){
  const d = pd(k), w = wdOf(k) - 1;
  let s = `${d.getDate()}. ${o.long ? MON_L[d.getMonth()] : MON_S[d.getMonth()]}`;
  if (o.year) s += ` ${d.getFullYear()}`;
  if (o.wd === 'long') s = `${WD_L[w]}, ${s}`; else if (o.wd !== false) s = `${WD_S[w]}., ${s}`;
  return s;
}
const fNum = k => { const d = pd(k); return `${pad(d.getDate())}.${pad(d.getMonth() + 1)}.${d.getFullYear()}`; };
function rel(k, o){ const n = diffD(today(), k); return n === 0 ? 'Heute' : n === 1 ? 'Morgen' : n === -1 ? 'Gestern' : fD(k, o); }
function kw(k){ const d = pd(k); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4, 12); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); }
function daysLabel(days){
  const s = [...days].sort();
  if (s.length === 7) return 'Täglich';
  if (same(s, [1,2,3,4,5])) return 'Mo–Fr';
  if (same(s, [6,7])) return 'Wochenende';
  const parts = []; let i = 0;
  while (i < s.length){ let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; parts.push(j - i >= 2 ? `${WD_S[s[i]-1]}–${WD_S[s[j]-1]}` : s.slice(i, j + 1).map(x => WD_S[x-1]).join(', ')); i = j + 1; }
  return parts.join(', ') || 'Kein Tag';
}

/* ================= Daten ================= */
const FIELDS = ['title','type','start','end','color','note','items'];
const blank = () => ({ v: DATA_V, plans: [{ id: 'std', name: 'Normale Woche', slots: [] }], periods: [], ov: {}, chk: {}, todos: [] });
const normItems = a => Array.isArray(a) ? a.filter(i => i && typeof i.text === 'string' && i.text.trim()).map(i => ({ id: String(i.id || uid()), text: i.text })) : [];
function normSlot(s, withDays){
  const o = { id: String(s.id || uid()), title: typeof s.title === 'string' && s.title.trim() ? s.title : 'Ohne Titel', type: s.type === 'blocker' ? 'blocker' : 'routine',
    start: isTime(s.start) ? s.start : '08:00', end: isTime(s.end) ? s.end : '09:00', color: colorOk(s.color) ? s.color : 'blue',
    note: typeof s.note === 'string' ? s.note : '', items: normItems(s.items) };
  if (tmin(o.end) <= tmin(o.start)){ o.end = fmtT(Math.min(tmin(o.start) + 60, 1439)); if (tmin(o.end) <= tmin(o.start)) o.start = fmtT(tmin(o.end) - 1); }
  if (withDays) o.days = [...new Set((Array.isArray(s.days) ? s.days : []).map(Number).filter(n => n >= 1 && n <= 7))].sort();
  return o;
}
function cleanEdit(e){
  const o = {}; if (!e || typeof e !== 'object') return o;
  if (typeof e.title === 'string' && e.title.trim()) o.title = e.title;
  if (e.type === 'routine' || e.type === 'blocker') o.type = e.type;
  if (isTime(e.start)) o.start = e.start;
  if (isTime(e.end)) o.end = e.end;
  if (colorOk(e.color)) o.color = e.color;
  if (typeof e.note === 'string') o.note = e.note;
  if (Array.isArray(e.items)) o.items = normItems(e.items);
  return o;
}
// Gespeicherte Daten jeder Version in das aktuelle Format bringen. Nie Daten wegwerfen, nur reparieren.
function migrate(d){
  const out = blank();
  if (!d || typeof d !== 'object') return out;
  if (Array.isArray(d.plans)) out.plans = d.plans.filter(p => p && p.id).map(p => ({ id: String(p.id), name: typeof p.name === 'string' && p.name.trim() ? p.name : 'Plan', slots: (Array.isArray(p.slots) ? p.slots : []).filter(s => s && typeof s === 'object').map(s => normSlot(s, true)) }));
  const seenIds = new Set(); for (const p of out.plans) for (const s of p.slots){ if (seenIds.has(s.id)) s.id = uid(); seenIds.add(s.id); }
  let std = out.plans.find(p => p.id === 'std');
  if (!std) std = { id: 'std', name: 'Normale Woche', slots: [] };
  out.plans = [std, ...out.plans.filter(p => p !== std && p.id !== 'std')];
  const pids = new Set(out.plans.map(p => p.id));
  if (Array.isArray(d.periods)) out.periods = d.periods.filter(p => p && pids.has(p.planId) && p.planId !== 'std' && isKey(p.from) && isKey(p.to))
    .map(p => ({ id: String(p.id || uid()), planId: p.planId, from: p.from <= p.to ? p.from : p.to, to: p.from <= p.to ? p.to : p.from }));
  if (d.ov && typeof d.ov === 'object') for (const [k, o] of Object.entries(d.ov)){
    if (!isKey(k) || !o || typeof o !== 'object') continue;
    const n = { s: {}, x: [] };
    if (o.s && typeof o.s === 'object') for (const [id, v] of Object.entries(o.s)){ if (!v || typeof v !== 'object') continue; const e = cleanEdit(v.e); const r = {}; if (v.skip) r.skip = true; if (Object.keys(e).length) r.e = e; if (r.skip || r.e) n.s[id] = r; }
    if (Array.isArray(o.x)) n.x = o.x.filter(s => s && typeof s === 'object').map(s => normSlot(s, false));
    if (Object.keys(n.s).length || n.x.length) out.ov[k] = n;
  }
  if (d.chk && typeof d.chk === 'object') for (const [k, day] of Object.entries(d.chk)){
    if (!isKey(k) || !day || typeof day !== 'object') continue;
    const n = {}; for (const [id, c] of Object.entries(day)){ if (!c || typeof c !== 'object') continue; const i = {}; if (c.i && typeof c.i === 'object') for (const [x, v] of Object.entries(c.i)) if (v) i[x] = true; if (c.d || Object.keys(i).length) n[id] = { d: !!c.d, i }; }
    if (Object.keys(n).length) out.chk[k] = n;
  }
  if (Array.isArray(d.todos)) out.todos = d.todos.filter(t => t && typeof t.title === 'string' && t.title.trim()).map(t => ({
    id: String(t.id || uid()), title: t.title, note: typeof t.note === 'string' ? t.note : '', done: !!t.done, doneAt: t.done ? (+t.doneAt || Date.now()) : null,
    due: isKey(t.due) ? t.due : null, at: t.at && isKey(t.at.date) && t.at.slot ? { date: t.at.date, slot: String(t.at.slot) } : null, created: +t.created || Date.now() }));
  return out;
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return blank();
  try { return migrate(JSON.parse(raw)); }
  catch (e) { try { localStorage.setItem('sp.defekt.' + Date.now(), raw); } catch (_) {} return blank(); }
}
let D = load();
const OCC = new Map();
function save(){
  OCC.clear();
  try { localStorage.setItem(KEY, JSON.stringify(D)); return true; }
  catch (e) { toast('Speichern fehlgeschlagen. Ist der Speicher voll?'); return false; }
}
function replaceData(n){ D = n; save(); }

const planById = id => D.plans.find(p => p.id === id);
const stdPlan = () => planById('std');
function periodAt(k){ for (let i = D.periods.length - 1; i >= 0; i--){ const p = D.periods[i]; if (p.from <= k && k <= p.to && planById(p.planId)) return p; } return null; }
const planAt = k => { const p = periodAt(k); return p ? planById(p.planId) : stdPlan(); };
const ensureOv = k => D.ov[k] || (D.ov[k] = { s: {}, x: [] });
function cleanOv(k){
  const o = D.ov[k]; if (!o) return;
  for (const id of Object.keys(o.s)){ const r = o.s[id]; if (r.e && !Object.keys(r.e).length) delete r.e; if (!r.skip && !r.e) delete o.s[id]; }
  if (!Object.keys(o.s).length && !o.x.length) delete D.ov[k];
}
// Alle Time-Slots eines Datums: Plan des Tages (Normalwoche oder Ausnahme) + Änderungen nur für diesen Tag.
function occ(k){
  if (OCC.has(k)) return OCC.get(k);
  const plan = planAt(k), wd = wdOf(k), o = D.ov[k], out = [];
  for (const s of plan.slots){
    if (!s.days.includes(wd)) continue;
    const r = o && o.s[s.id], e = r && r.e;
    const x = { ...s, ...(e || {}), id: s.id, days: s.days, base: s, extra: false, edited: !!(e && Object.keys(e).length), skipped: !!(r && r.skip), date: k, planId: plan.id };
    if (tmin(x.end) <= tmin(x.start)) x.end = fmtT(Math.min(tmin(x.start) + 30, 1439));
    out.push(x);
  }
  if (o) for (const s of o.x) out.push({ ...s, base: null, extra: true, edited: false, skipped: false, date: k, planId: plan.id });
  out.sort((a, b) => tmin(a.start) - tmin(b.start) || tmin(a.end) - tmin(b.end) || a.title.localeCompare(b.title, 'de'));
  OCC.set(k, out);
  return out;
}
const findOcc = (k, id) => occ(k).find(o => o.id === id) || null;
const dayAdjusted = k => occ(k).some(o => o.edited || o.skipped || o.extra);
const chkOf = (k, id) => (D.chk[k] && D.chk[k][id]) || null;
function setChk(k, id, fn){
  const day = D.chk[k] || (D.chk[k] = {});
  const c = day[id] || (day[id] = { d: false, i: {} });
  fn(c);
  for (const x of Object.keys(c.i)) if (!c.i[x]) delete c.i[x];
  if (!c.d && !Object.keys(c.i).length) delete day[id];
  if (!Object.keys(day).length) delete D.chk[k];
}
const todosAt = (k, id) => D.todos.filter(t => t.at && t.at.date === k && t.at.slot === id);
function atOcc(t){ if (!t.at) return null; const o = findOcc(t.at.date, t.at.slot); return o && !o.skipped ? o : null; }
const newTodo = (title, at = null) => ({ id: uid(), title, note: '', done: false, doneAt: null, due: null, at, created: Date.now() });
function unassign(pred){ for (const t of D.todos) if (t.at && !t.done && pred(t)) t.at = null; }

/* ================= UI-Grundlagen ================= */
const nav = $('#nav'), navL = $('#navL'), navT = $('#navT'), navR = $('#navR'), scroller = $('#scroll'), page = $('#page');
const ui = { tab: 'day', day: today(), week: monday(today()), plan: null, pwd: wdOf(today()), showDone: false, scroll: {}, lastToday: today() };
const A = {};
const stack = [];

let toastT = null, toastUndo = null;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-a="_undo">Rückgängig</button>' : ''}`;
  toastUndo = undo || null;
  el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => { el.classList.remove('on'); toastUndo = null; }, undo ? 5000 : 2400);
}
A._undo = () => { const u = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (u) u(); };
// Änderung mit „Rückgängig“: kompletter Schnappschuss vorher, damit nichts verloren geht.
function withUndo(msg, fn){
  const snap = JSON.stringify(D);
  if (fn() === false) return;
  save(); refreshAll();
  toast(msg, () => { replaceData(migrate(JSON.parse(snap))); refreshAll(); });
}

function sheet(o){
  const L = document.createElement('div');
  L.className = 'layer';
  L.innerHTML = `<div class="sheet ${o.auto ? 'auto' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title || '')}"><div class="grab"></div><div class="sh"><div class="nl">${o.left ? `<button class="nb" data-a="_left">${o.left}</button>` : ''}</div><div class="sht">${esc(o.title || '')}</div><div class="nr">${o.right ? `<button class="nb ${o.rightPlain ? '' : 'b'}" data-a="_right">${o.right}</button>` : ''}</div></div><div class="sb"></div></div>`;
  const sh = L.firstElementChild, sb = $('.sb', L);
  const S = {
    el: L, sb, closed: false,
    set(html){ const st = sb.scrollTop; sb.innerHTML = html; sb.scrollTop = st; },
    close(){
      if (S.closed) return; S.closed = true;
      const ae = document.activeElement; if (ae && L.contains(ae)) ae.blur();
      L.classList.remove('in'); L.classList.add('out');
      const i = stack.indexOf(S); if (i >= 0) stack.splice(i, 1);
      setTimeout(() => L.remove(), 420);
      o.onClose && o.onClose();
    },
    cancel(){ S.close(); }
  };
  L._on = { ...(o.on || {}), _left: () => o.onLeft ? o.onLeft(S) : S.cancel(), _right: () => o.onRight ? o.onRight(S) : S.close() };
  L.addEventListener('click', e => { if (e.target === L) S.cancel(); });
  if (o.onInput){
    L.addEventListener('input', e => { if (e.target.name) o.onInput(e.target.name, e.target.value, e.target, 'input'); });
    L.addEventListener('change', e => { if (e.target.name) o.onInput(e.target.name, e.target.value, e.target, 'change'); });
  }
  // Zum Schließen nach unten ziehen (wie bei iOS)
  let y0 = null, dy = 0;
  const head = $('.sh', L);
  head.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  head.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sh.style.transition = ''; if (dy > 110){ sh.style.transform = 'translateY(100%)'; S.cancel(); } else sh.style.transform = ''; }, { passive: true });
  S.set(o.body || '');
  document.body.appendChild(L);
  stack.push(S);
  L.getBoundingClientRect();
  requestAnimationFrame(() => L.classList.add('in'));
  return S;
}
function ask({ title, msg = '', ok = 'OK', cancel = 'Abbrechen', danger = false }){
  return new Promise(res => {
    const L = document.createElement('div');
    L.className = 'layer al';
    L.innerHTML = `<div class="alert" role="alertdialog"><div class="ab"><div class="at">${esc(title)}</div>${msg ? `<div class="am">${esc(msg)}</div>` : ''}</div><div class="abt"><button data-a="c">${esc(cancel)}</button><button data-a="o" class="${danger ? 'd' : 'b'}">${esc(ok)}</button></div></div>`;
    let done = false;
    const fin = v => { if (done) return; done = true; L.classList.remove('in'); L.classList.add('out'); setTimeout(() => L.remove(), 250); res(v); };
    L._on = { c: () => fin(false), o: () => fin(true) };
    document.body.appendChild(L); L.getBoundingClientRect();
    requestAnimationFrame(() => L.classList.add('in'));
  });
}
function menu(title, items){
  const L = document.createElement('div');
  L.className = 'layer as';
  L.innerHTML = `<div class="asw"><div class="asg">${title ? `<div class="ash">${esc(title)}</div>` : ''}${items.map((it, i) => `<button class="${it.danger ? 'd' : ''}" data-a="i" data-i="${i}">${esc(it.label)}</button>`).join('')}</div><button class="asc" data-a="x">Abbrechen</button></div>`;
  let done = false;
  const close = () => { if (done) return false; done = true; L.classList.remove('in'); L.classList.add('out'); setTimeout(() => L.remove(), 380); return true; };
  L._on = { i: el => { if (close()) items[+el.dataset.i].fn(); }, x: close };
  L.addEventListener('click', e => { if (e.target === L) close(); });
  document.body.appendChild(L); L.getBoundingClientRect();
  requestAnimationFrame(() => L.classList.add('in'));
}

/* ================= Rendering ================= */
const VIEWS = {};
function render(){
  const v = VIEWS[ui.tab]();
  navL.innerHTML = v.left || ''; navR.innerHTML = v.right || ''; navT.textContent = v.title || '';
  nav.classList.toggle('always', !!v.navAlways);
  page.className = 'page ' + (v.cls || '');
  page.innerHTML = v.body;
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.t === ui.tab);
  onScroll();
}
function refreshAll(){ render(); for (const s of stack.slice()) if (s.refresh && !s.closed) s.refresh(); }
function onScroll(){ const y = scroller.scrollTop; nav.classList.toggle('sc', y > 4); nav.classList.toggle('st', y > 40); }
scroller.addEventListener('scroll', onScroll, { passive: true });

function switchTab(t){
  if (t === ui.tab){
    if (t === 'plan' && ui.plan){ ui.plan = null; render(); }
    else if (t === 'day' && ui.day !== today()){ ui.day = today(); render(); }
    else if (t === 'week' && ui.week !== monday(today())){ ui.week = monday(today()); render(); scrollWeekToNow(); return; }
    scroller.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  ui.scroll[ui.tab] = scroller.scrollTop;
  ui.tab = t;
  render();
  if (t === 'week' && ui.scroll.week === undefined) scrollWeekToNow();
  else scroller.scrollTop = ui.scroll[t] || 0;
  onScroll();
}
A.tab = el => switchTab(el.dataset.t);

/* ---------- Tag ---------- */
VIEWS.day = () => {
  const k = ui.day, t = today(), isT = k === t, n = nowMin();
  const per = periodAt(k), list = occ(k), mon = monday(k);
  const adj = list.some(o => o.edited || o.skipped || o.extra);
  let h = `<h1 class="lt">${isT ? 'Heute' : WD_L[wdOf(k) - 1]}</h1><div class="lts">${isT ? fD(k, { wd: 'long', long: true, year: true }) : `${fD(k, { wd: false, long: true, year: true })}${Math.abs(diffD(t, k)) === 1 ? ' · ' + rel(k) : ''}`}</div>`;
  h += `<div class="wnav"><button data-a="dayWeek" data-n="-7" aria-label="Vorherige Woche">${I('chevL')}</button><span>${MON_L[pd(addD(mon, 3)).getMonth()]} · KW ${kw(mon)}</span><button data-a="dayWeek" data-n="7" aria-label="Nächste Woche">${I('chevR')}</button></div>`;
  h += `<div class="wstrip" data-swipe="week7">`;
  for (let i = 0; i < 7; i++){
    const d = addD(mon, i);
    const dot = periodAt(d) ? 'ex' : dayAdjusted(d) ? 'on' : '';
    h += `<button class="wd ${d === t ? 'today' : ''} ${d === k ? 'sel' : ''}" data-a="pickDay" data-d="${d}"><span class="w">${WD_S[i]}</span><span class="n">${pd(d).getDate()}</span><span class="dot ${dot}"></span></button>`;
  }
  h += `</div>`;
  if (per){
    const p = planById(per.planId);
    h += `<div class="banner col"><div class="pi o">${I('sun')}</div><div class="bg"><b>${esc(p.name)}</b> statt Normaler Woche<div class="bs">${fNum(per.from)} – ${fNum(per.to)}</div></div><button class="pill full" data-a="endPeriod" data-id="${per.id}">Zurück zur Normalwoche${isT ? '' : ' ab ' + fD(k, { wd: false })}</button></div>`;
  }
  if (adj) h += `<div class="banner"><div class="bg">Dieser Tag ist individuell angepasst.</div><button class="pill" data-a="resetDay">Zurücksetzen</button></div>`;

  const hasAny = D.plans.some(p => p.slots.length) || Object.keys(D.ov).length;
  if (!hasAny){
    h += `<div class="welcome"><div class="pi">${I('week')}</div><h2>Deine perfekte Woche</h2><p>Trag einmal ein, wann du was machst: feste <b>Blocker</b> wie Arbeit oder Schule und <b>Routinen</b> wie Sport oder Lernen. Danach siehst du hier jeden Tag deinen Plan.</p><button class="btn" data-a="startSetup">Woche einrichten</button><button class="btn sec" data-a="sample">Mit Beispielwoche starten</button></div>`;
    return { title: isT ? 'Heute' : WD_L[wdOf(k) - 1], body: h, left: isT ? '' : `<button class="nb" data-a="goToday">Heute</button>` };
  }
  const live = list.filter(o => !o.skipped);
  if (isT && live.length){
    const cur = live.filter(o => tmin(o.start) <= n && n < tmin(o.end)).pop();
    const nxt = live.find(o => tmin(o.start) > n);
    if (cur){
      const s = tmin(cur.start), e = tmin(cur.end), pct = Math.round((n - s) / (e - s) * 100);
      h += `<div class="nowc c-${cur.color}" data-a="openOcc" data-d="${k}" data-id="${esc(cur.id)}" role="button"><div class="k">Jetzt</div><div class="t">${esc(cur.title)}</div><div class="s">noch ${fmtDur(e - n)} · bis ${cur.end}${nxt ? ` · danach ${esc(nxt.title)}` : ''}</div><div class="prog"><i style="width:${pct}%"></i></div></div>`;
    } else if (nxt){
      h += `<div class="nowc c-${nxt.color}" data-a="openOcc" data-d="${k}" data-id="${esc(nxt.id)}" role="button"><div class="k">Als Nächstes</div><div class="t">${esc(nxt.title)}</div><div class="s">um ${nxt.start} · in ${fmtDur(tmin(nxt.start) - n)}</div></div>`;
    } else {
      h += `<div class="nowc"><div class="k">Feierabend</div><div class="t">Für heute ist alles durch.</div></div>`;
    }
  }
  h += `<div class="tl" data-swipe="day1">`;
  if (!list.length) h += `<div class="empty"><b>Nichts geplant</b>An diesem Tag gibt es keine Time-Slots.</div>`;
  let prevEnd = null;
  for (const o of list){
    const s = tmin(o.start), e = tmin(o.end);
    if (!o.skipped){
      if (prevEnd !== null && s - prevEnd >= 15) h += `<div class="gap">${fmtDur(s - prevEnd)} frei</div>`;
      prevEnd = Math.max(prevEnd ?? 0, e);
    }
    h += slotRow(o, isT && !o.skipped && s <= n && n < e);
  }
  h += `<button class="addrow" data-a="addDaySlot">${I('plus')}Time-Slot hinzufügen</button></div>`;
  const loose = D.todos.filter(x => !x.done && !atOcc(x)).length;
  if (loose) h += `<button class="hint" data-a="tab" data-t="todo"><span class="pi g">${I('list')}</span><span class="cg">${loose === 1 ? '1 To-Do wartet' : loose + ' To-Dos warten'} noch auf einen Time-Slot.</span>${CHEV}</button>`;
  return {
    title: isT ? 'Heute' : WD_L[wdOf(k) - 1], body: h,
    left: isT ? '' : `<button class="nb" data-a="goToday">${I('chevL')}Heute</button>`,
    right: `<button class="nb ic" data-a="dayMenu" aria-label="Mehr">${I('more')}</button>`
  };
};
function slotRow(o, now){
  const c = chkOf(o.date, o.id), done = !!(c && c.d);
  const td = todosAt(o.date, o.id), tdDone = td.filter(t => t.done).length;
  const ni = o.items.length, nd = o.items.filter(i => c && c.i[i.id]).length;
  let meta = [];
  if (o.skipped) meta = ['Fällt an diesem Tag aus'];
  else {
    meta.push(o.type === 'blocker' ? `${I('lock', 'xs')}Blocker` : 'Routine');
    if (ni) meta.push(`${I('list', 'xs')}${nd}/${ni}`);
    if (td.length) meta.push(`${I('check', 'xs')}${tdDone}/${td.length} To-Do${td.length > 1 ? 's' : ''}`);
    if (o.extra) meta.push('Einmalig'); else if (o.edited) meta.push('Angepasst');
  }
  return `<div class="slot c-${o.color} ${o.type}${now ? ' now' : ''}${o.skipped ? ' skip' : ''}${done ? ' done' : ''}" data-a="openOcc" data-d="${o.date}" data-id="${esc(o.id)}" role="button">
    <div class="tm">${o.start}<span>${o.end}</span></div><div class="bar"></div>
    <div class="bd">${now ? '<span class="nowp">Jetzt</span>' : ''}<div class="tt">${esc(o.title)}</div><div class="meta">${meta.map(m => `<span>${m}</span>`).join('')}</div>${o.note && !o.skipped ? `<div class="np">${esc(o.note)}</div>` : ''}</div>
    ${o.type === 'routine' && !o.skipped ? `<button class="ck${done ? ' on' : ''}" data-a="toggleDone" data-d="${o.date}" data-id="${esc(o.id)}" aria-label="Erledigt">${I('check', 'ck')}</button>` : ''}
  </div>`;
}
A.pickDay = el => { ui.day = el.dataset.d; render(); };
A.dayWeek = el => { ui.day = addD(ui.day, +el.dataset.n); render(); };
A.goToday = () => { ui.day = today(); render(); };
A.openOcc = el => openOcc(el.dataset.d, el.dataset.id);
A.toggleDone = el => { setChk(el.dataset.d, el.dataset.id, c => { c.d = !c.d; }); save(); refreshAll(); };
A.addDaySlot = () => slotEditor({ mode: 'newDay', date: ui.day });
A.startSetup = () => { ui.plan = 'std'; ui.pwd = 1; switchTab('plan'); };
A.sample = () => loadSample();
A.endPeriod = el => endPeriod(el.dataset.id, ui.day);
A.resetDay = () => resetDay(ui.day);
A.dayMenu = () => {
  const k = ui.day, per = periodAt(k), items = [];
  items.push({ label: 'Time-Slot nur an diesem Tag', fn: () => slotEditor({ mode: 'newDay', date: k }) });
  for (const p of D.plans) if (p.id !== 'std' && (!per || per.planId !== p.id)) items.push({ label: `${p.name} ab ${rel(k, { wd: false })}`, fn: () => periodSheet({ planId: p.id, from: k }) });
  items.push({ label: 'Ausnahme planen (z. B. Ferien)', fn: () => periodSheet({ from: k }) });
  if (per) items.push({ label: 'Zurück zur Normalwoche', fn: () => endPeriod(per.id, k) });
  if (dayAdjusted(k)) items.push({ label: 'Tag auf Vorlage zurücksetzen', danger: true, fn: () => resetDay(k) });
  menu(fD(k, { wd: 'long' }), items);
};
function endPeriod(pid, fromDay){
  withUndo('Zurück zur Normalen Woche', () => {
    const p = D.periods.find(x => x.id === pid); if (!p) return false;
    const cut = addD(fromDay, -1);
    if (cut < p.from) D.periods = D.periods.filter(x => x !== p); else p.to = cut;
  });
}
function resetDay(k){
  withUndo('Tag zurückgesetzt', () => {
    const o = D.ov[k]; if (!o) return false;
    const xs = new Set(o.x.map(s => s.id));
    unassign(t => t.at.date === k && xs.has(t.at.slot));
    delete D.ov[k];
  });
}

/* ---------- Woche ---------- */
const PPM = 0.9, TOP = 10, MINV = 24;
VIEWS.week = () => {
  const mon = ui.week, t = today(), n = nowMin(), isCur = mon === monday(t);
  const days = [...Array(7)].map((_, i) => addD(mon, i));
  const lists = days.map(d => occ(d).filter(o => !o.skipped));
  let minS = 7 * 60, maxE = 21 * 60;
  for (const l of lists) for (const o of l){ minS = Math.min(minS, tmin(o.start)); maxE = Math.max(maxE, tmin(o.end)); }
  const H0 = Math.floor(minS / 60), H1 = Math.min(24, Math.ceil(maxE / 60));
  const Y = m => TOP + (m - H0 * 60) * PPM;
  const height = Y(H1 * 60) + TOP;
  let h = `<div class="wkh"><span class="r">${fD(days[0], { wd: false })} – ${fD(days[6], { wd: false, year: true })}</span>${isCur ? '' : `<button class="pill" data-a="weekNow">Diese Woche</button>`}</div>`;
  h += `<div class="wk" data-swipe="wk"><div class="wk-h"><span></span>`;
  days.forEach((d, i) => { const per = periodAt(d); h += `<button class="hd${d === t ? ' today' : ''}" data-a="gotoDay" data-d="${d}">${WD_S[i]}<b>${pd(d).getDate()}</b><span class="pl">${per ? esc(planById(per.planId).name) : ''}</span></button>`; });
  h += `</div><div class="wk-b" style="height:${height}px"><div class="wk-t">`;
  for (let hr = H0; hr <= H1; hr++) h += `<span style="top:${Y(hr * 60)}px">${pad(hr % 24)}:00</span>`;
  h += `</div>`;
  for (let hr = H0; hr <= H1; hr++) h += `<div class="wk-l" style="top:${Y(hr * 60)}px"></div>`;
  days.forEach((d, i) => {
    h += `<div class="wk-c${d === t ? ' today' : ''}">`;
    for (const { o, lane, cols } of layout(lists[i])){
      const s = tmin(o.start), e = tmin(o.end), c = chkOf(d, o.id);
      const hh = Math.max((e - s) * PPM, MINV * PPM) - 2;
      h += `<button class="blk c-${o.color} ${o.type}${c && c.d ? ' done' : ''}${o.edited || o.extra ? ' ed' : ''}" style="top:${Y(s) + 1}px;height:${hh}px;left:calc(${lane * 100 / cols}% + 1px);width:calc(${100 / cols}% - 2px)" data-a="openOcc" data-d="${d}" data-id="${esc(o.id)}"><b>${esc(o.title)}</b>${hh > 30 ? `<i>${o.start}</i>` : ''}</button>`;
    }
    if (d === t && n >= H0 * 60 && n <= H1 * 60) h += `<div class="nowl" style="top:${Y(n) - 1}px"></div>`;
    h += `</div>`;
  });
  h += `</div></div>`;
  if (!lists.some(l => l.length)) h += `<div class="empty">In dieser Woche ist nichts geplant.<br>Leg deine Woche unter <b style="display:inline;font-size:inherit">Plan</b> an.</div>`;
  return { title: `KW ${kw(mon)}`, navAlways: true, cls: 'wk', body: h,
    left: `<button class="nb ic" data-a="weekPrev" aria-label="Vorherige Woche">${I('chevL')}</button>`,
    right: `<button class="nb ic" data-a="weekNext" aria-label="Nächste Woche">${I('chevR')}</button>` };
};
// Überlappende Slots nebeneinander anordnen (Spalten pro Überlappungsgruppe)
function layout(list){
  const out = []; let cl = [], ce = -1;
  const flush = () => {
    const ends = [], tmp = [];
    for (const o of cl){ const s = tmin(o.start); let li = ends.findIndex(e => e <= s); if (li < 0){ li = ends.length; ends.push(0); } ends[li] = Math.max(tmin(o.end), s + MINV); tmp.push({ o, lane: li }); }
    for (const x of tmp) out.push({ ...x, cols: ends.length });
    cl = []; ce = -1;
  };
  for (const o of list){ const s = tmin(o.start); if (cl.length && s >= ce) flush(); cl.push(o); ce = Math.max(ce, tmin(o.end), s + MINV); }
  if (cl.length) flush();
  return out;
}
function scrollWeekToNow(){
  const mon = ui.week, lists = [...Array(7)].map((_, i) => occ(addD(mon, i)).filter(o => !o.skipped));
  let minS = 7 * 60; for (const l of lists) for (const o of l) minS = Math.min(minS, tmin(o.start));
  const H0 = Math.floor(minS / 60);
  const target = mon === monday(today()) ? Math.max(nowMin() - 90, H0 * 60) : H0 * 60;
  scroller.scrollTop = Math.max(0, (target - H0 * 60) * PPM);
  onScroll();
}
A.weekPrev = () => { ui.week = addD(ui.week, -7); render(); };
A.weekNext = () => { ui.week = addD(ui.week, 7); render(); };
A.weekNow = () => { ui.week = monday(today()); render(); scrollWeekToNow(); };
A.gotoDay = el => { ui.day = el.dataset.d; switchTab('day'); };

/* ---------- To-Dos ---------- */
VIEWS.todo = () => ({
  title: 'To-Dos', body: `<h1 class="lt">To-Dos</h1>
  <div class="grp" style="margin-top:14px"><div class="cell"><span class="ck dash"></span><input class="fi" id="newTodo" placeholder="Neues To-Do" maxlength="200" enterkeyhint="done" autocomplete="off" data-enter="addTodo"><button class="nb b" data-a="addTodo" style="margin-right:-8px">Hinzufügen</button></div></div>
  <div id="tdl">${todoList()}</div>`
});
function todoList(){
  const open = D.todos.filter(t => !t.done), un = [], pl = [];
  for (const t of open){ const o = atOcc(t); if (o) pl.push({ t, o }); else un.push(t); }
  un.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || a.created - b.created);
  pl.sort((a, b) => a.o.date.localeCompare(b.o.date) || tmin(a.o.start) - tmin(b.o.start) || a.t.created - b.t.created);
  const done = D.todos.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  let h = '';
  if (un.length) h += `<div class="gh">Ohne Time-Slot</div><div class="grp">${un.map(t => todoRow(t, null)).join('')}</div>`;
  if (pl.length) h += `<div class="gh">Eingeplant</div><div class="grp">${pl.map(x => todoRow(x.t, x.o)).join('')}</div>`;
  if (!open.length) h += `<div class="empty"><b>${D.todos.length ? 'Alles erledigt' : 'Noch keine To-Dos'}</b>${D.todos.length ? 'Stark!' : 'Schreib oben auf, was ansteht. Danach kannst du jedes To-Do einem Time-Slot zuordnen.'}</div>`;
  else if (un.length) h += `<div class="gf">Tipp auf ${I('calplus', 'xs')} um ein To-Do einem Time-Slot zuzuordnen. Dann erscheint es dort zum Abhaken.</div>`;
  if (done.length){
    h += `<div class="gh">Erledigt <span class="ghr">${done.length}</span></div><div class="grp">`;

function todoRow(t, o){

  else if (t.due){ const d = diffD(today(), t.due); sub = `Fällig: ${rel(t.due)}`; cls = d < 0 ? 'late' : d === 0 ? 'today' : ''; }
  if (t.note && !t.done) sub = sub ? sub : esc(t.note.split('\n')[0]);
  return `<div class="cell"><button class="ck${t.done ? ' on' : ''}" data-a="todoDone" data-id="${t.id}" aria-label="Erledigt">${I('check', 'ck')}</button><button class="cg" data-a="openTodo" data-id="${t.id}"><span class="ct${t.done ? ' struck' : ''}">${esc(t.title)}</span>${sub ? `<span class="cs ${cls}">${sub}</span>` : ''}</button>${t.done ? '' : `<button class="ib t" data-a="assignTodo" data-id="${t.id}" aria-label="Time-Slot zuweisen">${I('calplus')}</button>`}</div>`;
}

    } else if (cfg.mode === 'occ' && o.extra){
      const x = D.ov[date] && D.ov[date].x.find(s => s.id === o.id); if (x) Object.assign(x, vals);
    } else if (cfg.mode === 'occ'){
      const live = plan.slots.find(s => s.id === base.id);
      if (!live){ S.close(); return; }
      if (scope === 'day'){
        const e = {}; for (const k of FIELDS) if (!same(vals[k], live[k])) e[k] = vals[k];
        const r = ensureOv(date).s[live.id] || (D.ov[date].s[live.id] = {});
        if (Object.keys(e).length) r.e = e; else delete r.e;
        cleanOv(date);
      } else {
        Object.assign(live, vals, { days });
        const r = D.ov[date] && D.ov[date].s[live.id]; if (r){ delete r.e; cleanOv(date); }
      }
    } else {
      if (scope === 'day') ensureOv(date).x.push({ id: uid(), ...vals });
      else plan.slots.push({ id: uid(), ...vals, days });
    }
    save(); S.close(); refreshAll();
  };
  const S = sheet({ title: isNew ? 'Neuer Time-Slot' : 'Bearbeiten', left: 'Abbrechen', right: isNew ? 'Hinzufügen' : 'Sichern', body: body(), onRight: save2,
    onInput: (name, v, el) => { if (name === 'item'){ const it = f.items[+el.dataset.i]; if (it) it.text = v; } else if (name in f) f[name] = v; },
    on: {
      scope: el => { scope = el.dataset.v; if (scope === 'week' && !f.days.length) f.days = base ? [...base.days] : [wdOf(date)]; rerender(); },
      type: el => { f.type = el.dataset.v; rerender(); },
      color: el => { f.color = el.dataset.v; rerender(); },
      day: el => { const v = +el.dataset.v; f.days = f.days.includes(v) ? f.days.filter(x => x !== v) : [...f.days, v]; rerender(); },
      preset: el => { f.days = el.dataset.v.split(',').map(Number); rerender(); },
      addItem: () => { f.items.push({ id: uid(), text: '' }); rerender(); const ins = S.el.querySelectorAll('[name=item]'); const last = ins[ins.length - 1]; if (last){ last.focus(); last.scrollIntoView({ block: 'center' }); } },
      delItem: el => { f.items.splice(+el.dataset.i, 1); rerender(); },
      del: () => { S.close(); withUndo('Time-Slot gelöscht', () => { plan.slots = plan.slots.filter(s => s !== base); for (const k of Object.keys(D.ov)){ delete D.ov[k].s[base.id]; cleanOv(k); } unassign(t => t.at.slot === base.id); }); }
    } });

function slotPicker(cur, cb){
  const t = today();
  let d = cur && cur.date >= t ? cur.date : t;
  const body = () => {
    const days = [...Array(14)].map((_, i) => addD(t, i));
    const n = nowMin(), per = periodAt(d), list = occ(d).filter(o => !o.skipped);
    let h = `<div class="chips">${days.map((x, i) => `<button class="chip${x === d ? ' on' : ''}" data-a="d" data-d="${x}">${i === 0 ? 'Heute' : i === 1 ? 'Morgen' : WD_S[wdOf(x) - 1]}<b>${pd(x).getDate()}.${pd(x).getMonth() + 1}.</b></button>`).join('')}</div>`;
    h += `<div class="grp" style="margin-top:12px"><div class="cell"><span class="cg">Anderes Datum</span><input type="date" name="date" value="${d}"></div></div>`;
    h += `<div class="gh">${fD(d, { wd: 'long' })}${per ? ` · ${esc(planById(per.planId).name)}` : ''}</div><div class="grp">`;
    h += list.map(o => { const sel = cur && cur.date === d && cur.slot === o.id, past = d === t && tmin(o.end) <= n; return `<button class="cell tap c-${o.color}${sel ? ' sel' : ''}" data-a="pick" data-id="${esc(o.id)}"><span class="cbar"></span><span class="cg"><span class="ct">${esc(o.title)}</span><span class="cs">${o.start} – ${o.end}${past ? ' · schon vorbei' : ''}</span></span>${sel ? `<span style="color:var(--tint)">${I('check')}</span>` : ''}</button>`; }).join('') || `<div class="cell"><span class="cg muted">Keine Time-Slots an diesem Tag.</span></div>`;
    h += `</div>`;

    return h;
  };
  const S = sheet({ title: 'Time-Slot wählen', left: 'Abbrechen', body: body(),
    onInput: (name, v, el, ev) => { if (name === 'date' && ev === 'change' && isKey(v)){ d = v; S.set(body()); } },
    on: {
      d: el => { d = el.dataset.d; S.set(body()); },

    h += `<div class="gh">Zeitraum</div><div class="grp"><div class="cell"><span class="cg">Von</span><input type="date" name="from" value="${f.from}"></div><div class="cell"><span class="cg">Bis</span><input type="date" name="to" value="${f.to}"></div></div>
      <div class="presets" style="padding:10px 4px 0"><button data-a="len" data-v="1">1 Tag</button><button data-a="len" data-v="7">1 Woche</button><button data-a="len" data-v="14">2 Wochen</button><button data-a="len" data-v="21">3 Wochen</button></div>`;
    h += `<div class="gf">${f.to >= f.from ? `${diffD(f.from, f.to) + 1} Tage. ` : ''}Danach gilt automatisch wieder deine Normale Woche.</div>`;
    if (p){
      h += `<div class="grp mt">`;
      if (p.from <= t && t <= p.to) h += `<button class="cell tap tint" data-a="endNow">${I('undo')}<span class="cg">Jetzt beenden (zurück zur Normalwoche)</span></button>`;
      h += `<button class="cell tap red" data-a="del">${I('trash')}<span class="cg">Zeitraum löschen</span></button></div>`;
    }
    return h;
  };
  const S = sheet({ title: p ? 'Zeitraum' : 'Ausnahme planen', left: 'Abbrechen', right: 'Sichern', body: body(),
    onInput: (name, v, el, ev) => {
      if (name === 'name') f.name = v;
      else if ((name === 'from' || name === 'to') && ev === 'change' && isKey(v)){ const len = diffD(f.from, f.to); f[name] = v; if (name === 'from' && f.to < f.from) f.to = addD(v, Math.max(len, 0)); S.set(body()); }
    },
    on: {
      plan: el => { f.planId = el.dataset.id; S.set(body()); },
      base: el => { f.base = el.dataset.v; S.set(body()); },
      len: el => { f.to = addD(f.from, +el.dataset.v - 1); S.set(body()); },
      endNow: () => { S.close(); endPeriod(p.id, today()); },
      del: () => { S.close(); withUndo('Zeitraum gelöscht', () => { D.periods = D.periods.filter(x => x.id !== p.id); }); }
    },
    onRight: () => {
      if (!isKey(f.from) || !isKey(f.to)){ toast('Bitte Beginn und Ende wählen.'); return; }
      if (f.to < f.from){ toast('Das Ende liegt vor dem Beginn.'); return; }
      let planId = f.planId, created = null;
      if (planId === '__new'){
        const name = f.name.trim(); if (!name){ toast('Bitte gib dem Plan einen Namen.'); return; }
        created = { id: uid(), name, slots: f.base === 'copy' ? stdPlan().slots.map(s => ({ ...clone(s), id: uid() })) : [] };
        D.plans.push(created); planId = created.id;
      } else if (!planById(planId)){ toast('Bitte einen Plan wählen.'); return; }
      if (p) Object.assign(p, { planId, from: f.from, to: f.to });
      else D.periods.push({ id: uid(), planId, from: f.from, to: f.to });
      save(); S.close(); refreshAll();
      toast(created ? `„${created.name}“ angelegt. Anpassen unter Plan.` : 'Zeitraum gespeichert');
    } });
}

async function exportData(){
  const json = JSON.stringify({ app: 'stundenplan', version: APP_VERSION, exported: new Date().toISOString(), data: D });
  const name = `stundenplan-backup-${today()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: 'Stundenplan-Backup' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Backup gesichert');
}
$('#imp').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (_) { toast('Die Datei ist kein gültiges Backup.'); return; }
  const data = j && j.data ? j.data : j;
  if (!data || !Array.isArray(data.plans)){ toast('Die Datei ist kein Stundenplan-Backup.'); return; }
  if (!await ask({ title: 'Backup laden?', msg: 'Deine aktuellen Daten auf diesem Gerät werden durch das Backup ersetzt.', ok: 'Laden' })) return;
  replaceData(migrate(data)); ui.plan = null; refreshAll(); toast('Backup geladen');
});

  if (!sw) return; const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, k = sw.k, fast = Date.now() - sw.at < 700; sw = null;

    if (ui.day === ui.lastToday) ui.day = t;
    if (ui.week === monday(ui.lastToday)) ui.week = monday(t);
    ui.lastToday = t; OCC.clear(); refreshAll(); return;
  }
  if (ui.tab === 'day' || ui.tab === 'week') render();
}

  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded && !stack.length){ reloaded = true; location.reload(); } });
}
</script>
