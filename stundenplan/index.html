<!doctype html>
<html lang="de" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Schedule</title>
<meta name="description" content="Schedule: deine Master-Woche mit Blockern, Zeitstrahl für heute, Wochenübersicht und To-Dos.">
<meta name="theme-color" content="#f2f2f7" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Schedule">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<script>
// Hell/Dunkel vor dem ersten Zeichnen setzen, damit nichts aufblitzt
(function(){var t='auto';try{var d=JSON.parse(localStorage.getItem('sp.data.v1')||'null');if(d&&d.set&&d.set.theme)t=d.set.theme}catch(e){}if(t!=='light'&&t!=='dark')t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})();
// Notbremse: Startet die App nicht, wenigstens einen Knopf zum Neuladen zeigen statt einer leeren Seite
setTimeout(function(){var p=document.getElementById('page');if(p&&!p.firstElementChild)p.innerHTML='<div style="padding:120px 24px;text-align:center;font-size:17px">Schedule konnte nicht starten.<br><br><button style="font:inherit;font-weight:600;color:#fff;background:#007aff;border:0;border-radius:22px;padding:12px 22px" onclick="location.reload()">Neu laden</button></div>';},6000);
</script>
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --sbg:#f2f2f7; --scard:#fff; --seg:#fff;
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2); --grid:rgba(60,60,67,.09);
  --fill:rgba(120,120,128,.12); --press:rgba(120,120,128,.16);
  --tint:#007aff; --red:#ff3b30; --green:#34c759; --orange:#ff9500;
  --glass:rgba(255,255,255,.6); --glass2:rgba(248,248,250,.86); --hi:rgba(255,255,255,.98); --edge:rgba(0,0,0,.13);
  --gshadow:0 8px 28px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.05);
  --bar:rgba(242,242,247,.74); --r:24px; --fcard:rgba(255,255,255,.72);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --tabb:max(calc(var(--safe-b) - 12px), 14px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#000; --card:#1c1c1e; --sbg:#1c1c1e; --scard:#2c2c2e; --seg:#636366;
  --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6); --grid:rgba(84,84,88,.38);
  --fill:rgba(118,118,128,.24); --press:rgba(118,118,128,.32);
  --tint:#0a84ff; --red:#ff453a; --green:#30d158; --orange:#ff9f0a;
  --glass:rgba(40,40,44,.56); --glass2:rgba(30,30,34,.86); --hi:rgba(255,255,255,.32); --edge:rgba(0,0,0,.55);
  --gshadow:0 8px 28px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3);
  --bar:rgba(0,0,0,.62); --fcard:rgba(255,255,255,.08);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--label);
  font:17px/1.29 var(--font);letter-spacing:-.2px;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
.i{width:22px;height:22px;flex:none;fill:currentColor}
.i.xs{width:14px;height:14px;vertical-align:-2px;margin-right:2px}
.i.cm{width:16px;height:16px}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:var(--gshadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(165deg,var(--hi) 0%,rgba(255,255,255,.14) 34%,rgba(255,255,255,0) 56%,var(--edge) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gbtn{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--label);flex:none}
.gbtn .i{width:22px;height:22px}
.gbtn.tint{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0)),var(--tint);color:#fff}
.gpill{height:44px;border-radius:22px;padding:0 18px;display:inline-flex;align-items:center;gap:6px;font-size:17px;font-weight:600;color:var(--label);white-space:nowrap}
.gpill.tint{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0)),var(--tint);color:#fff}
.gpill.sm{height:34px;padding:0 14px;font-size:15px;border-radius:17px}
.gpill .i{width:18px;height:18px}
.gbtn:active,.gpill:active{transform:scale(.94)}
.gbtn,.gpill{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.gseg{height:44px;border-radius:22px;display:inline-flex;align-items:center;padding:0 3px;flex:none}
.gseg button{width:42px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--label);transition:transform .2s cubic-bezier(.3,1.4,.5,1),opacity .2s}
.gseg button .i{width:21px;height:21px}
.gseg button:active{transform:scale(.86)}
.gseg button:disabled{opacity:.3}

/* ---------- Gerüst ---------- */
#app{position:fixed;inset:0;overflow:hidden}
.amb{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 38% at 0% 0%,rgba(0,122,255,.13),transparent 70%),radial-gradient(55% 32% at 100% 4%,rgba(175,82,222,.10),transparent 70%),radial-gradient(70% 40% at 60% 100%,rgba(52,199,89,.06),transparent 70%)}
#scroll{position:absolute;inset:0;z-index:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 calc(var(--tabb) + 96px)}
#scroll::before{content:"";display:block;height:calc(var(--safe-t) + 56px)} /* Abstand als Element statt padding, damit sticky überall gleich greift */
.page{max-width:700px;margin:0 auto;padding:0 16px}
/* Seitenwechsel nur mit Bewegung, ohne Ausblenden: Bleibt eine Animation hängen, ist der Inhalt trotzdem sichtbar */
.page.push{animation:push .3s cubic-bezier(.2,.9,.3,1)}
.page.pop{animation:pop .3s cubic-bezier(.2,.9,.3,1)}
@keyframes push{from{transform:translate3d(36px,0,0)}}
@keyframes pop{from{transform:translate3d(-36px,0,0)}}
.nav{position:absolute;top:0;left:0;right:0;z-index:9;padding-top:var(--safe-t);pointer-events:none}
.nav::before{content:"";position:absolute;inset:0 0 -18px;background:var(--bar);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);opacity:0;transition:opacity .25s;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent);mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.nav.sc::before{opacity:1}
.nav-in{position:relative;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px}
.nl,.nr{display:flex;gap:10px;pointer-events:auto}
.nl{justify-self:start} .nr{justify-self:end}
.nt{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;opacity:0;transition:opacity .2s}
.nav.st .nt,.nav.always .nt{opacity:1}
.tabs{position:absolute;left:16px;right:16px;bottom:var(--tabb);height:64px;max-width:460px;margin:0 auto;border-radius:32px;display:flex;padding:4px;z-index:10}
.tabs .lens{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:28px;background:var(--fill);transition:transform .5s cubic-bezier(.3,1.25,.45,1)}
.tabs button{flex:1;min-width:0;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:.05px;color:var(--label);text-align:center;border-radius:28px;white-space:nowrap}
.tabs button .i{width:25px;height:25px}
.tabs button.on{color:var(--tint)}

/* ---------- Typografie ---------- */
.lt{font-size:34px;font-weight:800;letter-spacing:.1px;line-height:41px;margin:0}
.lts{font-size:16px;color:var(--label2);margin-top:2px;font-weight:500}
.gh{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.1px;margin:26px 18px 8px;display:flex;justify-content:space-between;font-weight:500}
.gf{font-size:13px;color:var(--label2);margin:8px 18px 0;line-height:1.38}
.muted{color:var(--label2)}
.mt{margin-top:22px}

/* ---------- Listen ---------- */
.grp{background:var(--card);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 18px;position:relative;width:100%;font-size:17px;text-align:left;color:var(--label)}
.cell+.cell::before,.cell+.dis::before,.dis+.cell::before{content:"";position:absolute;top:0;right:0;left:18px;border-top:.5px solid var(--sep)}
.cell.tap:active{background:var(--press)}
.cell .cg{flex:1;min-width:0;display:block}
.cell .ct{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cs{display:block;font-size:14px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cs.late{color:var(--red)} .cell .cs.warn{color:var(--orange)} .cell .cs.today{color:var(--tint)}
.cell .cv{color:var(--label2);font-size:17px;white-space:nowrap;flex:none;max-width:52%;overflow:hidden;text-overflow:ellipsis}
.cell .chev{color:var(--label3);width:16px;height:16px;margin-right:-4px}
.cell.tint{color:var(--tint)} .cell.red{color:var(--red)}
.cell.sel{background:var(--press)}
.tile{width:30px;height:30px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--fg,#fff);
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 70%),var(--c,var(--tint));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tile .i{width:18px;height:18px}
.tile.sm{width:24px;height:24px;border-radius:7px} .tile.sm .i{width:14px;height:14px}
.tile.lg{width:52px;height:52px;border-radius:15px} .tile.lg .i{width:30px;height:30px}
.tile.xl{width:64px;height:64px;border-radius:18px} .tile.xl .i{width:36px;height:36px}
.tile.gray{--c:#8e8e93} .tile.green{--c:var(--green)} .tile.red{--c:var(--red)} .tile.orange{--c:var(--orange)} .tile.indigo{--c:#5856d6} .tile.blue{--c:#007aff} .tile.purple{--c:#af52de} .tile.pink{--c:#ff2d55} .tile.teal{--c:#30b0c7}
.ib{color:var(--label3);display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-6px -8px -6px 0;flex:none}
.ib.t{color:var(--tint)}
.ib:active{opacity:.4}
.struck{text-decoration:line-through;color:var(--label2)}
.nb{color:var(--tint);font-size:17px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}

/* ---------- Formular ---------- */
.fi{width:100%;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);padding:0;margin:0;min-width:0}
.fi::placeholder{color:var(--label3)}
textarea.fi{resize:none;line-height:1.35;min-height:24px}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;border:0;outline:none;background:var(--fill);border-radius:10px;padding:6px 12px;font:inherit;font-size:17px;color:var(--label);min-width:98px;min-height:36px;text-align:center;font-variant-numeric:tabular-nums;margin:-4px 0}
input[type=date]{min-width:136px}
input::-webkit-date-and-time-value{text-align:center}
input[type=time]::-webkit-calendar-picker-indicator,input[type=date]::-webkit-calendar-picker-indicator{display:none}
.seg{display:flex;background:var(--fill);border-radius:20px;padding:3px}
.seg button{flex:1;min-height:34px;border-radius:17px;font-size:14px;font-weight:500;text-align:center;padding:5px 4px;line-height:1.2;transition:background .2s}
.seg button.on{background:var(--seg);box-shadow:0 3px 10px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);font-weight:600}
.days{display:flex;justify-content:space-between;gap:4px;padding:14px 16px 10px}
.days button{width:40px;height:40px;border-radius:50%;background:var(--fill);font-size:15px;font-weight:600;text-align:center}
.days button.on{background:var(--tint);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.presets button{font-size:14px;color:var(--tint);background:var(--fill);border-radius:16px;padding:6px 12px;font-weight:600}
.daypick{display:flex;gap:6px;padding:12px 12px}
.daypick button{flex:1;min-width:0;border-radius:14px;background:var(--fill);padding:6px 0;text-align:center;font-size:12px;font-weight:600;color:var(--label2)}
.daypick button b{display:block;font-size:17px;color:var(--label);font-variant-numeric:tabular-nums}
.daypick button.on{background:var(--tint);color:rgba(255,255,255,.85)} .daypick button.on b{color:#fff}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw.on{background:var(--green)} .sw.on::after{transform:translateX(20px)}
.ck{width:26px;height:26px;border-radius:50%;border:2px solid var(--c,var(--label3));flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .15s,border-color .15s}
.ck.gray{border-color:var(--label3)}
.ck.on{background:var(--c,var(--tint));border-color:var(--c,var(--tint));color:var(--fg,#fff)}
.ck.dash{border-style:dashed;border-color:var(--label3)}
.abtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:26px;font-size:17px;font-weight:600;text-align:center}
.abtn .i{width:20px;height:20px}
.abtn+.abtn{margin-top:10px}
.abtn.tint{background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0)),var(--tint);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.abtn.soft{background:var(--fill);color:var(--tint)}
.abtn.red{background:rgba(255,59,48,.12);color:var(--red)}
.abtn:active{transform:scale(.97)}
.abtn{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}
.abtn[disabled]{opacity:.45}

/* Farben & Symbole im Editor */
.dis{position:relative}
.dis .dh2{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 18px;width:100%;text-align:left}
.dis .dh2 .cg{flex:1;min-width:0}
.dis .dh2 .cs{display:block;font-size:14px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dis .chev{color:var(--label3);width:16px;height:16px;transition:transform .3s}
.dis.open .chev{transform:rotate(90deg)}
.dis .db{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.3,.9,.3,1)}
.dis.open .db{grid-template-rows:1fr}
.dis .db>div{overflow:hidden;min-height:0}
.subh{font-size:12px;font-weight:600;color:var(--label2);text-transform:uppercase;letter-spacing:.2px;padding:14px 18px 2px}
.cols{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;padding:12px 18px 16px}
.cols button,.cols label{aspect-ratio:1;border-radius:50%;background:var(--c);max-width:42px;width:100%;justify-self:center;position:relative;display:block}
.cols button.on,.cols label.on{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--c)}
.cols label{background:conic-gradient(#ff3b30,#ff9500,#ffcc00,#34c759,#00c7be,#007aff,#5856d6,#af52de,#ff2d55,#ff3b30);overflow:hidden}
.cols label input{position:absolute;inset:0;opacity:0;width:100%;height:100%;border:0;padding:0;cursor:pointer}
.cols label::after{content:"+";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:20px;text-shadow:0 1px 3px rgba(0,0,0,.4);pointer-events:none}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:10px 16px 14px}
.icons button{aspect-ratio:1;max-width:46px;width:100%;justify-self:center;border-radius:50%;background:var(--fill);color:var(--label2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.icons button .i{width:22px;height:22px}
.icons button.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 70%),var(--c);color:var(--fg,#fff);box-shadow:0 3px 10px var(--cs)}

/* ---------- Heute ---------- */
.banner{border-radius:20px;padding:12px 12px 12px 16px;margin-top:14px;display:flex;align-items:center;gap:12px;font-size:15px}
.banner .bg{flex:1;min-width:0}
.pill{background:var(--fill);color:var(--tint);font-size:15px;font-weight:600;border-radius:18px;padding:8px 14px;white-space:nowrap;flex:none}
.pill:active{opacity:.6}
.hero{border-radius:28px;padding:16px;margin-top:16px;background:linear-gradient(135deg,var(--ct),rgba(255,255,255,0) 75%),var(--glass);cursor:pointer}
.hero .hk{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--c)}
.hero .hr{display:flex;align-items:center;gap:12px;margin-top:8px}
.hero .ht{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.hero .hs{font-size:15px;color:var(--label2);margin-top:2px}
.prog{height:6px;border-radius:3px;background:var(--fill);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:3px}
.tl{margin-top:22px}
.tlr{display:grid;grid-template-columns:auto 52px minmax(0,1fr);column-gap:12px;align-items:start;cursor:pointer}
.tlt{font-size:13px;font-weight:600;color:var(--label2);text-align:right;padding-top:16px;font-variant-numeric:tabular-nums;min-width:42px;white-space:nowrap}
.rail{display:flex;justify-content:center}
.cap{width:52px;border-radius:26px;display:flex;justify-content:center;padding-top:13px;color:var(--fg,#fff);position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%),var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.06),0 4px 14px var(--cs);transition:transform .2s}
.cap .i{width:26px;height:26px}
.tlr:active .cap{transform:scale(.96)}
.tlb{padding:12px 0 6px;min-width:0}
.tlb .tt{font-size:17px;font-weight:600;line-height:22px;overflow-wrap:anywhere}
.tlb .ts{font-size:14px;color:var(--label2);margin-top:2px;font-variant-numeric:tabular-nums}
.tlb .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--orange);background:rgba(255,149,0,.14);border-radius:7px;padding:2px 7px;margin-top:5px}
.tdl{margin-top:6px;display:flex;flex-direction:column;gap:1px}
.tdl button{font-size:15px;color:var(--label);display:flex;align-items:center;gap:8px;min-width:0;min-height:30px;text-align:left}
.tdl button .bx{width:18px;height:18px;border-radius:50%;border:1.8px solid var(--c);flex:none;display:flex;align-items:center;justify-content:center;color:transparent}
.tdl button .bx .i{width:12px;height:12px}
.tdl button.dn{color:var(--label2);text-decoration:line-through}
.tdl button.dn .bx{background:var(--c);color:var(--fg,#fff)}
.tdl button .rp{width:13px;height:13px;color:var(--label3);flex:none}
.tdl button span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tdl em{font-style:normal;font-size:13px;color:var(--label2);padding-left:26px}
.tlr.past .cap{opacity:.42;box-shadow:none}
.tlr.past .tt{color:var(--label2)}
.tlr.now .cap{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--c),0 6px 20px var(--cs)}
.tlr.now .tlt{color:var(--c)}
.tlr.skip .cap{background:none;border:2px dashed var(--c);color:var(--c);box-shadow:none;opacity:.55;padding-top:11px}
.tlr.skip .tt{text-decoration:line-through;color:var(--label2)}
.tlg{display:grid;grid-template-columns:auto 52px minmax(0,1fr);column-gap:12px;align-items:center}
.tlg>:first-child{min-width:42px}
.tlg .dash{justify-self:center;width:0;height:100%;border-left:2px dashed var(--label3)}
.tlg .gl{font-size:13px;color:var(--label2)}
.tlg.nw .tlt{padding:0;color:var(--red);font-weight:700}
.tlg.nw .dot{justify-self:center;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,59,48,.2)}
.tlg.nw .gl{color:var(--red);font-weight:600}
.empty{text-align:center;color:var(--label2);padding:40px 20px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--label);font-size:20px;margin-bottom:6px;font-weight:700}
.welcome{border-radius:30px;padding:26px 20px 20px;margin-top:18px;text-align:center}
.welcome .tile{margin:0 auto 14px}
.welcome h2{font-size:23px;margin:0 0 6px;letter-spacing:-.3px}
.welcome p{margin:0 0 18px;color:var(--label2);font-size:15px;line-height:1.45}
.hint{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;margin-top:20px;font-size:15px;width:100%;text-align:left;background:var(--card)}
.hint .cg{flex:1}

/* ---------- Woche ---------- */
.page.wkp{padding:0 10px}
.wkh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 12px;min-height:46px}
.wkh .r{font-size:16px;font-weight:600;color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wkh .bt{display:flex;gap:8px;flex:none}
.wkh .gpill{color:var(--tint)}
.wk{background:var(--card);border-radius:var(--r)}
.wk-h{position:sticky;top:calc(var(--safe-t) + 56px);z-index:70;display:grid;grid-template-columns:var(--rw,34px) repeat(7,minmax(0,1fr));background:color-mix(in srgb,var(--card) 74%,transparent);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-radius:var(--r) var(--r) 0 0;box-shadow:0 .5px 0 var(--sep);padding:8px 0 6px}
.hd{text-align:center;font-size:11px;color:var(--label2);font-weight:600;text-transform:uppercase;min-width:0;position:relative}
.hd b{display:block;font-size:17px;color:var(--label);font-weight:600;margin:2px auto 0;width:30px;height:30px;line-height:30px;border-radius:50%;font-variant-numeric:tabular-nums}
.hd.today b{background:var(--red);color:#fff}
.hd .dt{position:absolute;left:50%;bottom:-3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--orange)}
.wk-b{position:relative;display:grid;grid-template-columns:var(--rw,34px) repeat(7,minmax(0,1fr))}
.wk-t{position:relative}
.wk-t span{position:absolute;right:4px;font-size:10px;color:var(--label2);transform:translateY(-50%);font-variant-numeric:tabular-nums;font-weight:500;white-space:nowrap}
.wk-c{position:relative;min-width:0}
.wk-c+.wk-c,.wk-t+.wk-c{border-left:.5px solid var(--grid)}
.wk-c.today{background:rgba(255,59,48,.04)}
.wk-l{position:absolute;left:var(--rw,34px);right:0;border-top:.5px solid var(--grid);pointer-events:none}
.blk{position:absolute;left:2px;right:2px;border-radius:9px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:var(--fg,#fff);overflow:hidden;cursor:pointer;touch-action:pan-y;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 60%),var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 1px 4px var(--cs)}
.blk .i{width:19px;height:19px}
.blk.short{align-items:center;padding-top:0}
.blk.xs .i{width:13px;height:13px}
.blk.xxs .i{display:none}
.blk.ovl{background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,0) 60%),var(--cg);-webkit-backdrop-filter:blur(8px) saturate(160%);backdrop-filter:blur(8px) saturate(160%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 -3px 10px -4px rgba(0,0,0,.28);
  -webkit-mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),#000 10px);mask-image:linear-gradient(to bottom,rgba(0,0,0,.45),#000 10px)}
.blk.done{opacity:.55}
.blk.ed::after{content:"";position:absolute;top:4px;right:4px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--c)}
.blk:active{filter:brightness(.94)}
.nowl{position:absolute;left:-3px;right:0;height:2px;background:var(--red);z-index:65;pointer-events:none}
.nowl::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
/* Bearbeiten-Modus (wie Home-Bildschirm anpassen) */
.wk.editing .blk{animation:jig .3s ease-in-out infinite alternate;transform-origin:50% 40%}
.wk.editing .wk-c:nth-child(odd) .blk{animation-delay:-.15s}
@keyframes jig{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
.wk.editing .blk.sel{animation:none;touch-action:none;overflow:visible;z-index:60!important;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--c),0 10px 24px var(--cs);-webkit-mask-image:none;mask-image:none}
.blk.moving{opacity:0;animation:none!important}
.blk.covered{opacity:.25}
/* Beim Ziehen weichen die anderen Blocker weich aus; beim Hineinlegen ist der Ziel-Blocker markiert */
.wk.drag .blk{transition:top .22s cubic-bezier(.25,.9,.3,1),opacity .2s}
.wk.editing .blk.tgt{animation:none;z-index:55!important;box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--tint),0 8px 20px var(--cs);-webkit-mask-image:none;mask-image:none}
.hdl{position:absolute;left:50%;width:52px;height:30px;margin-left:-26px;display:flex;justify-content:center;touch-action:none;z-index:3;cursor:ns-resize}
.hdl::before{content:"";width:24px;height:6px;border-radius:3px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.35),0 0 0 .5px rgba(0,0,0,.1)}
.hdl.top{top:-22px;align-items:flex-end;padding-bottom:5px} .hdl.bot{bottom:-22px;align-items:flex-start;padding-top:5px}
/* Kurze Blocker: Griffe ganz außerhalb, damit der Blocker selbst zum Verschieben frei bleibt */
.blk.short .hdl.top{top:-30px;padding-bottom:3px} .blk.short .hdl.bot{bottom:-30px;padding-top:3px}
.edel{position:absolute;top:-10px;left:-10px;width:24px;height:24px;border-radius:50%;background:rgba(120,120,128,.9);color:#fff;display:flex;align-items:center;justify-content:center;z-index:4;box-shadow:0 1px 4px rgba(0,0,0,.3);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.edel .i{width:16px;height:16px}
.ghost{position:absolute;z-index:80;border-radius:10px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:var(--fg,#fff);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%),var(--cg);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
  box-shadow:0 0 0 2px rgba(255,255,255,.9),0 16px 34px rgba(0,0,0,.32);transform:scale(1.06);transition:transform .15s}
.ghost .i{width:19px;height:19px}
.ghost.in{transform:scale(1);opacity:.92;transition:transform .15s,left .15s,width .15s}
.ghost.pend{pointer-events:auto;touch-action:none;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.1)}}
.tbub{position:absolute;z-index:90;transform:translate(-50%,-100%);white-space:nowrap;border-radius:14px;padding:5px 10px;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--label);pointer-events:none;margin-top:-8px}
.cutl{position:absolute;left:-6px;right:-6px;height:30px;margin-top:-15px;z-index:85;touch-action:none;cursor:ns-resize;display:flex;align-items:center}
.cutl::before{content:"";position:absolute;left:0;right:0;top:14px;border-top:2.5px dashed #fff;filter:drop-shadow(0 1px 1px rgba(0,0,0,.5))}
.cutl .sc{position:absolute;left:50%;top:3px;margin-left:-12px;width:24px;height:24px;border-radius:50%;background:#fff;color:#1c1c1e;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.cutl .sc .i{width:15px;height:15px}
.edhint{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--label2);padding:0 8px 10px;line-height:1.35}
.edhint .i{width:18px;height:18px;color:var(--tint)}
.edbar{position:fixed;left:16px;right:16px;max-width:460px;margin:0 auto;bottom:calc(var(--tabb) + 76px);z-index:40;border-radius:26px;display:flex;align-items:center;gap:10px;padding:8px 8px 8px 18px;font-size:15px;font-weight:500}
.edbar .tx{flex:1;min-width:0;line-height:1.3}
.edbar button{flex:none;height:40px;border-radius:20px;padding:0 16px;font-weight:600;font-size:15px;background:var(--fill)}
.edbar button.b{background:var(--tint);color:#fff}

/* ---------- Details ---------- */
.dh{display:flex;align-items:center;gap:14px;padding:4px 48px 0 4px}
.dh .dt{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.15;overflow-wrap:anywhere}
.dh .ds{font-size:15px;color:var(--label2);margin-top:3px}
.skiptag{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--red);background:rgba(255,59,48,.12);border-radius:8px;padding:2px 8px}
.edtag{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--orange);background:rgba(255,149,0,.14);border-radius:8px;padding:2px 8px}
.desc{margin-top:14px;padding:12px 16px;border-radius:18px;background:var(--fcard);font-size:15px;line-height:1.4;white-space:pre-wrap;overflow-wrap:anywhere}
.rep{margin-top:12px;padding:12px 14px;border-radius:18px;background:var(--fcard)}
.rep .rl{font-size:13px;color:var(--label2);font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.rep .rl .i{width:15px;height:15px}
.rep .rn{font-size:13px;color:var(--label2);margin-top:9px;font-weight:500}
.wdots{display:flex;gap:6px}
.wdots span{flex:1;max-width:36px;height:30px;border-radius:15px;background:var(--fill);color:var(--label3);font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center}
.wdots span.on{background:var(--c);color:var(--fg,#fff)}
.wdots span.now{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--c)}
.mdots{display:flex;gap:3px;margin-top:4px}
.mdots i{width:6px;height:6px;border-radius:50%;background:var(--fill)}
.mdots i.on{background:var(--c)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px -16px 0;padding:2px 16px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:60px;padding:8px;border-radius:16px;background:var(--card);text-align:center;font-size:12px;color:var(--label2);font-weight:600}
.chip b{display:block;font-size:16px;color:var(--label);font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--tint);color:rgba(255,255,255,.85)} .chip.on b{color:#fff}

/* ---------- Master-Woche ---------- */
.mweek{margin-top:16px;border-radius:26px;padding:12px 10px 10px}
.mweek .mh{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:11px;font-weight:700;color:var(--label2);margin-bottom:6px}
.mweek .mh .td{color:var(--red)}
.mweek .mb{position:relative;display:grid;grid-template-columns:repeat(7,1fr);gap:4px;height:150px}
.mweek .mc{position:relative;border-radius:8px;background:var(--fill)}
.mweek .mk{position:absolute;left:2px;right:2px;border-radius:4px;background:var(--c);min-height:3px;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.mweek .mf{display:flex;justify-content:space-between;font-size:10px;color:var(--label3);margin-top:5px;padding:0 2px;font-variant-numeric:tabular-nums}

/* ---------- Einstellungen ---------- */
.prof{display:flex;align-items:center;gap:14px;border-radius:26px;padding:14px 16px;margin-top:16px}
.prof img{width:60px;height:60px;border-radius:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.prof .pn{font-size:21px;font-weight:700;letter-spacing:-.3px}
.prof .ps{font-size:14px;color:var(--label2);margin-top:2px;line-height:1.3}
.appear{display:flex;justify-content:center;gap:44px;padding:18px 18px 12px}
.appear button{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:15px;font-weight:500}
.ph{width:76px;height:142px;border-radius:16px;border:3px solid #1c1c1e;padding:10px 7px;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.ph.l{background:#f2f2f7} .ph.d{background:#000;border-color:#3a3a3c}
.ph i{display:block;height:9px;border-radius:5px}
.ph.l i{background:#fff} .ph.d i{background:#2c2c2e}
.ph i.a{background:#007aff;width:60%} .ph i.b{background:#ff9500;width:80%} .ph i.c{background:#34c759;width:45%}
.rad{width:24px;height:24px;border-radius:50%;border:2px solid var(--label3);display:flex;align-items:center;justify-content:center;color:transparent}
.rad.on{background:var(--tint);border-color:var(--tint);color:#fff}
.rad .i{width:15px;height:15px}
.stat{margin-top:16px;border-radius:24px;padding:16px}
.stat .sr{display:flex;align-items:center;gap:12px}
.stat .st{font-size:17px;font-weight:600}
.stat .ss{font-size:14px;color:var(--label2);margin-top:2px;line-height:1.35}
.steps{margin:0;padding:0 18px 4px 38px;font-size:15px;line-height:1.45}
.steps li{margin:6px 0}

/* ---------- Ebenen ---------- */
.layer{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,0);transition:background-color .35s}
.layer.in{background:rgba(0,0,0,.28)}
.layer.out{background:rgba(0,0,0,0)}
.sheet{--card:var(--scard);position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:700px;height:calc(100% - var(--safe-t) - 10px);background:var(--sbg);border-radius:34px 34px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .45s cubic-bezier(.32,.72,0,1);box-shadow:0 -2px 24px rgba(0,0,0,.1)}
.sheet.float{left:10px;right:10px;bottom:max(var(--safe-b),10px);height:auto;max-height:calc(100% - var(--safe-t) - 40px);border-radius:36px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);--card:var(--fcard)}
.layer.in .sheet{transform:translateY(0)}
.layer.out .sheet{transform:translateY(105%)}
.grab{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3)}
.sh{flex:none;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px 0;touch-action:none}
.sh .nl,.sh .nr{display:flex;gap:8px}
.sht{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.sb{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(var(--safe-b) + 28px)}
.sheet.float .sb{padding-top:26px;padding-bottom:18px}
.sheet.float .sh{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;padding:12px 12px 0}
.sheet.float .sh button{pointer-events:auto}
.al{display:flex;align-items:center;justify-content:center;z-index:130}
.alert{width:300px;max-width:calc(100% - 40px);background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-radius:30px;text-align:center;padding:22px 18px 16px;transform:scale(1.1);opacity:0;transition:transform .3s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.al.in .alert{transform:scale(1);opacity:1}
.al.out .alert{opacity:0}
.alert .at{font-weight:700;font-size:17px;line-height:1.3}
.alert .am{font-size:14px;margin-top:6px;line-height:1.38;color:var(--label2)}
.alert .abt{display:flex;gap:10px;margin-top:18px}
.alert .abt.v{flex-direction:column;gap:8px}
.alert .abt button{flex:1;min-height:48px;border-radius:24px;font-size:17px;font-weight:600;text-align:center;background:var(--fill);padding:8px 12px;line-height:1.2}
.alert .abt button.b{background:var(--tint);color:#fff} .alert .abt button.d{background:var(--red);color:#fff} .alert .abt button.dl{color:var(--red)}
.as{z-index:120;display:flex;align-items:flex-end;justify-content:center;padding:0 10px max(var(--safe-b),10px)}
.asw{width:100%;max-width:500px;border-radius:34px;padding:8px;transform:translateY(120%);transition:transform .4s cubic-bezier(.32,.72,0,1);background:var(--glass2)}
.as.in .asw{transform:translateY(0)}
.as.out .asw{transform:translateY(120%)}
.ash{padding:12px 16px 8px;font-size:13px;color:var(--label2);text-align:center;font-weight:600}
.asw button{display:block;width:100%;min-height:54px;padding:8px 14px;font-size:17px;font-weight:600;color:var(--tint);text-align:center;border-radius:27px}
.asw button:active{background:var(--press)}
.asw button.d{color:var(--red)}
.asw .asc{margin-top:6px;background:var(--fill);color:var(--label)}
/* Kontextmenü (wie iOS) */
.pl{z-index:110;background:rgba(0,0,0,0);transition:background-color .25s,-webkit-backdrop-filter .25s,backdrop-filter .25s}
.pl.in{background:rgba(0,0,0,.08)}
.pl.dim.in{background:rgba(0,0,0,.18);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pop{position:absolute;width:250px;border-radius:22px;padding:6px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);transform:scale(.6);opacity:0;transition:transform .32s cubic-bezier(.3,1.3,.5,1),opacity .18s}
.pl.in .pop{transform:scale(1);opacity:1}
.pl.out .pop{transform:scale(.8);opacity:0}
.pop .ph2{padding:8px 12px 6px;font-size:13px;color:var(--label2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:8px 12px;border-radius:16px;font-size:17px;text-align:left;color:var(--label)}
.pop button:active{background:var(--press)}
.pop button .cg{flex:1;min-width:0}
.pop button .i{width:20px;height:20px}
.pop button .ok{color:var(--label)}
.pop button.d{color:var(--red)}
.pop hr{border:0;border-top:.5px solid var(--sep);margin:4px 10px}
.pv{position:fixed;border-radius:10px;display:flex;align-items:flex-start;justify-content:center;padding-top:6px;color:var(--fg,#fff);pointer-events:none;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 60%),var(--c);box-shadow:0 0 0 2px rgba(255,255,255,.9),0 14px 32px rgba(0,0,0,.3);transition:transform .32s cubic-bezier(.3,1.3,.5,1)}
.pv .i{width:19px;height:19px}
.pl.in .pv{transform:scale(1.07)}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(var(--tabb) + 76px);transform:translateY(16px) scale(.96);z-index:140;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.3,1.3,.5,1);max-width:calc(100% - 32px);color:var(--label)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast button{color:var(--tint);font-weight:700;white-space:nowrap}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}

/* ---------- Einführung ---------- */
.tut{position:fixed;inset:0;z-index:150;display:flex;flex-direction:column;background:var(--bg);opacity:0;transition:opacity .3s}
.tut.in{opacity:1}
.tut .amb{opacity:1.4}
.tut .tw{position:relative;flex:1;overflow:hidden}
.tut .tr{display:flex;height:100%;transition:transform .45s cubic-bezier(.3,.9,.3,1)}
.tut .tp{flex:none;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 40px) 32px 20px;text-align:center}
.tut .art{position:relative;width:200px;height:200px;margin-bottom:34px;display:flex;align-items:center;justify-content:center}
.tut .orb{width:150px;height:150px;border-radius:44px;display:flex;align-items:center;justify-content:center;color:var(--fg,#fff);

function syncKids(a, b){
  const an = [...a.childNodes], bn = [...b.childNodes];
  for (let i = 0; i < Math.max(an.length, bn.length); i++){
    const x = an[i], y = bn[i];
    if (!x){ a.appendChild(y); continue; }
    if (!y){ a.removeChild(x); continue; }
    if (x.isEqualNode(y)) continue;
    if (x.nodeType === 3 && y.nodeType === 3){ x.nodeValue = y.nodeValue; continue; }
    if (x.nodeType !== 1 || x.nodeName !== y.nodeName || x.namespaceURI !== y.namespaceURI || /^(INPUT|TEXTAREA|SELECT)$/.test(x.nodeName)){ a.replaceChild(y, x); continue; }
    for (const at of [...x.attributes]) if (!y.hasAttribute(at.name)) x.removeAttribute(at.name);

    right: `<button class="gbtn glass" data-a="edAdd" aria-label="${L('Blocker hinzufügen', 'Add block')}">${I('plus')}</button><button class="gbtn glass tint" data-a="edDone" aria-label="${L('Fertig', 'Done')}">${I('check')}</button>` };
  return { title: LANG === 'en' ? `Week ${kwN}` : `KW ${kwN}`, navAlways: true, cls: 'wkp', body: h,
    left: `<button class="gbtn glass" data-a="weekPrev" aria-label="${L('Vorherige Woche', 'Previous week')}">${I('chevL')}</button>`,
    right: `<button class="gbtn glass" data-a="weekNext" aria-label="${L('Nächste Woche', 'Next week')}">${I('chevR')}</button>` };
};
function scrollWeekToNow(){
  if (!WK) return;
  const isCur = WK.start === wkStart(today());
  let minS = 24 * 60;
  for (const d of WK.days) for (const o of occ(d)) if (!o.skipped) minS = Math.min(minS, tmin(o.start));
  if (minS === 24 * 60) minS = WK.H0 * 60;
  const target = isCur ? Math.max(nowMin() - 120, WK.H0 * 60) : Math.max(minS - 30, WK.H0 * 60);
  scroller.scrollTop = Math.max(0, (target - WK.H0 * 60) * PPM);

}

function todoList(){
  const open = D.todos.filter(t => !t.done), un = [], pl = [];
  for (const t of open){ const o = atOcc(t); if (o) pl.push({ t, o }); else un.push(t); }
  un.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || a.created - b.created);
  pl.sort((a, b) => a.o.date.localeCompare(b.o.date) || tmin(a.o.start) - tmin(b.o.start) || a.t.created - b.t.created);
  const done = D.todos.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  let h = '';
  if (un.length) h += `<div class="gh">${L('Ohne Blocker', 'No block yet')}</div><div class="grp">${un.map(t => todoRow(t, null)).join('')}</div>`;
  if (pl.length) h += `<div class="gh">${L('Eingeplant', 'Planned')}</div><div class="grp">${pl.map(x => todoRow(x.t, x.o)).join('')}</div>`;
  if (!open.length) h += `<div class="empty"><b>${D.todos.length ? L('Alles erledigt', 'All done') : L('Noch keine To-Dos', 'No to-dos yet')}</b>${D.todos.length ? L('Stark!', 'Nice!') : L('Schreib oben auf, was ansteht. Danach ordnest du jedes To-Do einem Blocker zu.', 'Write down what’s coming up. Then assign each to-do to a block.')}</div>`;
  else if (un.length) h += `<div class="gf">${L(`Tippe auf ${I('wstart', 'xs')}, um ein To-Do einem Blocker zuzuordnen. Dann erscheint es dort zum Abhaken.`, `Tap ${I('wstart', 'xs')} to assign a to-do to a block. It then shows up there to check off.`)}</div>`;
  if (done.length){
    h += `<div class="gh">${L('Erledigt', 'Done')} <span>${done.length}</span></div><div class="grp">`;
    h += `<button class="cell tap tint" data-a="toggleShowDone"><span class="cg">${ui.showDone ? L('Ausblenden', 'Hide') : L('Anzeigen', 'Show')}</span></button>`;
    if (ui.showDone) h += done.map(t => todoRow(t, null)).join('') + `<button class="cell tap red" data-a="clearDone"><span class="cg">${L('Erledigte löschen', 'Delete completed')}</span></button>`;
    h += `</div>`;
  }
  return h;
}
function todoRow(t, o){
  let sub = '', cls = '';
  if (t.done) sub = L('Erledigt', 'Done');
  else if (o){ const d = diffD(today(), o.date); sub = `${rel(o.date)} · ${fT(o.start)} · ${esc(o.title)}`; cls = d < 0 ? 'late' : d === 0 ? 'today' : ''; if (d < 0) sub = L('Verpasst: ', 'Missed: ') + sub; }
  else if (t.at){ sub = L('Blocker fällt aus, neu einplanen', 'Block was cancelled, plan again'); cls = 'warn'; }
  else if (t.due){ const d = diffD(today(), t.due); sub = `${L('Fällig', 'Due')}: ${rel(t.due)}`; cls = d < 0 ? 'late' : d === 0 ? 'today' : ''; }
  if (!sub && t.note && !t.done) sub = esc(t.note.split('\n')[0]);
  return `<div class="cell"><button class="ck gray${t.done ? ' on' : ''}" data-a="todoDone" data-id="${t.id}" aria-label="${L('Erledigt', 'Done')}">${I('check', 'cm')}</button><button class="cg" data-a="openTodo" data-id="${t.id}"><span class="ct${t.done ? ' struck' : ''}">${esc(t.title)}</span>${sub ? `<span class="cs ${cls}">${sub}</span>` : ''}</button>${t.done ? '' : `<button class="ib t" data-a="assignTodo" data-id="${t.id}" aria-label="${L('Blocker zuweisen', 'Assign block')}">${I('wstart')}</button>`}</div>`;
}

/* ================= Bearbeiten-Modus der Woche ================= */
// Wie „Home-Bildschirm anpassen“: Blocker gedrückt halten, dann ziehen, an den Griffen kürzen/verlängern,
// duplizieren, aufteilen oder löschen. Alles gilt nur für die angezeigte Woche (Abweichungen pro Tag).
const LONG = 450, LONG_ED = 500, SLOP = 8;
let G = null;             // laufende Geste
let swallow = 0;          // den Klick, den eine beendete Geste noch auslöst, schlucken (bis zum nächsten Antippen)

function edEnter(k, id){
  if (!ED.on) histReset(JSON.stringify(D));   // neue Sitzung, neuer Verlauf
  ED.on = true; ED.sel = k && id ? { k, id } : null; ED.cut = ED.dup = null;
}
function edExit(r = true){
  if (!ED.on) return;
  ED.on = false; ED.sel = ED.cut = ED.dup = null; histReset(null);
  if (r && ui.tab === 'week') keepView(render);
}
function histReset(cur){ HIST.past = []; HIST.next = []; HIST.cur = cur; }
// Rückgängig und Wiederholen: springt im Verlauf der Sitzung einen Stand zurück oder vor
function histGo(back){
  const from = back ? HIST.past : HIST.next, to = back ? HIST.next : HIST.past;
  if (!ED.on || G || HIST.cur === null || !from.length) return;
  to.push(HIST.cur); HIST.cur = from.pop();
  HIST.mute = true;
  try { replaceData(migrate(JSON.parse(HIST.cur))); } finally { HIST.mute = false; }
  HIST.cur = JSON.stringify(D);   // so wie gespeichert, sonst zählt der nächste Speichervorgang als Änderung
  ED.cut = ED.dup = null;
  if (ED.sel && !findOcc(ED.sel.k, ED.sel.id)) ED.sel = null;
  keepView(refreshAll);
  toast(back ? L('Rückgängig gemacht', 'Undone') : L('Wiederhergestellt', 'Redone'));
}

// Beim Neuzeichnen bleibt die Uhrzeit unter der Kopfzeile an derselben Stelle (der Zeitraum kann sich ändern)
function keepView(fn){
  const wb = ui.tab === 'week' && WK && $('.wk-b', page), hd = wb && $('.wk-h', page);
  if (!wb || !hd){ fn(); return; }
  const ref = hd.getBoundingClientRect().bottom, m = WK.H0 * 60 + (ref - wb.getBoundingClientRect().top - TOP) / PPM;
  fn();
  const wb2 = ui.tab === 'week' && WK && $('.wk-b', page), hd2 = wb2 && $('.wk-h', page);

/* ---------- Geometrie ---------- */
const blockEl = (k, id) => [...page.querySelectorAll('.blk')].find(b => b.dataset.d === k && b.dataset.id === id) || null;
const yToMin = y => WK.H0 * 60 + (y - $('.wk-b', page).getBoundingClientRect().top - TOP) / PPM;
const snapM = m => Math.round(m / D.set.snap) * D.set.snap;
const snapFrom = (base, m) => Math.abs(m - base) < D.set.snap / 2 ? base : snapM(m);   // kleine Bewegungen ändern nichts
function colAt(x){
  let best = null, bd = Infinity;
  for (const c of page.querySelectorAll('.wk-c')){ const r = c.getBoundingClientRect(), d = x < r.left ? r.left - x : x > r.right ? x - r.right : 0; if (d < bd){ bd = d; best = c; } }
  return best;
}

/* ---------- Regeln für einen Tag ---------- */
// Bearbeitbare Termine eines Tages (ausgefallene bleiben außen vor).
// p = Aussehen für Kopien, src = Master-Blocker, rt = Kopien zeigen dessen wiederkehrende To-Dos
function dayList(k){
  const xs = D.ov[k] ? D.ov[k].x : [];
  return occ(k).filter(o => !o.skipped).map(o => ({
    id: o.id, s: tmin(o.start), e: tmin(o.end), extra: o.extra, src: o.extra ? o.src : o.id,
    rt: o.extra ? !!(xs.find(x => x.id === o.id) || {}).rt : true,
    p: { title: o.title, desc: o.desc || '', color: o.color, icon: o.icon }
  }));
}
// Bereich [s, e) beanspruchen: Überlappende werden gekürzt oder geteilt, ganz überdeckte gesammelt
function carve(list, s, e){
  const out = [], covered = [];
  for (const x of list){
    if (x.e <= s || x.s >= e){ out.push(x); continue; }
    const head = s - x.s >= MINP, tail = x.e - e >= MINP;
    if (head) out.push({ ...x, e: s });
    if (tail) out.push(head ? { ...x, id: uid(), s: e, add: true, rt: false } : { ...x, s: e });
    if (!head && !tail) covered.push(x);
  }
  return { out, covered };
}
// Ausweichen: Der bewegte Blocker liegt bei [s, e), die anderen rücken zur Seite und behalten ihre Dauer.
// Liegt die Mitte eines Blockers vor der Mitte des bewegten, weicht er nach oben aus, sonst nach unten.
// Lücken fangen das Schieben auf. Was sich vorher schon überlappte, darf das weiter.
function pushAside(list, s, e){
  const mid = (s + e) / 2, out = [], up = [], dn = [];
  for (const x of list.filter(y => (y.s + y.e) / 2 >= mid).sort((a, b) => a.s - b.s || a.e - b.e)){
    let ns = Math.max(x.s, e);
    for (const y of dn) if (y.o.e <= x.s) ns = Math.max(ns, y.n.e);   // was vorher davor lag, bleibt davor
    const n = ns === x.s ? x : { ...x, s: ns, e: x.e + ns - x.s };
    dn.push({ o: x, n }); out.push(n);
  }
  for (const x of list.filter(y => (y.s + y.e) / 2 < mid).sort((a, b) => b.e - a.e || b.s - a.s)){
    let ne = Math.min(x.e, s);
    for (const y of up) if (y.o.s >= x.e) ne = Math.min(ne, y.n.s);
    const n = ne === x.e ? x : { ...x, s: x.s - (x.e - ne), e: ne };
    up.push({ o: x, n }); out.push(n);
  }
  return { list: out, moved: out.filter(n => !list.includes(n)) };
}
// Verlängern nach unten: alles, was ab „from“ beginnt, beginnt frühestens bei „to“
function shiftFrom(list, from, to){
  const rest = list.filter(x => x.s >= from), A = rest.length ? Math.max(0, to - Math.min(...rest.map(x => x.s))) : 0;
  return { list: list.map(x => x.s >= from ? { ...x, s: x.s + A, e: x.e + A } : x), A };
}
// Verlängern nach oben: alles, was bis „upto“ endet, endet spätestens bei „to“
function shiftUntil(list, upto, to){
  const rest = list.filter(x => x.e <= upto), A = rest.length ? Math.max(0, Math.max(...rest.map(x => x.e)) - to) : 0;
  return { list: list.map(x => x.e <= upto ? { ...x, s: x.s - A, e: x.e - A } : x), A };
}
// Löschen ohne Lücke: Was danach beginnt, rückt von unten nach oben auf
function closeGap(list, x){
  const others = list.filter(y => y.id !== x.id);
  const anchor = Math.max(x.s, ...others.filter(y => y.s < x.s && y.e > x.s).map(y => y.e));
  const rest = others.filter(y => y.s >= x.s), A = rest.length ? Math.max(0, Math.min(...rest.map(y => y.s)) - anchor) : 0;
  return { list: others.map(y => y.s >= x.s ? { ...y, s: y.s - A, e: y.e - A } : y), A };
}
// Alles muss in den Tag passen; was nicht mehr hineinpasst, fällt aus
function fitDay(list){
  const keep = [], lost = [];
  for (const x of list){ const s = Math.max(0, x.s), e = Math.min(DAY_END, x.e); if (e - s >= MINP) keep.push(s === x.s && e === x.e ? x : { ...x, s, e }); else lost.push(x); }
  return { keep, lost };
}

/* ---------- Änderungen übernehmen (nur für diesen Tag) ---------- */
function dropOcc(k, b){
  if (b.extra){
    const o = D.ov[k]; if (o) o.x = o.x.filter(s => s.id !== b.id);
    unassign(t => t.at.date === k && t.at.slot === b.id);
    if (D.chk[k]){ delete D.chk[k][b.id]; if (!Object.keys(D.chk[k]).length) delete D.chk[k]; }
  } else { const r = ensureOs(k, b.id); r.skip = 1; delete r.e; }
}
function setOccTime(k, b, s, e){
  if (b.extra){ const x = D.ov[k] && D.ov[k].x.find(y => y.id === b.id); if (x){ x.start = fmtT(s); x.end = fmtT(e); } return; }
  const m = slotById(b.id); if (!m) return;
  const r = ensureOs(k, b.id), ed = { ...(r.e || {}), start: fmtT(s), end: fmtT(e) };
  if (ed.start === m.start) delete ed.start;
  if (ed.end === m.end) delete ed.end;
  if (Object.keys(ed).length) r.e = ed; else delete r.e;
}
// Neuer Termin an einem Tag. Fiel derselbe Master-Blocker an diesem Tag aus, wird er einfach wieder eingeplant.
function placeNew(k, x){
  const m = x.src ? slotById(x.src) : null, p = x.p;
  if (m && x.rt && m.days.includes(wdOf(k))){
    const r = D.ov[k] && D.ov[k].s[m.id];
    if (r && r.skip){
      delete r.skip;
      const v = { ...p, start: fmtT(x.s), end: fmtT(x.e) }, ed = {};
      for (const f of FIELDS) if (!same(v[f] ?? '', m[f] ?? '')) ed[f] = v[f];
      if (Object.keys(ed).length) r.e = ed; else delete r.e;
      return m.id;
    }
  }
  const id = uid();
  ensureOv(k).x.push({ id, title: p.title, desc: m && p.desc === m.desc ? '' : p.desc, start: fmtT(x.s), end: fmtT(x.e), color: p.color, icon: p.icon,
    ...(x.src ? { src: x.src } : {}), ...(x.src && x.rt ? { rt: true } : {}) });
  return id;
}
// To-Dos und Haken wandern mit, wenn ein Termin an einen anderen Tag zieht
function moveLinks(k1, id1, k2, id2){
  for (const t of D.todos) if (t.at && t.at.date === k1 && t.at.slot === id1) t.at = { date: k2, slot: id2 };
  const c = D.chk[k1] && D.chk[k1][id1]; if (!c) return;
  delete D.chk[k1][id1]; if (!Object.keys(D.chk[k1]).length) delete D.chk[k1];
  const d = D.chk[k2] || (D.chk[k2] = {}); d[id2] = { ...(d[id2] || {}), ...c };
}
// Neue Tagesliste übernehmen: Fehlende fallen aus, geänderte Zeiten werden Abweichungen, neue werden Einzeltermine
function commitDay(k, plan){
  const before = new Map(dayList(k).map(x => [x.id, x]));
  const { keep, lost } = fitDay(plan), ids = {};
  const stay = new Set(keep.filter(x => !x.add).map(x => x.id));
  for (const [id, b] of before) if (!stay.has(id)) dropOcc(k, b);
  for (const x of keep){
    if (x.add){ ids[x.id] = placeNew(k, x); continue; }
    const b = before.get(x.id); if (!b) continue;
    if (b.s !== x.s || b.e !== x.e) setOccTime(k, b, x.s, x.e);
    ids[x.id] = x.id;
  }
  cleanOv(k); OCC.delete(k);
  return { ids, lost };
}

/* ---------- Abfrage, wenn ein Blocker ganz überdeckt wird ---------- */
function askCover(covered, later, A, lost){
  const one = covered.length === 1, n = one ? q(covered[0].p.title) : '';
  let msg = later ? L(`Nach hinten verschieben: Alles danach beginnt ${fmtDur(A)} später.`, `Push later: everything after starts ${fmtDur(A)} later.`)
    : L(`Nach vorne verschieben: Alles davor endet ${fmtDur(A)} früher.`, `Pull earlier: everything before ends ${fmtDur(A)} earlier.`);
  if (lost.length) msg += ' ' + L(`${lost.map(x => q(x.p.title)).join(', ')} passt dann nicht mehr in den Tag.`, `${lost.map(x => q(x.p.title)).join(', ')} would no longer fit into the day.`);
  msg += ' ' + (one ? L(`Ersetzen: ${n} fällt an diesem Tag aus.`, `Replace: ${n} is skipped on this day.`) : L('Ersetzen: Diese Blocker fallen an diesem Tag aus.', 'Replace: these blocks are skipped on this day.'));
  return choose({
    title: one ? L(`${n} wird ganz überdeckt`, `${n} would be fully covered`) : L(`${covered.length} Blocker werden ganz überdeckt`, `${covered.length} blocks would be fully covered`),
    msg, vertical: true,
    buttons: [
      { label: later ? L('Zeitplan nach hinten verschieben', 'Push schedule later') : L('Zeitplan nach vorne verschieben', 'Pull schedule earlier'), v: 'shift', cls: 'b' },
      { label: one ? L('Blocker ersetzen', 'Replace block') : L('Blocker ersetzen', 'Replace blocks'), v: 'replace', cls: 'dl' },
      { label: L('Abbrechen', 'Cancel'), v: null }
    ]
  });
}

/* ---------- Aktionen ---------- */
// Verschieben (auch an einen anderen Tag) oder Kopie ablegen. Die anderen Blocker am Ziel weichen aus.
// into = Blocker, in den der bewegte hineingelegt wird (lange darüber gehalten): Der wird dort geteilt.
async function placeMove(k1, id, k2, s2, copy, into){
  const l1 = dayList(k1), x = l1.find(y => y.id === id);
  if (!x){ keepView(render); return; }
  const e2 = s2 + (x.e - x.s), sameDay = k1 === k2;
  const others = (sameDay ? l1 : dayList(k2)).filter(y => copy || y.id !== id);
  const tg = into ? others.find(y => y.id === into) : null;
  let plan, extra = '';
  if (tg){
    const c = carve(others, s2, e2); plan = c.out;
    extra = c.covered.some(y => y.id === tg.id) ? L(`, ersetzt ${q(tg.p.title)}`, `, replaces ${q(tg.p.title)}`) : L(`, in ${q(tg.p.title)}`, `, inside ${q(tg.p.title)}`);
  } else {
    const p = pushAside(others, s2, e2), lost = p.list.filter(y => y.s < 0 || y.e > DAY_END);
    if (lost.length){
      const one = lost.length === 1, names = lost.map(y => q(y.p.title)).join(', ');
      const ok = await choose({
        title: one ? L(`${names} passt nicht mehr ganz in den Tag`, `${names} no longer fits into the day`) : L(`${lost.length} Blocker passen nicht mehr ganz in den Tag`, `${lost.length} blocks no longer fit into the day`),
        msg: L(`Beim Ausweichen rutscht ${one ? 'er' : 'sie'} über den Tag hinaus. Was nicht mehr hineinpasst, wird abgeschnitten, ein ganz verdrängter Blocker fällt an diesem Tag aus.`, `Making room pushes ${one ? 'it' : 'them'} past the day. Whatever no longer fits is cut off, a block pushed out completely is skipped on this day.`),
        vertical: true,
        buttons: [{ label: L('Trotzdem verschieben', 'Move anyway'), v: 1, cls: 'dl' }, { label: L('Abbrechen', 'Cancel'), v: null }]
      });
      if (!ok){ keepView(render); return; }
    }

      else withUndo(L(`${q(o.title)} fällt ${when} aus`, `${q(o.title)} skipped ${when}`), () => { ensureOs(date, id).skip = 1; });

function freeStart(busy, from, dur){
  let t = from;
  for (const [s, e] of busy.slice().sort((a, b) => a[0] - b[0])){ if (s - t >= dur) break; if (e > t) t = e; }
  return clamp(t, 0, DAY_END - dur);

}

// To-Do an einen Termin hängen: nur dieses Mal oder bei jedem Termin des Blockers
function todoPicker(date, id){
  const o0 = findOcc(date, id); if (!o0) return;
  const xr = o0.extra ? (D.ov[date] && D.ov[date].x.find(x => x.id === id)) : null;
  const base = o0.extra ? (xr && xr.rt && o0.base ? o0.base : null) : slotById(id);
  let every = false, draft = '';
  const when = date === today() ? L('heute', 'today') : L(`am ${fD(date, { wd: false })}`, `on ${fD(date, { wd: false })}`);
  const body = () => {
    const open = D.todos.filter(t => !t.done && !(t.at && t.at.date === date && t.at.slot === id));
    let h = '';
    if (base) h += `<div class="seg" style="margin-top:4px"><button class="${every ? '' : 'on'}" data-a="ev" data-v="0">${L('Nur dieses Mal', 'Just this time')}</button><button class="${every ? 'on' : ''}" data-a="ev" data-v="1">${L('Bei jedem Termin', 'Every time')}</button></div>`
      + `<div class="gf">${every ? L(`Erscheint ab jetzt bei jedem Termin von ${q(base.title)}.`, `Shows up every time ${q(base.title)} happens.`) : L(`Nur ${when} bei ${q(o0.title)}.`, `Only ${when} at ${q(o0.title)}.`)}</div>`;
    h += `<div class="grp" style="margin-top:${base ? 14 : 4}px"><div class="cell"><span class="ck dash"></span><input class="fi" name="nt" value="${esc(draft)}" placeholder="${L('Neues To-Do', 'New to-do')}" maxlength="200" autocomplete="off" enterkeyhint="done" data-enter="add"><button class="nb" data-a="add">${L('Hinzufügen', 'Add')}</button></div></div>`;
    if (!every && open.length) h += `<div class="gh">${L('Offene To-Dos', 'Open to-dos')}</div><div class="grp">${open.map(t => { const o = atOcc(t); return `<button class="cell tap" data-a="pick" data-id="${t.id}"><span class="cg"><span class="ct">${esc(t.title)}</span>${o ? `<span class="cs">${L('Bisher', 'Currently')}: ${rel(o.date)} · ${fT(o.start)} ${esc(o.title)}</span>` : ''}</span><span class="tile sm green">${I('plus')}</span></button>`; }).join('')}</div><div class="gf">${L('Antippen, um das To-Do diesem Blocker zuzuordnen.', 'Tap to assign the to-do to this block.')}</div>`;
    else if (every && base.rt.length) h += `<div class="gh">${L('Schon dabei', 'Already there')}</div><div class="grp">${base.rt.map(r => `<div class="cell"><span class="ck dash"></span><span class="cg">${esc(r.title)}</span><span class="ib">${I('repeat')}</span></div>`).join('')}</div>`;

  const S = sheet({ title: L('To-Do hinzufügen', 'Add to-do'), body: body(),
    onInput: (name, v) => { if (name === 'nt') draft = v; },
    on: {
      ev: el => { every = el.dataset.v === '1'; S.set(body()); },
      pick: el => { const t = D.todos.find(x => x.id === el.dataset.id); if (t){ t.at = { date, slot: id }; save(); refreshAll(); } S.close(); },
      add: () => {
        const v = draft.trim(); if (!v){ const i = $('[name=nt]', S.el); if (i) i.focus(); return; }
        if (every){ const b = slotById(base.id); if (b) b.rt.push({ id: uid(), title: v.slice(0, 200) }); }

        save(); refreshAll(); S.close();
        toast(every ? L(`Kommt jetzt bei jedem Termin von ${q(base.title)}`, `Now shows up every time ${q(base.title)} happens`) : L('To-Do hinzugefügt', 'To-do added'));
      }
    } });
}

/* ================= Mitteilungen (Web Push über den eigenen Server) ================= */
// Der Server kennt nur die Uhrzeiten. Name und Text jeder Erinnerung liegen in IndexedDB auf dem Gerät,
// dort liest sie der Service Worker, wenn das Signal kommt.
const PUSH_KEY = 'sp.push';
function pushStatus(){ try { return JSON.parse(localStorage.getItem(PUSH_KEY) || '{}') || {}; } catch (e) { return {}; } }
function setPushStatus(o){ try { localStorage.setItem(PUSH_KEY, JSON.stringify({ ...pushStatus(), ...o })); } catch (e) {} }
const isStandalone = () => navigator.standalone === true || matchMedia('(display-mode: standalone)').matches;
const pushSupported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); s += '='.repeat((4 - s.length % 4) % 4); return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const u8b64u = a => btoa(String.fromCharCode(...new Uint8Array(a))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
function idb(){ return new Promise((res, rej) => { const r = indexedDB.open('schedule', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
async function idbSet(k, v){ const db = await idb(); try { await new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); } finally { db.close(); } }
// Erinnerungen der nächsten Wochen (Zeitpunkt, Titel, Text)
function notifyPlan(days = 28){
  const out = [], now = Date.now(), lead = D.set.push.lead || 0, k0 = today();
  for (let i = 0; i < days; i++){
    const k = addD(k0, i), d = pd(k);
    for (const o of occ(k)){
      if (o.skipped) continue;
      const t = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 0, tmin(o.start) - lead).getTime();
      if (t <= now + 30000) continue;
      const open = todoItems(o).filter(x => !x.done).length;
      out.push({ t, tag: `${k}-${o.id}`,
        title: lead ? L(`In ${lead} Min.: ${o.title}`, `In ${lead} min: ${o.title}`) : o.title,
        body: [fR(o.start, o.end), open ? (open === 1 ? '1 To-Do' : `${open} To-Dos`) : '', o.desc ? o.desc.split('\n')[0].slice(0, 90) : ''].filter(Boolean).join(' · ') });
    }
  }
  return out.sort((a, b) => a.t - b.t);
}
let pushT = null;
function schedulePush(){ if (!D.set.push.on) return; clearTimeout(pushT); pushT = setTimeout(() => pushSync().catch(() => {}), 2500); }
async function pushSync(){
  const p = D.set.push;
  if (!p.on || !p.url || !pushSupported()) return false;
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (!sub) throw new Error(L('Mitteilungen sind auf diesem Gerät nicht mehr erlaubt. Schalte sie aus und wieder ein.', 'Notifications are no longer allowed on this device. Turn them off and on again.'));
    const plan = notifyPlan(28);
    await idbSet('plan', plan);
    await idbSet('fallback', { title: APP, body: L('Ein neuer Blocker beginnt.', 'A new block is starting.') });
    const times = [...new Set(plan.map(x => x.t))].slice(0, 500);
    const r = await fetch(p.url + '/sync', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ sub: sub.toJSON(), times }) });
    if (!r.ok) throw new Error(L(`Der Server meldet Fehler ${r.status}.`, `The server reports error ${r.status}.`));
    setPushStatus({ last: Date.now(), n: times.length, err: '' });
    return true;
  } catch (e) {
    const m = e && e.message || '';
    setPushStatus({ err: m && !/fetch|network|load failed|NetworkError/i.test(m) ? m : L('Server nicht erreichbar. Stimmt die Adresse, und bist du online?', 'Server not reachable. Is the address right, and are you online?') });
    return false;
  } finally { if (ui.tab === 'set' && ui.sub[ui.sub.length - 1] === 'push') render(); }
}
function readUrl(){
  const el = $('#purl');
  let v = (el ? el.value : D.set.push.url).trim();
  if (!v) return '';
  if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(v)) v = 'https://' + v;
  try {
    const u = new URL(v);
    if (u.protocol !== 'https:' || !u.hostname.includes('.') || u.search || u.hash || u.username) return null;
    return (u.origin + u.pathname).replace(/\/+$/, '');
  } catch (e) { return null; }
}
A.pushUrl = () => {
  const v = readUrl();
  if (v === null){ toast(L('Das ist keine gültige https-Adresse.', 'That is not a valid https address.')); return; }
  if (v === D.set.push.url) return;
  D.set.push.url = v; save(); render();
  if (v) toast(L('Adresse gespeichert', 'Address saved'));
};
function sameKey(sub, key){ try { const k = sub.options && sub.options.applicationServerKey; return !k || u8b64u(k) === key; } catch (e) { return true; } }
A.pushToggle = async () => {
  const p = D.set.push;
  if (p.on){
    p.on = 0; save(); render();
    try {
      const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
      if (sub){ if (p.url) fetch(p.url + '/off', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) }).catch(() => {}); await sub.unsubscribe(); }
    } catch (e) {}
    setPushStatus({ last: 0, n: 0, err: '' }); render();
    return;
  }
  if (!pushSupported() || !isStandalone()){ toast(L('Öffne Schedule über den Home-Bildschirm, dann klappt es.', 'Open Schedule from the Home Screen, then it works.')); return; }
  const url = readUrl();
  if (!url){ toast(L('Trag zuerst die Adresse deines Push-Servers ein.', 'Enter the address of your push server first.')); const el = $('#purl'); if (el) el.focus(); return; }
  // iOS: Die Erlaubnis muss direkt beim Tippen angefragt werden, deshalb kommt sie zuerst
  let perm = 'default';
  try { perm = await Notification.requestPermission(); } catch (e) {}
  if (perm !== 'granted'){ toast(L('Mitteilungen sind nicht erlaubt. Ändern kannst du das in den iPhone-Einstellungen unter Mitteilungen.', 'Notifications are not allowed. You can change this in the iPhone Settings under Notifications.')); return; }
  p.url = url;
  try {
    const kr = await fetch(url + '/key'); if (!kr.ok) throw new Error('key');
    const key = (await kr.text()).trim();
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if (sub && !sameKey(sub, key)){ await sub.unsubscribe(); sub = null; }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64u(key) });
    p.on = 1; save();
    const ok = await pushSync();
    render();
    toast(ok ? L('Mitteilungen sind an', 'Notifications are on') : L('Eingeschaltet, aber der Abgleich hat nicht geklappt.', 'Turned on, but syncing did not work.'));
  } catch (e) {
    save(); setPushStatus({ err: L('Server nicht erreichbar. Stimmt die Adresse?', 'Server not reachable. Is the address right?') }); render();
  }
};
A.pushTest = async () => {
  try {
    const reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if (!sub) throw new Error('sub');
    await idbSet('test', { at: Date.now(), title: APP, body: L('So sieht deine Erinnerung aus, wenn ein Blocker beginnt.', 'This is how your reminder looks when a block starts.') });
    const r = await fetch(D.set.push.url + '/test', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ endpoint: sub.endpoint }) });
    if (!r.ok) throw new Error(String(r.status));
    toast(L('Test gesendet, die Mitteilung kommt gleich.', 'Test sent, the notification arrives shortly.'));
  } catch (e) { toast(L('Der Test hat nicht geklappt. Tippe zuerst auf „Jetzt abgleichen“.', 'The test did not work. Tap “Sync now” first.')); }
};
A.pushNow = async () => { const ok = await pushSync(); toast(ok ? L('Abgeglichen', 'Synced') : L('Abgleich hat nicht geklappt', 'Sync did not work')); };

    sk.style.visibility = i === P.length - 1 ? 'hidden' : '';
    tb.innerHTML = i < P.length - 1 ? `<button class="abtn tint" data-a="next">${L('Weiter', 'Continue')}</button>`
      : first ? `<button class="abtn tint" data-a="setup">${L('Master-Woche einrichten', 'Set up master week')}</button><button class="abtn soft" data-a="sample">${L('Mit Beispielwoche starten', 'Start with a sample week')}</button>`
      : `<button class="abtn tint" data-a="done">${L('Los geht’s', 'Let’s go')}</button>`;
  };
  const close = then => { D.set.tut = 3; save(); T.classList.remove('in'); setTimeout(() => { T.remove(); layerGone(); }, 320); if (then) then(); };
  T._on = { next: () => go(i + 1), done: () => close(), setup: () => close(A.startSetup), sample: () => close(loadSample) };
  let x0 = null, y0 = 0;
  T.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
  T.addEventListener('touchend', e => { if (x0 === null) return; const dx = e.changedTouches[0].clientX - x0, dy = e.changedTouches[0].clientY - y0; x0 = null; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) go(i + (dx < 0 ? 1 : -1)); }, { passive: true });
  document.body.appendChild(T);
  go(0);
  T.getBoundingClientRect();
  requestAnimationFrame(() => T.classList.add('in'));
}

/* ================= Backup ================= */
async function exportData(){
  const json = JSON.stringify({ app: 'schedule', version: APP_VERSION, exported: new Date().toISOString(), data: D });
  const name = `schedule-backup-${today()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: L('Schedule-Backup', 'Schedule backup') }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast(L('Backup gesichert', 'Backup saved'));
}
$('#imp').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (_) { toast(L('Die Datei ist kein gültiges Backup.', 'This file is not a valid backup.')); return; }
  const data = j && j.data ? j.data : j;
  if (!data || !(Array.isArray(data.slots) || Array.isArray(data.plans))){ toast(L('Die Datei ist kein Schedule-Backup.', 'This file is not a Schedule backup.')); return; }
  if (!await ask({ title: L('Backup laden?', 'Load backup?'), msg: L('Deine aktuellen Daten auf diesem Gerät werden durch das Backup ersetzt.', 'Your current data on this device is replaced by the backup.'), ok: L('Laden', 'Load') })) return;
  replaceData(migrate(data)); applyLang(); applyTheme(); ui.week = wkStart(today()); refreshAll(); toast(L('Backup geladen', 'Backup loaded'));
});

function loadSample(){
  if (D.slots.length){ toast(L('Deine Master-Woche ist nicht leer.', 'Your master week is not empty.')); return; }
  const S = (de, en, start, end, days, color, icon, desc = ['', ''], rt = []) => ({ id: uid(), title: L(de, en), desc: L(desc[0], desc[1]), start, end, days, color, icon, rt: rt.map(([a, b]) => ({ id: uid(), title: L(a, b) })) });
  D.slots = [
    S('Morgenroutine', 'Morning routine', '06:30', '07:00', [1, 2, 3, 4, 5], 'orange', 'sunny', ['Aufstehen, Wasser trinken, kurz den Tag planen.', 'Get up, drink water, plan the day.'], [['Bett machen', 'Make the bed'], ['Tag planen', 'Plan the day']]),
    S('Arbeit', 'Work', '07:30', '16:00', [1, 2, 3, 4, 5], 'blue', 'briefcase'),
    S('Heimweg', 'Commute home', '16:00', '16:30', [1, 2, 3, 4, 5], 'slate', 'train'),
    S('Sport', 'Workout', '17:00', '18:30', [1, 3, 5], 'green', 'barbell', ['Gym: Kraft, danach 10 Minuten Mobility.', 'Gym: strength, then 10 minutes of mobility.'], [['Dehnen', 'Stretch'], ['Protein-Shake', 'Protein shake']]),
    S('Abendessen', 'Dinner', '18:45', '19:30', [1, 2, 3, 4, 5], 'yellow', 'restaurant'),
    S('Lernen', 'Study', '19:30', '21:00', [2, 4], 'indigo', 'book'),
    S('Side-Hustle', 'Side hustle', '19:30', '21:00', [1, 3], 'purple', 'laptop', ['An der eigenen Idee arbeiten.', 'Work on your own idea.']),
    S('Abendroutine', 'Evening routine', '22:00', '22:30', [1, 2, 3, 4, 5, 6, 7], 'teal', 'moon', ['', ''], [['Handy weglegen', 'Put the phone away']]),
    S('Wocheneinkauf', 'Groceries', '10:00', '11:00', [6], 'mint', 'cart'),
    S('Fußball', 'Football', '14:00', '17:00', [6], 'red', 'football'),
    S('Wochenplanung', 'Weekly planning', '18:00', '18:30', [7], 'graphite', 'calendar', ['Rückblick auf die Woche, dann die nächste planen.', 'Look back on the week, then plan the next one.'])
  ];
  save(); refreshAll(); toast(L('Beispielwoche geladen. Anpassen unter Einstellungen.', 'Sample week loaded. Adjust it in Settings.'));
}

/* ================= Ereignisse ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const host = el.closest('.layer, .tut');
  const h = host ? host._on : (document.querySelector('.layer') && !el.closest('#toast') ? null : A);
  const fn = h && h[el.dataset.a];
  if (fn){ e.preventDefault(); safe('tap ' + el.dataset.a, () => fn(el, e)); }
});
// Ein Fehler in einer Aktion soll die Oberfläche nicht halb fertig zurücklassen
function safe(where, fn){
  try { return fn(); }
  catch (err){ logErr(where, err); try { if (G) cancelGesture(); render(); } catch (_) {} }
}
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter){
    e.preventDefault();
    const host = e.target.closest('.layer, .tut'), h = host ? host._on : A, fn = h && h[e.target.dataset.enter];
    if (fn) safe('enter ' + e.target.dataset.enter, () => fn(e.target, e));
  } else if (e.key === 'Escape'){
    if (stack.length) stack[stack.length - 1].cancel();
    else if (ED.on) edExit();
  }
});
document.addEventListener('change', e => { if (e.target.id === 'purl') A.pushUrl(); });
let sw = null;
scroller.addEventListener('touchstart', e => { const el = e.target.closest('[data-swipe]'); if (!el || ED.on || e.touches.length > 1){ sw = null; return; } const t = e.touches[0]; sw = { x: t.clientX, y: t.clientY, at: Date.now() }; }, { passive: true });
scroller.addEventListener('touchend', e => {
  if (!sw) return; const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, fast = Date.now() - sw.at < 700; sw = null;
  if (ED.on || G || !fast || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  ui.week = addD(ui.week, dx < 0 ? 7 : -7); ui.anim = dx < 0 ? 'push' : 'pop'; render();
}, { passive: true });
document.addEventListener('touchstart', () => {}, { passive: true });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) window.scrollTo(0, 0); }, 60));
window.addEventListener('storage', e => { if (e.key === KEY){ D = load(); OCC.clear(); applyLang(); applyTheme(); refreshAll(); } });

// Uhrzeit-Updates: nur Geändertes austauschen und nie, während jemand scrollt oder den Finger auf dem Bildschirm hat
let tickT = 0;
function tick(){
  clearTimeout(tickT);
  if (document.hidden) return;
  if (G){ if (Date.now() - (G.t || 0) > 30000 && !busy()) cancelGesture(); else return; }   // hängende Geste lösen
  if (busy()){ tickT = setTimeout(tick, 1500); return; }
  const t = today();
  if (t !== ui.lastToday){ if (ui.week === wkStart(ui.lastToday)) ui.week = wkStart(t); ui.lastToday = t; OCC.clear(); refreshAll(); schedulePush(); return; }
  if (ui.tab === 'day' || ui.tab === 'week') safe('tick', softRender);
}
setInterval(tick, 30000);
// Zurück aus dem Hintergrund: erst warten, bis iOS die App wieder zeichnet, dann aufräumen und neu aufbauen
let resumeT = 0;
function onResume(){
  clearTimeout(resumeT);
  resumeT = setTimeout(() => requestAnimationFrame(() => requestAnimationFrame(() => {
    if (document.hidden) return;
    safe('resume', () => { unstick(); tick(); if (!busy() && !G) heal(); });
  })), 150);
}
// Zustände, die nach einer Unterbrechung hängen bleiben könnten
function unstick(){
  if (G) cancelGesture();
  lockScroll(false); stopAuto();
  scroller.style.overflowY = '';
  page.classList.remove('push', 'pop'); page.style.display = '';
  for (const l of document.querySelectorAll('.layer.out')) l.remove();
  const tu = $('.tut'); if (tu && !tu.classList.contains('in')) tu.remove();
  const max = Math.max(0, scroller.scrollHeight - scroller.clientHeight);
  if (scroller.scrollTop > max) scroller.scrollTop = max;
  if (!page.firstElementChild) render();
}
document.addEventListener('visibilitychange', () => {
  if (document.hidden){ if (G) cancelGesture(); return; }
  onResume();
  const st = pushStatus();
  if (D.set.push.on && (!st.last || Date.now() - st.last > 6 * 3600e3)) pushSync().catch(() => {});
});
window.addEventListener('pageshow', onResume);
window.addEventListener('focus', onResume);

/* ================= Start ================= */
applyLang(); applyTheme();
ui.week = wkStart(today());
try { const raw = localStorage.getItem(KEY); if (raw && JSON.parse(raw).v !== DATA_V) save(); } catch (e) {}
render();
if ((D.set.tut || 0) < 3) tutorial();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded && !stack.length && !ED.on && !$('.tut')){ reloaded = true; location.reload(); } });
}
setTimeout(() => { if (D.set.push.on) pushSync().catch(() => {}); }, 3000);
</script>
