<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Stundenplan</title>
<meta name="description" content="Dein persönlicher Stundenplan: Master-Woche, Routinen, Blocker und To-Dos.">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stundenplan">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f2f2f7; --card:#fff; --sbg:#f2f2f7; --scard:#fff; --seg:#fff;
  --label:#000; --label2:rgba(60,60,67,.6); --label3:rgba(60,60,67,.3); --sep:rgba(60,60,67,.2); --grid:rgba(60,60,67,.09);
  --fill:rgba(120,120,128,.12); --press:rgba(120,120,128,.16);
  --tint:#007aff; --red:#ff3b30; --green:#34c759; --orange:#ff9500;
  --glass:rgba(255,255,255,.6); --glass2:rgba(248,248,250,.86); --hi:rgba(255,255,255,.98); --edge:rgba(0,0,0,.13);
  --gshadow:0 8px 28px rgba(0,0,0,.10),0 1px 2px rgba(0,0,0,.05);
  --bar:rgba(242,242,247,.74); --r:24px;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --tabb:max(calc(var(--safe-b) - 12px), 14px);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Segoe UI",Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000; --card:#1c1c1e; --sbg:#1c1c1e; --scard:#2c2c2e; --seg:#636366;
    --label:#fff; --label2:rgba(235,235,245,.6); --label3:rgba(235,235,245,.3); --sep:rgba(84,84,88,.6); --grid:rgba(84,84,88,.38);
    --fill:rgba(118,118,128,.24); --press:rgba(118,118,128,.32);
    --tint:#0a84ff; --red:#ff453a; --green:#30d158; --orange:#ff9f0a;
    --glass:rgba(40,40,44,.56); --glass2:rgba(30,30,34,.86); --hi:rgba(255,255,255,.32); --edge:rgba(0,0,0,.55);
    --gshadow:0 8px 28px rgba(0,0,0,.5),0 1px 2px rgba(0,0,0,.3);
    --bar:rgba(0,0,0,.62);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--label);
  font:17px/1.29 var(--font);letter-spacing:-.2px;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;letter-spacing:inherit;background:none;border:0;margin:0;padding:0;cursor:pointer;text-align:inherit}
.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.i.xs{width:13px;height:13px;stroke-width:2.3;vertical-align:-2px;margin-right:3px}
.i.cm{width:15px;height:15px;stroke-width:3.2}

/* ---------- Liquid Glass ---------- */
.glass{position:relative;background:var(--glass);-webkit-backdrop-filter:blur(24px) saturate(190%);backdrop-filter:blur(24px) saturate(190%);box-shadow:var(--gshadow)}
.glass::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;padding:1px;
  background:linear-gradient(165deg,var(--hi) 0%,rgba(255,255,255,.14) 34%,rgba(255,255,255,0) 56%,var(--edge) 100%);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.gbtn{width:44px;height:44px;border-radius:22px;display:inline-flex;align-items:center;justify-content:center;color:var(--label);flex:none}
.gbtn .i{width:21px;height:21px;stroke-width:2.1}
.gbtn.tint{background:linear-gradient(rgba(255,255,255,.2),rgba(255,255,255,0)),var(--tint);color:#fff}
.gpill{height:44px;border-radius:22px;padding:0 16px;display:inline-flex;align-items:center;gap:4px;font-size:16px;font-weight:600;color:var(--label);white-space:nowrap}
.gbtn:active,.gpill:active{transform:scale(.94)}
.gbtn,.gpill{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}

/* ---------- Gerüst ---------- */
#app{position:fixed;inset:0;overflow:hidden}
.amb{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(70% 38% at 0% 0%,rgba(0,122,255,.13),transparent 70%),radial-gradient(55% 32% at 100% 4%,rgba(175,82,222,.10),transparent 70%),radial-gradient(70% 40% at 60% 100%,rgba(52,199,89,.06),transparent 70%)}
#scroll{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:0 0 calc(var(--tabb) + 96px)}
#scroll::before{content:"";display:block;height:calc(var(--safe-t) + 56px)} /* Abstand als Element statt padding, damit sticky überall gleich greift */
.page{max-width:700px;margin:0 auto;padding:0 16px}
.nav{position:absolute;top:0;left:0;right:0;z-index:9;padding-top:var(--safe-t);pointer-events:none}
.nav::before{content:"";position:absolute;inset:0 0 -18px;background:var(--bar);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);opacity:0;transition:opacity .25s;
  -webkit-mask-image:linear-gradient(#000 calc(100% - 26px),transparent);mask-image:linear-gradient(#000 calc(100% - 26px),transparent)}
.nav.sc::before{opacity:1}
.nav-in{position:relative;height:56px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 14px}
.nl,.nr{display:flex;gap:10px;pointer-events:auto}
.nl{justify-self:start} .nr{justify-self:end}
.nt{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw;opacity:0;transition:opacity .2s}
.nav.st .nt,.nav.always .nt{opacity:1}
.tabs{position:absolute;left:16px;right:16px;bottom:var(--tabb);height:64px;max-width:460px;margin:0 auto;border-radius:32px;display:flex;padding:4px;z-index:10}
.tabs .lens{position:absolute;top:4px;bottom:4px;left:4px;width:calc((100% - 8px) / 4);border-radius:28px;background:var(--fill);transition:transform .5s cubic-bezier(.3,1.25,.45,1)}
.tabs button{flex:1;position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;letter-spacing:.05px;color:var(--label);text-align:center;border-radius:28px}
.tabs button .i{width:25px;height:25px;stroke-width:1.8}
.tabs button.on{color:var(--tint)}
.tabs button.on .i{stroke-width:2.1}

/* ---------- Typografie ---------- */
.lt{font-size:34px;font-weight:800;letter-spacing:.1px;line-height:41px;margin:0}
.lts{font-size:16px;color:var(--label2);margin-top:2px;font-weight:500}
.gh{font-size:13px;color:var(--label2);text-transform:uppercase;letter-spacing:.1px;margin:26px 18px 8px;display:flex;justify-content:space-between;font-weight:500}
.gf{font-size:13px;color:var(--label2);margin:8px 18px 0;line-height:1.38}
.muted{color:var(--label2)}
.mt{margin-top:22px}

/* ---------- Listen ---------- */
.grp{background:var(--card);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:48px;padding:11px 18px;position:relative;width:100%;font-size:17px;text-align:left;color:var(--label)}
.cell+.cell::before{content:"";position:absolute;top:0;right:0;left:18px;border-top:.5px solid var(--sep)}
.cell.tap:active{background:var(--press)}
.cell .cg{flex:1;min-width:0;display:block}
.cell .ct{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cs{display:block;font-size:14px;color:var(--label2);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .cs.late{color:var(--red)} .cell .cs.warn{color:var(--orange)} .cell .cs.today{color:var(--tint)}
.cell .chev{color:var(--label3);width:17px;height:17px;stroke-width:2.6;margin-right:-4px}
.cell.tint{color:var(--tint)} .cell.red{color:var(--red)}
.cell.sel{background:var(--press)}
.tile{width:32px;height:32px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 70%),var(--c,var(--tint));box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.tile .i{width:19px;height:19px;stroke-width:2.1}
.tile.sm{width:24px;height:24px;border-radius:8px} .tile.sm .i{width:15px;height:15px}
.tile.lg{width:52px;height:52px;border-radius:16px} .tile.lg .i{width:28px;height:28px}
.tile.gray{--c:#8e8e93} .tile.green{--c:var(--green)} .tile.red{--c:var(--red)} .tile.orange{--c:var(--orange)}
.ib{color:var(--label3);display:flex;align-items:center;justify-content:center;width:36px;height:36px;margin:-6px -8px -6px 0;flex:none}
.ib.t{color:var(--tint)}
.ib:active{opacity:.4}
.struck{text-decoration:line-through;color:var(--label2)}
.nb{color:var(--tint);font-size:17px;font-weight:600;min-height:40px;display:inline-flex;align-items:center;white-space:nowrap}

/* ---------- Formular ---------- */
.fi{width:100%;border:0;background:none;outline:none;font:inherit;font-size:17px;color:var(--label);padding:0;margin:0;min-width:0}
.fi::placeholder{color:var(--label3)}
input[type=time],input[type=date]{-webkit-appearance:none;appearance:none;border:0;outline:none;background:var(--fill);border-radius:10px;padding:6px 12px;font:inherit;font-size:17px;color:var(--label);min-width:98px;min-height:36px;text-align:center;font-variant-numeric:tabular-nums;margin:-4px 0}
input[type=date]{min-width:136px}
input::-webkit-date-and-time-value{text-align:center}
input[type=time]::-webkit-calendar-picker-indicator,input[type=date]::-webkit-calendar-picker-indicator{display:none}
.seg{display:flex;background:var(--fill);border-radius:20px;padding:3px}
.seg button{flex:1;min-height:34px;border-radius:17px;font-size:14px;font-weight:500;text-align:center;padding:5px 4px;line-height:1.2;transition:background .2s}
.seg button.on{background:var(--seg);box-shadow:0 3px 10px rgba(0,0,0,.12),0 1px 2px rgba(0,0,0,.06);font-weight:600}
.seg .sc{display:block;font-size:10px;color:var(--label2);font-weight:500}
.days{display:flex;justify-content:space-between;gap:4px;padding:14px 16px 10px}
.days button{width:40px;height:40px;border-radius:50%;background:var(--fill);font-size:15px;font-weight:600;text-align:center}
.days button.on{background:var(--tint);color:#fff}
.presets{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px 14px}
.presets button{font-size:14px;color:var(--tint);background:var(--fill);border-radius:16px;padding:6px 12px;font-weight:600}
.cols{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;padding:16px 18px}
.cols button{aspect-ratio:1;border-radius:50%;background:var(--c);max-width:40px;width:100%;justify-self:center}
.cols button.on{box-shadow:0 0 0 3px var(--card),0 0 0 5.5px var(--c)}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;padding:16px}
.icons button{aspect-ratio:1;max-width:48px;width:100%;justify-self:center;border-radius:50%;background:var(--fill);color:var(--label2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.icons button .i{width:22px;height:22px;stroke-width:2}
.icons button.on{background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 70%),var(--c);color:#fff;box-shadow:0 3px 10px var(--cs)}
.sw{width:51px;height:31px;border-radius:16px;background:var(--fill);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 3px 1px rgba(0,0,0,.06);transition:transform .25s cubic-bezier(.3,1.3,.5,1)}
.sw.on{background:var(--green)} .sw.on::after{transform:translateX(20px)}
.ck{width:28px;height:28px;border-radius:50%;border:2px solid var(--c,var(--label3));flex:none;display:flex;align-items:center;justify-content:center;color:transparent;transition:background .15s,border-color .15s}
.ck.gray{border-color:var(--label3)}
.ck.on{background:var(--c,var(--tint));border-color:var(--c,var(--tint));color:#fff}
.ck.dash{border-style:dashed;border-color:var(--label3)}
.ck .i.cm{stroke:currentColor;width:15px;height:15px}
.abtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border-radius:26px;font-size:17px;font-weight:600;text-align:center}
.abtn+.abtn{margin-top:10px}
.abtn.tint{background:linear-gradient(rgba(255,255,255,.18),rgba(255,255,255,0)),var(--tint);color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.abtn.soft{background:var(--fill);color:var(--tint)}
.abtn.red{background:rgba(255,59,48,.12);color:var(--red)}
.abtn:active{transform:scale(.97)}
.abtn{transition:transform .2s cubic-bezier(.3,1.4,.5,1)}

/* ---------- Heute ---------- */
.banner{border-radius:20px;padding:12px 12px 12px 16px;margin-top:14px;display:flex;align-items:center;gap:12px;font-size:15px}
.banner .bg{flex:1;min-width:0}
.pill{background:var(--fill);color:var(--tint);font-size:15px;font-weight:600;border-radius:18px;padding:8px 14px;white-space:nowrap;flex:none}
.pill:active{opacity:.6}
.hero{border-radius:28px;padding:16px;margin-top:16px;background:linear-gradient(135deg,var(--ct),rgba(255,255,255,0) 75%),var(--glass);cursor:pointer}
.hero .hk{font-size:12px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--c)}
.hero .hr{display:flex;align-items:center;gap:12px;margin-top:8px}
.hero .ht{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
.hero .hs{font-size:15px;color:var(--label2);margin-top:2px}
.prog{height:6px;border-radius:3px;background:var(--fill);margin-top:14px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--c);border-radius:3px}
.tl{margin-top:22px}
.tlr{display:grid;grid-template-columns:42px 52px minmax(0,1fr) auto;column-gap:12px;align-items:start;cursor:pointer}
.tlt{font-size:13px;font-weight:600;color:var(--label2);text-align:right;padding-top:16px;font-variant-numeric:tabular-nums}
.rail{display:flex;justify-content:center}
.cap{width:52px;border-radius:26px;display:flex;justify-content:center;padding-top:14px;color:#fff;position:relative;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 55%),var(--c);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),inset 0 -1px 0 rgba(0,0,0,.06),0 4px 14px var(--cs);transition:transform .2s}
.cap .i{width:24px;height:24px;stroke-width:2}
.tlr:active .cap{transform:scale(.96)}
.tlb{padding:12px 0 6px;min-width:0}
.tlb .tt{font-size:17px;font-weight:600;line-height:22px;overflow-wrap:anywhere}
.tlb .ts{font-size:14px;color:var(--label2);margin-top:2px;font-variant-numeric:tabular-nums}
.tlb .tag{display:inline-block;font-size:12px;font-weight:600;color:var(--orange);background:rgba(255,149,0,.14);border-radius:7px;padding:2px 7px;margin-top:5px}
.tdl{margin-top:6px;display:flex;flex-direction:column;gap:3px}
.tdl span{font-size:14px;color:var(--label);display:flex;align-items:center;gap:7px;min-width:0}
.tdl span::before{content:"";width:12px;height:12px;border-radius:50%;border:1.6px solid var(--c);flex:none}
.tdl span.dn{color:var(--label2);text-decoration:line-through}
.tdl span.dn::before{background:var(--c)}
.tdl em{font-style:normal;font-size:13px;color:var(--label2)}
.tlr .ck{margin-top:14px}
.tlr.past .cap{opacity:.42;box-shadow:none}
.tlr.past .tt{color:var(--label2)}
.tlr.now .cap{box-shadow:0 0 0 3px var(--bg),0 0 0 5.5px var(--c),0 6px 20px var(--cs)}
.tlr.now .tlt{color:var(--c)}
.tlr.skip .cap{background:none;border:2px dashed var(--c);color:var(--c);box-shadow:none;opacity:.55;padding-top:12px}
.tlr.skip .tt{text-decoration:line-through;color:var(--label2)}
.tlr.done .tt{color:var(--label2)}
.tlg{display:grid;grid-template-columns:42px 52px minmax(0,1fr);column-gap:12px;align-items:center}
.tlg .dash{justify-self:center;width:0;height:100%;border-left:2px dashed var(--label3)}
.tlg .gl{font-size:13px;color:var(--label2)}
.tlg.nw .tlt{padding:0;color:var(--red);font-weight:700}
.tlg.nw .dot{justify-self:center;width:14px;height:14px;border-radius:50%;background:var(--red);box-shadow:0 0 0 4px rgba(255,59,48,.2)}
.tlg.nw .gl{color:var(--red);font-weight:600}
.addrow{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;color:var(--tint);font-weight:600;font-size:16px;min-height:52px;border-radius:26px;background:var(--fill);margin-top:18px}
.addrow:active{transform:scale(.98)}
.empty{text-align:center;color:var(--label2);padding:40px 20px;font-size:15px;line-height:1.45}
.empty b{display:block;color:var(--label);font-size:20px;margin-bottom:6px;font-weight:700}
.welcome{border-radius:30px;padding:26px 20px 20px;margin-top:18px;text-align:center}
.welcome .tile{margin:0 auto 14px}
.welcome h2{font-size:23px;margin:0 0 6px;letter-spacing:-.3px}
.welcome p{margin:0 0 18px;color:var(--label2);font-size:15px;line-height:1.45}
.hint{display:flex;align-items:center;gap:12px;border-radius:22px;padding:12px 14px;margin-top:20px;font-size:15px;width:100%;text-align:left;background:var(--card)}
.hint .cg{flex:1}

/* ---------- Woche ---------- */
.page.wkp{padding:0 10px}
.wkh{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 12px;min-height:44px}
.wkh .r{font-size:16px;font-weight:600;color:var(--label2)}
.wk{background:var(--card);border-radius:var(--r)}
.wk-h{position:sticky;top:calc(var(--safe-t) + 56px);z-index:3;display:grid;grid-template-columns:32px repeat(7,minmax(0,1fr));background:var(--card);border-radius:var(--r) var(--r) 0 0;box-shadow:0 .5px 0 var(--sep);padding:8px 0 6px}
.hd{text-align:center;font-size:11px;color:var(--label2);font-weight:600;text-transform:uppercase;min-width:0;position:relative}
.hd b{display:block;font-size:17px;color:var(--label);font-weight:600;margin:2px auto 0;width:30px;height:30px;line-height:30px;border-radius:50%;font-variant-numeric:tabular-nums}
.hd.today b{background:var(--red);color:#fff}
.hd .dt{position:absolute;left:50%;bottom:-3px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--orange)}
.wk-b{position:relative;display:grid;grid-template-columns:32px repeat(7,minmax(0,1fr))}
.wk-t{position:relative}
.wk-t span{position:absolute;right:4px;font-size:10px;color:var(--label2);transform:translateY(-50%);font-variant-numeric:tabular-nums;font-weight:500}
.wk-c{position:relative;min-width:0}
.wk-c+.wk-c,.wk-t+.wk-c{border-left:.5px solid var(--grid)}
.wk-c.today{background:rgba(255,59,48,.04)}
.wk-l{position:absolute;left:32px;right:0;border-top:.5px solid var(--grid);pointer-events:none}
.blk{position:absolute;border-radius:10px;display:flex;align-items:center;justify-content:center;color:#fff;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.26),rgba(255,255,255,0) 70%),var(--c);box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 2px 6px var(--cs)}
.blk .i{width:19px;height:19px;stroke-width:2.1}
.blk.sm .i{width:13px;height:13px;stroke-width:2.4}
.blk.done{opacity:.5}
.blk.skip{background:none;border:1.5px dashed var(--c);color:var(--c);box-shadow:none;opacity:.6}
.blk.ed::after{content:"";position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px var(--c)}
.blk:active{filter:brightness(.92)}
.nowl{position:absolute;left:-3px;right:0;height:2px;background:var(--red);z-index:2;pointer-events:none}
.nowl::before{content:"";position:absolute;left:0;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.legend{display:flex;flex-wrap:wrap;gap:8px;padding:0 4px}
.lgd{display:inline-flex;align-items:center;gap:8px;background:var(--card);border-radius:18px;padding:5px 12px 5px 5px;font-size:14px;font-weight:500;max-width:100%}
.lgd span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- Detail ---------- */
.dh{display:flex;align-items:center;gap:14px;padding:4px 4px 0}
.dh .dt{font-size:24px;font-weight:700;letter-spacing:-.4px;line-height:1.15;overflow-wrap:anywhere}
.dh .ds{font-size:15px;color:var(--label2);margin-top:3px}
.skiptag{display:inline-block;margin-top:6px;font-size:13px;font-weight:600;color:var(--red);background:rgba(255,59,48,.12);border-radius:8px;padding:2px 8px}
.chips{display:flex;gap:8px;overflow-x:auto;margin:4px -16px 0;padding:2px 16px 4px;scrollbar-width:none;overscroll-behavior-x:contain}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-width:60px;padding:8px;border-radius:16px;background:var(--card);text-align:center;font-size:12px;color:var(--label2);font-weight:600}
.chip b{display:block;font-size:16px;color:var(--label);font-weight:700;margin-top:1px;font-variant-numeric:tabular-nums}
.chip.on{background:var(--tint);color:rgba(255,255,255,.85)} .chip.on b{color:#fff}

/* ---------- Ebenen ---------- */
.layer{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,0);transition:background-color .35s}
.layer.in{background:rgba(0,0,0,.28)}
.layer.out{background:rgba(0,0,0,0)}
.sheet{--card:var(--scard);position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:700px;height:calc(100% - var(--safe-t) - 10px);background:var(--sbg);border-radius:34px 34px 0 0;display:flex;flex-direction:column;transform:translateY(105%);transition:transform .45s cubic-bezier(.32,.72,0,1);box-shadow:0 -2px 24px rgba(0,0,0,.1)}
.sheet.float{left:10px;right:10px;bottom:max(var(--safe-b),10px);height:auto;max-height:calc(100% - var(--safe-t) - 40px);border-radius:36px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);--card:var(--fill2,rgba(255,255,255,.7))}
@media (prefers-color-scheme: dark){ .sheet.float{--card:rgba(255,255,255,.08)} }
.layer.in .sheet{transform:translateY(0)}
.layer.out .sheet{transform:translateY(105%)}
.grab{position:absolute;top:6px;left:50%;width:36px;height:5px;margin-left:-18px;border-radius:3px;background:var(--label3)}
.sh{flex:none;height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:8px 12px 0;touch-action:none}
.sh .nl,.sh .nr{display:flex;gap:8px}
.sht{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50vw}
.sb{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 16px calc(var(--safe-b) + 28px)}
.sheet.float .sb{padding-top:26px;padding-bottom:18px}
.sheet.float .sh{position:absolute;top:0;left:0;right:0;z-index:2;pointer-events:none;padding:12px 12px 0}
.sheet.float .sh button{pointer-events:auto}
.sheet.float .dh{padding-right:48px}
.al{display:flex;align-items:center;justify-content:center;z-index:70}
.alert{width:290px;background:var(--glass2);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-radius:30px;text-align:center;padding:22px 18px 16px;transform:scale(1.1);opacity:0;transition:transform .3s cubic-bezier(.3,1.3,.5,1),opacity .2s}
.al.in .alert{transform:scale(1);opacity:1}
.al.out .alert{opacity:0}
.alert .at{font-weight:700;font-size:17px;line-height:1.3}
.alert .am{font-size:14px;margin-top:6px;line-height:1.38;color:var(--label2)}
.alert .abt{display:flex;gap:10px;margin-top:18px}
.alert .abt button{flex:1;height:48px;border-radius:24px;font-size:17px;font-weight:600;text-align:center;background:var(--fill)}
.alert .abt button.b{background:var(--tint);color:#fff} .alert .abt button.d{background:var(--red);color:#fff}
.as{z-index:60;display:flex;align-items:flex-end;justify-content:center;padding:0 10px max(var(--safe-b),10px)}
.asw{width:100%;max-width:500px;border-radius:34px;padding:8px;transform:translateY(120%);transition:transform .4s cubic-bezier(.32,.72,0,1);background:var(--glass2)}
.as.in .asw{transform:translateY(0)}
.as.out .asw{transform:translateY(120%)}
.ash{padding:12px 16px 8px;font-size:13px;color:var(--label2);text-align:center;font-weight:600}
.asw button{display:block;width:100%;min-height:54px;padding:8px 14px;font-size:17px;font-weight:600;color:var(--tint);text-align:center;border-radius:27px}
.asw button:active{background:var(--press)}
.asw button.d{color:var(--red)}
.asw .asc{margin-top:6px;background:var(--fill);color:var(--label)}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(var(--tabb) + 76px);transform:translateY(16px) scale(.96);z-index:90;border-radius:24px;padding:12px 18px;font-size:15px;font-weight:500;display:flex;align-items:center;gap:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .35s cubic-bezier(.3,1.3,.5,1);max-width:calc(100% - 32px);color:var(--label)}
#toast.on{opacity:1;transform:none;pointer-events:auto}
#toast button{color:var(--tint);font-weight:700;white-space:nowrap}
.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}

const wdOf = k => (pd(k).getDay() + 6) % 7 + 1;

const monday = k => addD(k, 1 - wdOf(k));
const isTime = t => typeof t === 'string' && /^\d{2}:\d{2}$/.test(t) && +t.slice(0, 2) < 24 && +t.slice(3) < 60;
const tmin = t => +t.slice(0, 2) * 60 + +t.slice(3);
const fmtT = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
const nowMin = () => { const d = new Date(); return d.getHours() * 60 + d.getMinutes(); };
const fmtDur = m => { const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h} Std. ${r} Min.` : `${h} Std.`) : `${r} Min.`; };
function fD(k, o = {}){
  const d = pd(k), w = wdOf(k) - 1;
  let s = `${d.getDate()}. ${o.long ? MON_L[d.getMonth()] : MON_S[d.getMonth()]}`;
  if (o.year) s += ` ${d.getFullYear()}`;
  if (o.wd === 'long') s = `${WD_L[w]}, ${s}`; else if (o.wd !== false) s = `${WD_S[w]}., ${s}`;
  return s;
}
function rel(k, o){ const n = diffD(today(), k); return n === 0 ? 'Heute' : n === 1 ? 'Morgen' : n === -1 ? 'Gestern' : fD(k, o); }
function kw(k){ const d = pd(k); d.setDate(d.getDate() + 3 - (d.getDay() + 6) % 7); const w1 = new Date(d.getFullYear(), 0, 4, 12); return 1 + Math.round(((d - w1) / 864e5 - 3 + (w1.getDay() + 6) % 7) / 7); }
function daysLabel(days){
  const s = [...days].sort();
  if (s.length === 7) return 'Täglich';
  if (same(s, [1,2,3,4,5])) return 'Mo–Fr';
  if (same(s, [6,7])) return 'Wochenende';
  const parts = []; let i = 0;
  while (i < s.length){ let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; parts.push(j - i >= 2 ? `${WD_S[s[i]-1]}–${WD_S[s[j]-1]}` : s.slice(i, j + 1).map(x => WD_S[x-1]).join(', ')); i = j + 1; }
  return parts.join(', ') || 'Kein Tag';
}

/* ================= Daten ================= */
// Ein Time-Slot der Master-Woche: { id, title, type, start, end, days[1=Mo..7=So], color, icon }
// ov[Datum] = { s: { slotId: { skip, e:{geänderte Felder} } }, x: [einmalige Slots] } – Abweichungen nur für diesen Tag
const FIELDS = ['title','type','start','end','color','icon'];
const blank = () => ({ v: DATA_V, slots: [], ov: {}, chk: {}, todos: [] });
function normSlot(s, withDays){
  const title = typeof s.title === 'string' && s.title.trim() ? s.title : 'Ohne Titel';
  const o = { id: String(s.id || uid()), title, type: s.type === 'blocker' ? 'blocker' : 'routine',
    start: isTime(s.start) ? s.start : '08:00', end: isTime(s.end) ? s.end : '09:00', color: colorOk(s.color) ? s.color : 'blue',
    icon: iconOk(s.icon) ? s.icon : (suggestIcon(title) || 'clock') };
  if (tmin(o.end) <= tmin(o.start)){ o.end = fmtT(Math.min(tmin(o.start) + 60, 1439)); if (tmin(o.end) <= tmin(o.start)) o.start = fmtT(tmin(o.end) - 1); }
  if (withDays) o.days = [...new Set((Array.isArray(s.days) ? s.days : []).map(Number).filter(n => n >= 1 && n <= 7))].sort();
  return o;
}
function cleanEdit(e){
  const o = {}; if (!e || typeof e !== 'object') return o;
  if (typeof e.title === 'string' && e.title.trim()) o.title = e.title;
  if (e.type === 'routine' || e.type === 'blocker') o.type = e.type;
  if (isTime(e.start)) o.start = e.start;
  if (isTime(e.end)) o.end = e.end;
  if (colorOk(e.color)) o.color = e.color;
  if (iconOk(e.icon)) o.icon = e.icon;
  return o;
}
// Gespeicherte Daten jeder Version (auch v1 mit mehreren Plänen) in das aktuelle Format bringen.
function migrate(d){
  const out = blank();
  if (!d || typeof d !== 'object') return out;
  let src = Array.isArray(d.slots) ? d.slots : null;
  if (!src && Array.isArray(d.plans)){ const p = d.plans.find(x => x && x.id === 'std') || d.plans[0]; src = p && Array.isArray(p.slots) ? p.slots : []; }
  out.slots = (src || []).filter(s => s && typeof s === 'object').map(s => normSlot(s, true));
  const seen = new Set(); for (const s of out.slots){ if (seen.has(s.id)) s.id = uid(); seen.add(s.id); }
  const ids = new Set(out.slots.map(s => s.id));
  if (d.ov && typeof d.ov === 'object') for (const [k, o] of Object.entries(d.ov)){
    if (!isKey(k) || !o || typeof o !== 'object') continue;
    const n = { s: {}, x: [] };
    if (o.s && typeof o.s === 'object') for (const [id, v] of Object.entries(o.s)){
      if (!ids.has(id) || !v || typeof v !== 'object') continue;
      const e = cleanEdit(v.e), r = {}; if (v.skip) r.skip = true; if (Object.keys(e).length) r.e = e; if (r.skip || r.e) n.s[id] = r;
    }
    if (Array.isArray(o.x)) n.x = o.x.filter(s => s && typeof s === 'object').map(s => normSlot(s, false));
    if (Object.keys(n.s).length || n.x.length) out.ov[k] = n;
  }
  if (d.chk && typeof d.chk === 'object') for (const [k, day] of Object.entries(d.chk)){
    if (!isKey(k) || !day || typeof day !== 'object') continue;
    const n = {}; for (const [id, c] of Object.entries(day)) if (c === 1 || c === true || (c && c.d)) n[id] = 1;
    if (Object.keys(n).length) out.chk[k] = n;
  }
  if (Array.isArray(d.todos)) out.todos = d.todos.filter(t => t && typeof t.title === 'string' && t.title.trim()).map(t => ({
    id: String(t.id || uid()), title: t.title, note: typeof t.note === 'string' ? t.note : '', done: !!t.done, doneAt: t.done ? (+t.doneAt || Date.now()) : null,
    due: isKey(t.due) ? t.due : null, at: t.at && isKey(t.at.date) && t.at.slot ? { date: t.at.date, slot: String(t.at.slot) } : null, created: +t.created || Date.now() }));
  return out;
}
function load(){
  let raw = null;
  try { raw = localStorage.getItem(KEY); } catch (e) {}
  if (!raw) return blank();
  try {
    const j = JSON.parse(raw);
    if (j && j.v !== DATA_V){ try { localStorage.setItem('sp.backup.v' + (j.v || 1), raw); } catch (_) {} }
    return migrate(j);
  } catch (e) { try { localStorage.setItem('sp.defekt.' + Date.now(), raw); } catch (_) {} return blank(); }
}
let D = load();
const OCC = new Map();
function save(){
  OCC.clear();
  try { localStorage.setItem(KEY, JSON.stringify(D)); return true; }
  catch (e) { toast('Speichern fehlgeschlagen. Ist der Speicher voll?'); return false; }
}
function replaceData(n){ D = n; save(); }

const slotById = id => D.slots.find(s => s.id === id);
const ensureOv = k => D.ov[k] || (D.ov[k] = { s: {}, x: [] });
const ensureOs = (k, id) => { const o = ensureOv(k); return o.s[id] || (o.s[id] = {}); };
function cleanOv(k){
  const o = D.ov[k]; if (!o) return;
  for (const id of Object.keys(o.s)){ const r = o.s[id]; if (r.e && !Object.keys(r.e).length) delete r.e; if (!r.skip && !r.e) delete o.s[id]; }
  if (!Object.keys(o.s).length && !o.x.length) delete D.ov[k];
}
// Alle Time-Slots eines Datums: Master-Woche + Abweichungen nur für diesen Tag
function occ(k){
  if (OCC.has(k)) return OCC.get(k);
  const wd = wdOf(k), o = D.ov[k], out = [];
  for (const s of D.slots){
    if (!s.days.includes(wd)) continue;
    const r = o && o.s[s.id], e = r && r.e;
    const x = { ...s, ...(e || {}), id: s.id, days: s.days, base: s, extra: false, edited: !!(e && Object.keys(e).length), skipped: !!(r && r.skip), date: k };
    if (tmin(x.end) <= tmin(x.start)) x.end = fmtT(Math.min(tmin(x.start) + 30, 1439));
    out.push(x);
  }
  if (o) for (const s of o.x) out.push({ ...s, base: null, extra: true, edited: false, skipped: false, date: k });
  out.sort((a, b) => tmin(a.start) - tmin(b.start) || tmin(a.end) - tmin(b.end) || a.title.localeCompare(b.title, 'de'));
  OCC.set(k, out);
  return out;
}
const findOcc = (k, id) => occ(k).find(o => o.id === id) || null;
const dayAdjusted = k => occ(k).some(o => o.edited || o.skipped || o.extra);
const isDone = (k, id) => !!(D.chk[k] && D.chk[k][id]);
function setDone(k, id, v){ const day = D.chk[k] || (D.chk[k] = {}); if (v) day[id] = 1; else delete day[id]; if (!Object.keys(day).length) delete D.chk[k]; }
const todosAt = (k, id) => D.todos.filter(t => t.at && t.at.date === k && t.at.slot === id);
function atOcc(t){ if (!t.at) return null; const o = findOcc(t.at.date, t.at.slot); return o && !o.skipped ? o : null; }
const newTodo = (title, at = null) => ({ id: uid(), title, note: '', done: false, doneAt: null, due: null, at, created: Date.now() });
function unassign(pred){ for (const t of D.todos) if (t.at && !t.done && pred(t)) t.at = null; }
function resetDayData(k){ const o = D.ov[k]; if (!o) return; const xs = new Set(o.x.map(s => s.id)); unassign(t => t.at.date === k && xs.has(t.at.slot)); delete D.ov[k]; }

/* ================= UI-Grundlagen ================= */
const nav = $('#nav'), navL = $('#navL'), navT = $('#navT'), navR = $('#navR'), scroller = $('#scroll'), page = $('#page');
const TABS = ['day', 'week', 'todo', 'plan'];
const ui = { tab: 'day', week: monday(today()), pwd: wdOf(today()), showDone: false, scroll: {}, lastToday: today() };
const A = {};
const stack = [];

let toastT = null, toastUndo = null;
function toast(msg, undo){
  const el = $('#toast');
  el.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button data-a="_undo">Rückgängig</button>' : ''}`;
  toastUndo = undo || null;
  el.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => { el.classList.remove('on'); toastUndo = null; }, undo ? 5000 : 2400);
}
A._undo = () => { const u = toastUndo; toastUndo = null; $('#toast').classList.remove('on'); if (u) u(); };
function withUndo(msg, fn){
  const snap = JSON.stringify(D);
  if (fn() === false) return;
  save(); refreshAll();
  toast(msg, () => { replaceData(migrate(JSON.parse(snap))); refreshAll(); });
}

// Sheet: o.float = schwebende Glas-Karte (Details), sonst großes Sheet. Kopf: runde Glas-Knöpfe ✕ und ✓.
function sheet(o){
  const L = document.createElement('div');
  L.className = 'layer';
  const left = o.cancel !== false ? `<button class="gbtn glass" data-a="_left" aria-label="${o.float ? 'Schließen' : 'Abbrechen'}">${I('x')}</button>` : '';
  const right = o.onRight ? `<button class="gbtn glass tint" data-a="_right" aria-label="${esc(o.rightLabel || 'Sichern')}">${I('check')}</button>` : '';
  L.innerHTML = `<div class="sheet ${o.float ? 'float glass' : ''}" role="dialog" aria-modal="true" aria-label="${esc(o.title || '')}"><div class="grab"></div><div class="sh"><div class="nl">${o.float ? '' : left}</div><div class="sht">${esc(o.title || '')}</div><div class="nr">${o.float ? left : right}</div></div><div class="sb"></div></div>`;
  const sh = L.firstElementChild, sb = $('.sb', L);
  const S = {
    el: L, sb, closed: false,
    set(html){ const st = sb.scrollTop; sb.innerHTML = html; sb.scrollTop = st; },
    close(){
      if (S.closed) return; S.closed = true;
      const ae = document.activeElement; if (ae && L.contains(ae)) ae.blur();
      L.classList.remove('in'); L.classList.add('out');
      const i = stack.indexOf(S); if (i >= 0) stack.splice(i, 1);
      setTimeout(() => L.remove(), 460);
      o.onClose && o.onClose();
    },
    cancel(){ S.close(); }
  };
  L._on = { ...(o.on || {}), _left: () => S.cancel(), _right: () => o.onRight ? o.onRight(S) : S.close() };
  L.addEventListener('click', e => { if (e.target === L) S.cancel(); });
  if (o.onInput){
    L.addEventListener('input', e => { if (e.target.name) o.onInput(e.target.name, e.target.value, e.target, 'input'); });
    L.addEventListener('change', e => { if (e.target.name) o.onInput(e.target.name, e.target.value, e.target, 'change'); });
  }
  let y0 = null, dy = 0;
  const head = $('.sh', L);
  head.addEventListener('touchstart', e => { if (e.target.closest('button')) return; y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 === null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  head.addEventListener('touchend', () => { if (y0 === null) return; y0 = null; sh.style.transition = ''; if (dy > 110){ sh.style.transform = 'translateY(110%)'; S.cancel(); } else sh.style.transform = ''; }, { passive: true });
  S.set(o.body || '');
  document.body.appendChild(L);
  stack.push(S);
  L.getBoundingClientRect();
  requestAnimationFrame(() => L.classList.add('in'));
  return S;
}
function ask({ title, msg = '', ok = 'OK', cancel = 'Abbrechen', danger = false }){
  return new Promise(res => {
    const L = document.createElement('div');
    L.className = 'layer al';
    L.innerHTML = `<div class="alert glass" role="alertdialog"><div class="at">${esc(title)}</div>${msg ? `<div class="am">${esc(msg)}</div>` : ''}<div class="abt"><button data-a="c">${esc(cancel)}</button><button data-a="o" class="${danger ? 'd' : 'b'}">${esc(ok)}</button></div></div>`;
    let done = false;
    const fin = v => { if (done) return; done = true; L.classList.remove('in'); L.classList.add('out'); setTimeout(() => L.remove(), 250); res(v); };
    L._on = { c: () => fin(false), o: () => fin(true) };
    document.body.appendChild(L); L.getBoundingClientRect();
    requestAnimationFrame(() => L.classList.add('in'));
  });
}
function menu(title, items){
  const L = document.createElement('div');
  L.className = 'layer as';
  L.innerHTML = `<div class="asw glass">${title ? `<div class="ash">${esc(title)}</div>` : ''}${items.map((it, i) => `<button class="${it.danger ? 'd' : ''}" data-a="i" data-i="${i}">${esc(it.label)}</button>`).join('')}<button class="asc" data-a="x">Abbrechen</button></div>`;
  let done = false;
  const close = () => { if (done) return false; done = true; L.classList.remove('in'); L.classList.add('out'); setTimeout(() => L.remove(), 420); return true; };
  L._on = { i: el => { if (close()) items[+el.dataset.i].fn(); }, x: close };
  L.addEventListener('click', e => { if (e.target === L) close(); });
  document.body.appendChild(L); L.getBoundingClientRect();
  requestAnimationFrame(() => L.classList.add('in'));

/* ================= Rendering ================= */
const VIEWS = {};
function render(){
  const v = VIEWS[ui.tab]();
  navL.innerHTML = v.left || ''; navR.innerHTML = v.right || ''; navT.textContent = v.title || '';
  nav.classList.toggle('always', !!v.navAlways);
  page.className = 'page ' + (v.cls || '');
  page.innerHTML = v.body;
  const idx = TABS.indexOf(ui.tab);
  for (const b of document.querySelectorAll('#tabs button')) b.classList.toggle('on', b.dataset.t === ui.tab);
  $('#lens').style.transform = `translateX(${idx * 100}%)`;
  onScroll();
}
function refreshAll(){ render(); for (const s of stack.slice()) if (s.refresh && !s.closed) s.refresh(); }
function onScroll(){ const y = scroller.scrollTop; nav.classList.toggle('sc', y > 4); nav.classList.toggle('st', y > 40); }
scroller.addEventListener('scroll', onScroll, { passive: true });
function switchTab(t){
  if (t === ui.tab){
    if (t === 'week' && ui.week !== monday(today())){ ui.week = monday(today()); render(); scrollWeekToNow(); return; }
    scroller.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  ui.scroll[ui.tab] = scroller.scrollTop;
  ui.tab = t;
  render();
  if (t === 'week' && ui.scroll.week === undefined) scrollWeekToNow();
  else scroller.scrollTop = ui.scroll[t] || 0;
  onScroll();
}
A.tab = el => switchTab(el.dataset.t);
const icoTile = (o, cls = '') => `<span class="tile ${cls} c-${o.color}">${I(o.icon)}</span>`;

/* ---------- Heute (nur der heutige Tag, als Zeitstrahl) ---------- */
VIEWS.day = () => {
  const k = today(), n = nowMin(), list = occ(k);
  let h = `<h1 class="lt">Heute</h1><div class="lts">${fD(k, { wd: 'long', long: true })}</div>`;
  if (!D.slots.length && !list.length){
    h += `<div class="welcome glass"><span class="tile lg c-blue">${I('plan')}</span><h2>Deine Master-Woche</h2><p>Trag einmal ein, wann du was machst: feste <b>Blocker</b> wie Arbeit oder Schule und <b>Routinen</b> wie Sport oder Lernen. Hier siehst du dann jeden Tag deinen Zeitstrahl.</p><button class="abtn tint" data-a="startSetup">Master-Woche einrichten</button><button class="abtn soft" data-a="sample">Mit Beispielwoche starten</button></div>`;
    return { title: 'Heute', body: h };
  }
  if (dayAdjusted(k)) h += `<div class="banner glass"><span class="bg">Heute weicht von deiner Master-Woche ab.</span><button class="pill" data-a="resetToday">Zurücksetzen</button></div>`;
  const live = list.filter(o => !o.skipped);
  const cur = live.filter(o => tmin(o.start) <= n && n < tmin(o.end)).pop();
  const nxt = live.find(o => tmin(o.start) > n);
  if (cur){
    const s = tmin(cur.start), e = tmin(cur.end), pct = Math.round((n - s) / (e - s) * 100);
    h += `<div class="hero glass c-${cur.color}" data-a="openOcc" data-d="${k}" data-id="${esc(cur.id)}" role="button"><div class="hk">Jetzt</div><div class="hr">${icoTile(cur, 'lg')}<div><div class="ht">${esc(cur.title)}</div><div class="hs">noch ${fmtDur(e - n)} · bis ${cur.end}</div></div></div><div class="prog"><i style="width:${pct}%"></i></div>${nxt ? `<div class="hs" style="margin-top:10px">Danach: ${esc(nxt.title)} um ${nxt.start}</div>` : ''}</div>`;
  } else if (nxt){
    h += `<div class="hero glass c-${nxt.color}" data-a="openOcc" data-d="${k}" data-id="${esc(nxt.id)}" role="button"><div class="hk">Als Nächstes</div><div class="hr">${icoTile(nxt, 'lg')}<div><div class="ht">${esc(nxt.title)}</div><div class="hs">um ${nxt.start} · in ${fmtDur(tmin(nxt.start) - n)}</div></div></div></div>`;
  } else if (live.length){
    h += `<div class="hero glass c-green"><div class="hk">Feierabend</div><div class="hr"><span class="tile lg c-green">${I('check')}</span><div><div class="ht">Für heute ist alles durch.</div><div class="hs">${live.length} Time-Slots erledigt.</div></div></div></div>`;
  }
  h += `<div class="tl">`;
  if (!list.length) h += `<div class="empty"><b>Heute ist frei</b>In deiner Master-Woche steht für heute nichts.</div>`;
  let prevEnd = null, nowShown = !!cur;
  const nowRow = () => `<div class="tlg nw" style="height:34px"><span class="tlt">${fmtT(n)}</span><span class="dot"></span><span class="gl">Jetzt${nxt ? ` · ${esc(nxt.title)} in ${fmtDur(tmin(nxt.start) - n)}` : ''}</span></div>`;
  list.forEach((o, i) => {
    const s = tmin(o.start), e = tmin(o.end);
    if (!o.skipped){
      if (!nowShown && n < s){ if (prevEnd !== null || i === 0) h += (prevEnd !== null ? `<div class="tlg" style="height:12px"><span></span><span class="dash"></span><span></span></div>` : '') + nowRow(); nowShown = true; prevEnd = Math.max(prevEnd ?? n, n); }
      if (prevEnd !== null){
        const gap = s - prevEnd;
        h += gap >= 15 ? `<div class="tlg" style="height:${Math.round(Math.min(64, Math.max(30, gap * .22)))}px"><span></span><span class="dash"></span><span class="gl">${fmtDur(gap)} frei</span></div>` : `<div class="tlg" style="height:12px"><span></span><span class="dash"></span><span></span></div>`;
      }
      prevEnd = Math.max(prevEnd ?? 0, e);
    } else if (prevEnd !== null) h += `<div class="tlg" style="height:12px"><span></span><span class="dash"></span><span></span></div>`;
    h += tlRow(o, n);
  });
  if (!nowShown && live.length){ h += `<div class="tlg" style="height:12px"><span></span><span class="dash"></span><span></span></div>` + nowRow(); }
  h += `<button class="addrow" data-a="addToday">${I('plus')}Nur heute hinzufügen</button></div>`;
  const loose = D.todos.filter(x => !x.done && !atOcc(x)).length;
  if (loose) h += `<button class="hint" data-a="tab" data-t="todo"><span class="tile gray">${I('list')}</span><span class="cg">${loose === 1 ? '1 To-Do wartet' : loose + ' To-Dos warten'} noch auf einen Time-Slot.</span>${CHEV}</button>`;
  return { title: 'Heute', body: h, right: `<button class="gbtn glass" data-a="addToday" aria-label="Time-Slot hinzufügen">${I('plus')}</button>` };
};
function tlRow(o, n){
  const s = tmin(o.start), e = tmin(o.end), dur = e - s;
  const now = !o.skipped && s <= n && n < e, past = !o.skipped && e <= n, done = isDone(o.date, o.id);
  const td = todosAt(o.date, o.id);
  const hgt = Math.round(Math.min(170, Math.max(52, 30 + dur * .42)));
  const tds = td.slice(0, 3).map(t => `<span class="${t.done ? 'dn' : ''}">${esc(t.title)}</span>`).join('') + (td.length > 3 ? `<em>+ ${td.length - 3} weitere</em>` : '');
  return `<div class="tlr c-${o.color}${now ? ' now' : ''}${past ? ' past' : ''}${o.skipped ? ' skip' : ''}${done ? ' done' : ''}" data-a="openOcc" data-d="${o.date}" data-id="${esc(o.id)}" role="button">
    <div class="tlt">${o.start}</div>
    <div class="rail"><div class="cap" style="height:${hgt}px">${I(o.icon)}</div></div>

/* ---------- Woche ---------- */
const PPM = 0.9, TOP = 10, MINV = 26;
VIEWS.week = () => {
  const mon = ui.week, t = today(), n = nowMin(), isCur = mon === monday(t);
  const days = [...Array(7)].map((_, i) => addD(mon, i));
  const all = days.map(d => occ(d));
  let minS = 7 * 60, maxE = 21 * 60;
  for (const l of all) for (const o of l) if (!o.skipped){ minS = Math.min(minS, tmin(o.start)); maxE = Math.max(maxE, tmin(o.end)); }
  const H0 = Math.floor(minS / 60), H1 = Math.min(24, Math.ceil(maxE / 60));
  const Y = m => TOP + (m - H0 * 60) * PPM;
  let h = `<div class="wkh"><span class="r">${fD(days[0], { wd: false })} – ${fD(days[6], { wd: false, year: true })}</span>${isCur ? '' : `<button class="pill" data-a="weekNow">Diese Woche</button>`}</div>`;
  h += `<div class="wk" data-swipe="wk"><div class="wk-h"><span></span>`;
  days.forEach((d, i) => { h += `<button class="hd${d === t ? ' today' : ''}" data-a="dayMenu" data-d="${d}">${WD_S[i]}<b>${pd(d).getDate()}</b>${dayAdjusted(d) ? '<span class="dt"></span>' : ''}</button>`; });
  h += `</div><div class="wk-b" style="height:${Y(H1 * 60) + TOP}px"><div class="wk-t">`;
  for (let hr = H0; hr <= H1; hr++) h += `<span style="top:${Y(hr * 60)}px">${pad(hr % 24)}</span>`;
  h += `</div>`;
  for (let hr = H0; hr <= H1; hr++) h += `<div class="wk-l" style="top:${Y(hr * 60)}px"></div>`;
  const legend = new Map();
  days.forEach((d, i) => {
    h += `<div class="wk-c${d === t ? ' today' : ''}">`;
    for (const { o, lane, cols } of layout(all[i])){
      const s = Math.max(tmin(o.start), H0 * 60), e = tmin(o.end);
      const hh = Math.max((e - s) * PPM, MINV * PPM) - 3;
      if (!o.skipped){ const lk = o.title + '|' + o.icon + '|' + o.color; if (!legend.has(lk)) legend.set(lk, o); }
      h += `<button class="blk c-${o.color}${hh < 30 || cols > 1 ? ' sm' : ''}${isDone(d, o.id) ? ' done' : ''}${o.skipped ? ' skip' : ''}${o.edited || o.extra ? ' ed' : ''}" style="top:${Y(s) + 1.5}px;height:${hh}px;left:calc(${lane * 100 / cols}% + 2px);width:calc(${100 / cols}% - 4px)" data-a="openOcc" data-d="${d}" data-id="${esc(o.id)}" aria-label="${esc(o.title)} ${o.start}">${I(o.icon)}</button>`;
    }
    if (d === t && n >= H0 * 60 && n <= H1 * 60) h += `<div class="nowl" style="top:${Y(n) - 1}px"></div>`;
    h += `</div>`;
  });
  h += `</div></div>`;
  if (legend.size){
    const items = [...legend.values()].sort((a, b) => a.title.localeCompare(b.title, 'de'));
    h += `<div class="gh">Legende</div><div class="legend">${items.map(o => `<span class="lgd">${icoTile(o, 'sm')}<span>${esc(o.title)}</span></span>`).join('')}</div>`;
    h += `<div class="gf">Tippe auf einen Block für Details, auf einen Tag, um nur dort etwas hinzuzufügen. Gestrichelt = fällt aus, weißer Punkt = an diesem Tag geändert.</div>`;
  } else h += `<div class="empty">In dieser Woche ist nichts geplant.</div>`;
  return { title: `KW ${kw(mon)}`, navAlways: true, cls: 'wkp', body: h,
    left: `<button class="gbtn glass" data-a="weekPrev" aria-label="Vorherige Woche">${I('chevL')}</button>`,
    right: `<button class="gbtn glass" data-a="weekNext" aria-label="Nächste Woche">${I('chevR')}</button>` };
};
function layout(list){
  const out = []; let cl = [], ce = -1;
  const flush = () => {
    const ends = [], tmp = [];
    for (const o of cl){ const s = tmin(o.start); let li = ends.findIndex(e => e <= s); if (li < 0){ li = ends.length; ends.push(0); } ends[li] = Math.max(tmin(o.end), s + MINV); tmp.push({ o, lane: li }); }
    for (const x of tmp) out.push({ ...x, cols: ends.length });
    cl = []; ce = -1;
  };
  for (const o of list){ const s = tmin(o.start); if (cl.length && s >= ce) flush(); cl.push(o); ce = Math.max(ce, tmin(o.end), s + MINV); }
  if (cl.length) flush();
  return out;
}
function scrollWeekToNow(){
  const mon = ui.week; let minS = 7 * 60;
  for (let i = 0; i < 7; i++) for (const o of occ(addD(mon, i))) if (!o.skipped) minS = Math.min(minS, tmin(o.start));
  const H0 = Math.floor(minS / 60);
  const target = mon === monday(today()) ? Math.max(nowMin() - 120, H0 * 60) : H0 * 60;
  scroller.scrollTop = Math.max(0, (target - H0 * 60) * PPM);
  onScroll();
}
A.weekPrev = () => { ui.week = addD(ui.week, -7); render(); };
A.weekNext = () => { ui.week = addD(ui.week, 7); render(); };
A.weekNow = () => { ui.week = monday(today()); render(); scrollWeekToNow(); };

  menu(fD(k, { wd: 'long', long: true }), items);

VIEWS.todo = () => ({
  title: 'To-Dos', body: `<h1 class="lt">To-Dos</h1>
  <div class="grp" style="margin-top:16px"><div class="cell"><span class="ck dash"></span><input class="fi" id="newTodo" placeholder="Neues To-Do" maxlength="200" enterkeyhint="done" autocomplete="off" data-enter="addTodo"><button class="nb" data-a="addTodo">Hinzufügen</button></div></div>
  <div id="tdl">${todoList()}</div>`

function todoList(){
  const open = D.todos.filter(t => !t.done), un = [], pl = [];
  for (const t of open){ const o = atOcc(t); if (o) pl.push({ t, o }); else un.push(t); }
  un.sort((a, b) => (a.due || '9999').localeCompare(b.due || '9999') || a.created - b.created);
  pl.sort((a, b) => a.o.date.localeCompare(b.o.date) || tmin(a.o.start) - tmin(b.o.start) || a.t.created - b.t.created);
  const done = D.todos.filter(t => t.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  let h = '';
  if (un.length) h += `<div class="gh">Ohne Time-Slot</div><div class="grp">${un.map(t => todoRow(t, null)).join('')}</div>`;
  if (pl.length) h += `<div class="gh">Eingeplant</div><div class="grp">${pl.map(x => todoRow(x.t, x.o)).join('')}</div>`;
  if (!open.length) h += `<div class="empty"><b>${D.todos.length ? 'Alles erledigt' : 'Noch keine To-Dos'}</b>${D.todos.length ? 'Stark!' : 'Schreib oben auf, was ansteht. Danach ordnest du jedes To-Do einem Time-Slot zu.'}</div>`;
  else if (un.length) h += `<div class="gf">Tippe auf ${I('calplus', 'xs')} um ein To-Do einem Time-Slot zuzuordnen. Dann erscheint es dort zum Abhaken.</div>`;
  if (done.length){
    h += `<div class="gh">Erledigt <span>${done.length}</span></div><div class="grp">`;
    h += `<button class="cell tap tint" data-a="toggleShowDone"><span class="cg">${ui.showDone ? 'Ausblenden' : 'Anzeigen'}</span></button>`;
    if (ui.showDone) h += done.map(t => todoRow(t, null)).join('') + `<button class="cell tap red" data-a="clearDone"><span class="cg">Erledigte löschen</span></button>`;
    h += `</div>`;
  }
  return h;
}
function todoRow(t, o){
  let sub = '', cls = '';
  if (t.done) sub = 'Erledigt';
  else if (o){ const d = diffD(today(), o.date); sub = `${rel(o.date)} · ${o.start} · ${esc(o.title)}`; cls = d < 0 ? 'late' : d === 0 ? 'today' : ''; if (d < 0) sub = 'Verpasst: ' + sub; }
  else if (t.at){ sub = 'Time-Slot entfällt – neu einplanen'; cls = 'warn'; }
  else if (t.due){ const d = diffD(today(), t.due); sub = `Fällig: ${rel(t.due)}`; cls = d < 0 ? 'late' : d === 0 ? 'today' : ''; }
  if (!sub && t.note && !t.done) sub = esc(t.note.split('\n')[0]);
  return `<div class="cell"><button class="ck gray${t.done ? ' on' : ''}" data-a="todoDone" data-id="${t.id}" aria-label="Erledigt">${I('check', 'cm')}</button><button class="cg" data-a="openTodo" data-id="${t.id}"><span class="ct${t.done ? ' struck' : ''}">${esc(t.title)}</span>${sub ? `<span class="cs ${cls}">${sub}</span>` : ''}</button>${t.done ? '' : `<button class="ib t" data-a="assignTodo" data-id="${t.id}" aria-label="Time-Slot zuweisen">${I('calplus')}</button>`}</div>`;
}
function refreshTodos(){ const l = $('#tdl'); if (ui.tab === 'todo' && l) l.innerHTML = todoList(); else render(); }

// Detail eines Time-Slots: nur Name, To-Dos, „Bearbeiten“ und „An diesem Tag ausfallen lassen“
function openOcc(date, id){
  const body = () => {
    const o = findOcc(date, id); if (!o) return null;
    const td = todosAt(date, id);
    let h = `<div class="dh">${icoTile(o, 'lg')}<div style="min-width:0"><div class="dt">${esc(o.title)}</div><div class="ds">${date === today() ? 'Heute' : fD(date)} · ${o.start} – ${o.end}</div>${o.skipped ? '<span class="skiptag">Fällt an diesem Tag aus</span>' : ''}</div></div>`;
    h += `<div class="gh">To-Dos</div><div class="grp c-${o.color}">${td.map(t => `<div class="cell"><button class="ck${t.done ? ' on' : ''}" data-a="tdone" data-id="${t.id}" aria-label="Erledigt">${I('check', 'cm')}</button><span class="cg${t.done ? ' struck' : ''}">${esc(t.title)}</span><button class="ib" data-a="tun" data-id="${t.id}" aria-label="Zuweisung entfernen">${I('x')}</button></div>`).join('')}<button class="cell tap tint" data-a="addTd">${I('plus')}<span class="cg">To-Do hinzufügen</span></button></div>`;
    h += `<div class="mt"><button class="abtn tint" data-a="edit">${I('pencil')}Bearbeiten</button>`;
    h += o.skipped ? `<button class="abtn soft" data-a="unskip">${I('undo')}Wieder einplanen</button>` : `<button class="abtn red" data-a="skip">${I('skip')}An diesem Tag ausfallen lassen</button>`;
    return h + `</div>`;
  };
  const first = body(); if (first === null) return;
  const upd = () => { save(); refreshAll(); };
  const S = sheet({ float: true, body: first, on: {
    edit: () => slotEditor({ mode: 'occ', date, id }),
    skip: () => {
      const o = findOcc(date, id); if (!o) return;
      if (o.extra){ S.close(); withUndo('Fällt aus', () => { const v = D.ov[date]; if (!v) return false; v.x = v.x.filter(s => s.id !== id); cleanOv(date); unassign(t => t.at.date === date && t.at.slot === id); }); }
      else { S.close(); withUndo(`${o.title} fällt ${date === today() ? 'heute' : 'am ' + fD(date, { wd: false })} aus`, () => { ensureOs(date, id).skip = true; }); }
    },
    unskip: () => { const r = D.ov[date] && D.ov[date].s[id]; if (r){ delete r.skip; cleanOv(date); } upd(); },
    tdone: el => { const t = D.todos.find(x => x.id === el.dataset.id); if (t){ t.done = !t.done; t.doneAt = t.done ? Date.now() : null; } upd(); },
    tun: el => { const t = D.todos.find(x => x.id === el.dataset.id); if (t) t.at = null; upd(); },
    addTd: () => todoPicker(date, id)
  } });
  S.refresh = () => { const b = body(); if (b === null) S.close(); else S.set(b); };
}

function slotEditor(cfg){
  let base = null, o = null, choose = false, scope = 'week';
  const date = cfg.date || null;
  if (cfg.mode === 'tpl'){ if (cfg.slotId){ base = slotById(cfg.slotId); if (!base) return; } }
  else if (cfg.mode === 'occ'){ o = findOcc(date, cfg.id); if (!o) return; if (o.extra) scope = 'day'; else { base = o.base; choose = true; scope = 'day'; } }
  else { choose = true; scope = 'day'; }
  const src = o || base, isNew = !src;
  let st = 8 * 60;
  if (isNew){
    const wd = cfg.day || wdOf(date);
    const ex = date ? occ(date) : D.slots.filter(s => s.days.includes(wd));
    if (ex.length) st = Math.max(...ex.map(s => tmin(s.end)));
    if (date && date === today()) st = Math.max(st, Math.ceil((nowMin() + 1) / 15) * 15);
    st = Math.min(st, 22 * 60 + 45);
  }
  const f = src ? { title: src.title, type: src.type, start: src.start, end: src.end, color: src.color, icon: src.icon, days: base ? [...base.days] : [], auto: false }
    : { title: '', type: 'blocker', start: fmtT(st), end: fmtT(Math.min(st + 60, 23 * 60 + 59)), color: 'blue', icon: 'clock', days: [cfg.day || wdOf(date)], auto: true };
  const dayWord = date === today() ? 'heute' : date ? 'am ' + fD(date, { wd: false }) : '';
  const body = () => {
    let h = '';
    if (choose) h += `<div class="seg" style="margin-top:4px"><button class="${scope === 'day' ? 'on' : ''}" data-a="scope" data-v="day">Nur ${dayWord}</button><button class="${scope === 'week' ? 'on' : ''}" data-a="scope" data-v="week">Jede Woche</button></div>
      <div class="gf">${scope === 'day' ? `Gilt nur ${dayWord}. Deine Master-Woche bleibt, wie sie ist.` : 'Ändert deine Master-Woche für jede Woche.'}</div>`;
    h += `<div class="grp" style="margin-top:${choose ? 18 : 4}px"><div class="cell"><span class="tile c-${f.color}" id="ntile">${I(f.icon)}</span><input class="fi" name="title" value="${esc(f.title)}" placeholder="Name, z. B. Arbeit oder Sport" maxlength="60" autocomplete="off"></div></div>`;
    h += `<div class="gh">Symbol</div><div class="grp"><div class="icons c-${f.color}">${ICONS.map(([k, n]) => `<button class="${f.icon === k ? 'on' : ''}" data-a="icon" data-v="${k}" aria-label="${n}">${I(k)}</button>`).join('')}</div></div>`;
    h += `<div class="gh">Farbe</div><div class="grp"><div class="cols">${COLORS.map(([k]) => `<button class="c-${k}${f.color === k ? ' on' : ''}" data-a="color" data-v="${k}" aria-label="${k}"></button>`).join('')}</div></div>`;
    h += `<div class="gh">Art</div><div class="seg"><button class="${f.type === 'blocker' ? 'on' : ''}" data-a="type" data-v="blocker">Blocker</button><button class="${f.type === 'routine' ? 'on' : ''}" data-a="type" data-v="routine">Routine</button></div>
      <div class="gf">${f.type === 'routine' ? 'Routine: wiederkehrende Aufgabe, die du im Zeitstrahl abhakst.' : 'Blocker: feste, geblockte Zeit wie Arbeit, Schule oder Training.'}</div>`;
    h += `<div class="gh">Zeit</div><div class="grp"><div class="cell"><span class="cg">Beginn</span><input type="time" name="start" value="${f.start}" required></div><div class="cell"><span class="cg">Ende</span><input type="time" name="end" value="${f.end}" required></div></div>`;
    if (scope === 'week') h += `<div class="gh">Wochentage</div><div class="grp"><div class="days">${WD_S.map((w, i) => `<button class="${f.days.includes(i + 1) ? 'on' : ''}" data-a="day" data-v="${i + 1}">${w}</button>`).join('')}</div><div class="presets"><button data-a="preset" data-v="1,2,3,4,5">Mo–Fr</button><button data-a="preset" data-v="6,7">Wochenende</button><button data-a="preset" data-v="1,2,3,4,5,6,7">Täglich</button></div></div>`;
    if (cfg.mode === 'occ' && o.edited) h += `<div class="mt"><button class="abtn soft" data-a="reset">${I('undo')}Auf Master-Woche zurücksetzen</button></div>`;
    if (cfg.mode === 'tpl' && base) h += `<div class="mt"><button class="abtn red" data-a="del">${I('trash')}Aus Master-Woche löschen</button></div>`;
    return h;
  };
  const rerender = () => S.set(body());
  const iconUI = () => { const t = $('#ntile', S.el); if (t) t.innerHTML = I(f.icon); for (const b of S.el.querySelectorAll('.icons button')) b.classList.toggle('on', b.dataset.v === f.icon); };
  const save2 = () => {
    const title = f.title.trim();
    const bad = (msg, sel) => { toast(msg); const g = sel && $(sel, S.el)?.closest('.grp'); if (g){ g.classList.add('shake'); setTimeout(() => g.classList.remove('shake'), 400); } };
    if (!title) return bad('Bitte gib einen Namen ein.', '[name=title]');
    if (!isTime(f.start) || !isTime(f.end)) return bad('Bitte Beginn und Ende angeben.', '[name=start]');
    if (tmin(f.end) <= tmin(f.start)) return bad('Das Ende muss nach dem Beginn liegen. Über Mitternacht: zwei Slots anlegen.', '[name=end]');
    if (scope === 'week' && !f.days.length) return bad('Wähle mindestens einen Wochentag.', '.days');
    const vals = { title, type: f.type, start: f.start, end: f.end, color: f.color, icon: f.icon };
    const days = [...f.days].sort();
    if (cfg.mode === 'tpl'){
      if (base){ if (!slotById(base.id)){ S.close(); return; } Object.assign(base, vals, { days }); }
      else D.slots.push({ id: uid(), ...vals, days });
    } else if (cfg.mode === 'occ' && o.extra){
      const x = D.ov[date] && D.ov[date].x.find(s => s.id === o.id); if (x) Object.assign(x, vals);
    } else if (cfg.mode === 'occ'){
      const live = slotById(base.id); if (!live){ S.close(); return; }
      if (scope === 'day'){
        const e = {}; for (const k of FIELDS) if (!same(vals[k], live[k])) e[k] = vals[k];
        const r = ensureOs(date, live.id); if (Object.keys(e).length) r.e = e; else delete r.e;
        cleanOv(date);
      } else {
        Object.assign(live, vals, { days });
        const r = D.ov[date] && D.ov[date].s[live.id]; if (r){ delete r.e; cleanOv(date); }
      }
    } else {
      if (scope === 'day') ensureOv(date).x.push({ id: uid(), ...vals });
      else D.slots.push({ id: uid(), ...vals, days });
    }
    save(); S.close(); refreshAll();
  };
  const S = sheet({ title: isNew ? 'Neuer Time-Slot' : 'Bearbeiten', rightLabel: isNew ? 'Hinzufügen' : 'Sichern', body: body(), onRight: save2,
    onInput: (name, v) => {
      if (name === 'title'){ f.title = v; if (f.auto){ const s = suggestIcon(v); if (s && s !== f.icon){ f.icon = s; iconUI(); } } }
      else if (name === 'start' || name === 'end') f[name] = v;
    },
    on: {
      scope: el => { scope = el.dataset.v; if (scope === 'week' && !f.days.length) f.days = base ? [...base.days] : [wdOf(date)]; rerender(); },
      type: el => { f.type = el.dataset.v; rerender(); },
      color: el => { f.color = el.dataset.v; rerender(); },
      icon: el => { f.icon = el.dataset.v; f.auto = false; iconUI(); },
      day: el => { const v = +el.dataset.v; f.days = f.days.includes(v) ? f.days.filter(x => x !== v) : [...f.days, v]; rerender(); },
      preset: el => { f.days = el.dataset.v.split(',').map(Number); rerender(); },
      reset: () => { const r = D.ov[date] && D.ov[date].s[o.id]; if (r){ delete r.e; cleanOv(date); } save(); S.close(); refreshAll(); toast('Wieder wie in der Master-Woche'); },
      del: () => { S.close(); withUndo(`„${base.title}“ gelöscht`, () => { D.slots = D.slots.filter(s => s !== base); for (const k of Object.keys(D.ov)){ delete D.ov[k].s[base.id]; cleanOv(k); } unassign(t => t.at.slot === base.id); }); }
    } });
  if (isNew) setTimeout(() => { const t = $('[name=title]', S.el); if (t && !('ontouchstart' in window)) t.focus(); }, 350);
}

function rangeSkipSheet(){
  const t = today();
  const f = { from: t, to: addD(t, 13), ids: new Set() };
  const list = () => D.slots.slice().sort((a, b) => (a.type === b.type ? 0 : a.type === 'blocker' ? -1 : 1) || tmin(a.start) - tmin(b.start));
  const count = () => { let n = 0; if (f.to < f.from || diffD(f.from, f.to) > 365) return 0; for (let k = f.from; k <= f.to; k = addD(k, 1)) for (const s of D.slots) if (f.ids.has(s.id) && s.days.includes(wdOf(k))) n++; return n; };
  const body = () => {
    let h = `<div class="gh" style="margin-top:4px">Zeitraum</div><div class="grp"><div class="cell"><span class="cg">Von</span><input type="date" name="from" value="${f.from}"></div><div class="cell"><span class="cg">Bis</span><input type="date" name="to" value="${f.to}"></div></div>
      <div class="presets" style="padding:12px 4px 0"><button data-a="len" data-v="7">1 Woche</button><button data-a="len" data-v="14">2 Wochen</button><button data-a="len" data-v="21">3 Wochen</button><button data-a="len" data-v="42">6 Wochen</button></div>`;
    h += `<div class="gh">Was fällt aus?</div><div class="grp">${list().map(s => { const on = f.ids.has(s.id); return `<button class="cell tap" data-a="tg" data-id="${esc(s.id)}">${icoTile(s)}<span class="cg"><span class="ct">${esc(s.title)}</span><span class="cs">${s.start} – ${s.end} · ${daysLabel(s.days)}</span></span><span class="ck gray${on ? ' on' : ''}" style="--c:var(--tint)">${I('check', 'cm')}</span></button>`; }).join('') || '<div class="cell"><span class="cg muted">Deine Master-Woche ist noch leer.</span></div>'}</div>`;
    const n = count();
    h += `<div class="gf">${f.to < f.from ? 'Das Ende liegt vor dem Beginn.' : n ? `${n} Termine fallen aus. Danach gilt automatisch wieder deine Master-Woche.` : 'Wähle aus, was in diesem Zeitraum ausfällt. Einmalige Termine ergänzt du in der Wochenübersicht.'}</div>`;
    return h;
  };
  const S = sheet({ title: 'Ferien & freie Tage', rightLabel: 'Übernehmen', body: body(),
    onInput: (name, v, el, ev) => { if ((name === 'from' || name === 'to') && ev === 'change' && isKey(v)){ const len = diffD(f.from, f.to); f[name] = v; if (name === 'from' && f.to < f.from) f.to = addD(v, Math.max(len, 0)); S.set(body()); } },
    on: {
      len: el => { f.to = addD(f.from, +el.dataset.v - 1); S.set(body()); },
      tg: el => { const id = el.dataset.id; f.ids.has(id) ? f.ids.delete(id) : f.ids.add(id); S.set(body()); }
    },
    onRight: () => {
      if (f.to < f.from){ toast('Das Ende liegt vor dem Beginn.'); return; }
      if (diffD(f.from, f.to) > 365){ toast('Bitte höchstens ein Jahr auf einmal.'); return; }
      if (!f.ids.size){ toast('Wähle mindestens einen Time-Slot.'); return; }
      const n = count();
      S.close();
      withUndo(`${n} Termine fallen aus`, () => { for (let k = f.from; k <= f.to; k = addD(k, 1)) for (const s of D.slots) if (f.ids.has(s.id) && s.days.includes(wdOf(k))) ensureOs(k, s.id).skip = true; });
    } });
}

function todoSheet(id){
  const t = D.todos.find(x => x.id === id); if (!t) return;
  const f = { title: t.title, note: t.note, due: t.due, at: t.at ? { ...t.at } : null, done: t.done };
  const body = () => {
    const o = f.at ? (() => { const x = findOcc(f.at.date, f.at.slot); return x && !x.skipped ? x : null; })() : null;
    return `<div class="grp" style="margin-top:4px"><div class="cell"><input class="fi" name="title" value="${esc(f.title)}" placeholder="Titel" maxlength="200" autocomplete="off"></div><div class="cell" style="align-items:flex-start"><textarea class="fi" name="note" placeholder="Notiz" maxlength="4000" style="resize:none;min-height:80px;line-height:1.35">${esc(f.note)}</textarea></div></div>
    <div class="gh">Planung</div><div class="grp">
      <button class="cell tap" data-a="pick">${o ? icoTile(o) : `<span class="tile">${I('calplus')}</span>`}<span class="cg"><span class="ct">Time-Slot</span><span class="cs${f.at && !o ? ' warn' : ''}">${o ? `${rel(o.date)} · ${o.start} · ${esc(o.title)}` : f.at ? 'Entfällt – neu wählen' : 'Noch keiner'}</span></span>${CHEV}</button>
      ${f.at ? `<button class="cell tap tint" data-a="unpick"><span class="cg">Zuweisung entfernen</span></button>` : ''}
      <div class="cell"><span class="tile orange">${I('clock')}</span><span class="cg">Fällig am</span><input type="date" name="due" value="${f.due || ''}">${f.due ? `<button class="ib" data-a="nodue" aria-label="Datum entfernen">${I('x')}</button>` : ''}</div>
    </div>
    <div class="gf">Mit Time-Slot erscheint das To-Do genau dort im Zeitstrahl.</div>
    <div class="grp mt"><div class="cell"><span class="cg">Erledigt</span><button class="sw${f.done ? ' on' : ''}" data-a="done" role="switch" aria-checked="${f.done}"></button></div></div>
    <div class="mt"><button class="abtn red" data-a="del">${I('trash')}To-Do löschen</button></div>`;
  };
  const S = sheet({ title: 'To-Do', body: body(),
    onInput: (name, v, el, ev) => { if (name === 'due'){ if (ev === 'change'){ f.due = isKey(v) ? v : null; S.set(body()); } } else if (name === 'title' || name === 'note') f[name] = v; },
    onRight: () => {
      const title = f.title.trim(); if (!title){ toast('Bitte gib einen Titel ein.'); return; }
      const live = D.todos.find(x => x.id === id); if (!live){ S.close(); return; }
      if (live.done !== f.done) live.doneAt = f.done ? Date.now() : null;
      Object.assign(live, { title, note: f.note.replace(/\s+$/, ''), due: f.due, at: f.at, done: f.done });
      save(); S.close(); refreshAll();
    },
    on: {
      pick: () => slotPicker(f.at, at => { f.at = at; S.set(body()); }),
      unpick: () => { f.at = null; S.set(body()); },
      nodue: () => { f.due = null; S.set(body()); },
      done: () => { f.done = !f.done; S.set(body()); },
      del: () => { S.close(); withUndo('To-Do gelöscht', () => { D.todos = D.todos.filter(x => x.id !== id); }); }
    } });
}

function slotPicker(cur, cb){
  const t = today();
  let d = cur && cur.date >= t ? cur.date : t;
  const body = () => {
    const days = [...Array(14)].map((_, i) => addD(t, i));
    const n = nowMin(), list = occ(d).filter(o => !o.skipped);
    let h = `<div class="chips">${days.map((x, i) => `<button class="chip${x === d ? ' on' : ''}" data-a="d" data-d="${x}">${i === 0 ? 'Heute' : i === 1 ? 'Morgen' : WD_S[wdOf(x) - 1]}<b>${pd(x).getDate()}.${pd(x).getMonth() + 1}.</b></button>`).join('')}</div>`;
    h += `<div class="grp" style="margin-top:12px"><div class="cell"><span class="cg">Anderes Datum</span><input type="date" name="date" value="${d}"></div></div>`;
    h += `<div class="gh">${fD(d, { wd: 'long' })}</div><div class="grp">`;
    h += list.map(o => { const sel = cur && cur.date === d && cur.slot === o.id, past = d === t && tmin(o.end) <= n; return `<button class="cell tap${sel ? ' sel' : ''}" data-a="pick" data-id="${esc(o.id)}">${icoTile(o)}<span class="cg"><span class="ct">${esc(o.title)}</span><span class="cs">${o.start} – ${o.end}${past ? ' · schon vorbei' : ''}</span></span>${sel ? `<span style="color:var(--tint)">${I('check')}</span>` : ''}</button>`; }).join('') || `<div class="cell"><span class="cg muted">Keine Time-Slots an diesem Tag.</span></div>`;
    h += `</div>`;
    if (cur) h += `<div class="mt"><button class="abtn red" data-a="clear">Zuweisung entfernen</button></div>`;
    return h;
  };
  const S = sheet({ title: 'Time-Slot wählen', body: body(),
    onInput: (name, v, el, ev) => { if (name === 'date' && ev === 'change' && isKey(v)){ d = v; S.set(body()); } },
    on: {
      d: el => { d = el.dataset.d; S.set(body()); },
      pick: el => { S.close(); cb({ date: d, slot: el.dataset.id }); },
      clear: () => { S.close(); cb(null); }
    } });
  setTimeout(() => { const on = $('.chip.on', S.el); if (on) on.scrollIntoView({ inline: 'center', block: 'nearest' }); }, 60);
}

function todoPicker(date, id){
  const body = () => {
    const open = D.todos.filter(t => !t.done && !(t.at && t.at.date === date && t.at.slot === id));
    return `<div class="grp" style="margin-top:4px"><div class="cell"><input class="fi" name="nt" placeholder="Neues To-Do für diesen Slot" maxlength="200" autocomplete="off" enterkeyhint="done" data-enter="add"><button class="nb" data-a="add">Hinzufügen</button></div></div>
    ${open.length ? `<div class="gh">Offene To-Dos</div><div class="grp">${open.map(t => { const o = atOcc(t); return `<button class="cell tap" data-a="pick" data-id="${t.id}"><span class="cg"><span class="ct">${esc(t.title)}</span>${o ? `<span class="cs">Bisher: ${rel(o.date)} · ${o.start} ${esc(o.title)}</span>` : ''}</span><span class="tile sm green">${I('plus')}</span></button>`; }).join('')}</div><div class="gf">Antippen, um das To-Do diesem Time-Slot zuzuordnen.</div>` : `<div class="empty">Keine weiteren offenen To-Dos.</div>`}`;
  };
  const S = sheet({ title: 'To-Do hinzufügen', body: body(), on: {
    pick: el => { const t = D.todos.find(x => x.id === el.dataset.id); if (t){ t.at = { date, slot: id }; save(); refreshAll(); } S.close(); },
    add: () => { const inp = $('[name=nt]', S.el), v = inp.value.trim(); if (!v){ inp.focus(); return; } D.todos.push(newTodo(v, { date, slot: id })); save(); refreshAll(); S.close(); }
  } });
}

/* ================= Backup ================= */
async function exportData(){
  const json = JSON.stringify({ app: 'stundenplan', version: APP_VERSION, exported: new Date().toISOString(), data: D });
  const name = `stundenplan-backup-${today()}.json`;
  try {
    const file = new File([json], name, { type: 'application/json' });
    if (navigator.canShare && navigator.canShare({ files: [file] })){ await navigator.share({ files: [file], title: 'Stundenplan-Backup' }); return; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  toast('Backup gesichert');
}
$('#imp').addEventListener('change', async e => {
  const file = e.target.files && e.target.files[0]; if (!file) return;
  let j; try { j = JSON.parse(await file.text()); } catch (_) { toast('Die Datei ist kein gültiges Backup.'); return; }
  const data = j && j.data ? j.data : j;
  if (!data || !(Array.isArray(data.slots) || Array.isArray(data.plans))){ toast('Die Datei ist kein Stundenplan-Backup.'); return; }
  if (!await ask({ title: 'Backup laden?', msg: 'Deine aktuellen Daten auf diesem Gerät werden durch das Backup ersetzt.', ok: 'Laden' })) return;
  replaceData(migrate(data)); refreshAll(); toast('Backup geladen');
});

function loadSample(){
  if (D.slots.length){ toast('Deine Master-Woche ist nicht leer.'); return; }
  const S = (title, type, start, end, days, color, icon) => ({ id: uid(), title, type, start, end, days, color, icon });
  D.slots = [
    S('Morgenroutine', 'routine', '06:30', '07:00', [1,2,3,4,5], 'orange', 'sunrise'),
    S('Arbeit', 'blocker', '07:30', '16:00', [1,2,3,4,5], 'blue', 'work'),
    S('Sport', 'routine', '17:00', '18:30', [1,3,5], 'green', 'gym'),
    S('Abendessen', 'blocker', '18:45', '19:30', [1,2,3,4,5], 'yellow', 'food'),
    S('Lernen', 'routine', '19:30', '21:00', [2,4], 'indigo', 'book'),
    S('Side-Hustle', 'routine', '19:30', '21:00', [1,3], 'purple', 'laptop'),
    S('Abendroutine', 'routine', '22:00', '22:30', [1,2,3,4,5,6,7], 'teal', 'moon'),
    S('Wocheneinkauf', 'routine', '10:00', '11:00', [6], 'mint', 'cart'),
    S('Fußball', 'blocker', '14:00', '17:00', [6], 'red', 'soccer'),
    S('Wochenplanung', 'routine', '18:00', '18:30', [7], 'gray', 'plan')
  ];
  save(); refreshAll(); toast('Beispielwoche geladen. Anpassen unter Master.');
}

/* ================= Ereignisse ================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const L = el.closest('.layer');
  const h = L ? L._on : (document.querySelector('.layer') && !el.closest('#toast') ? null : A);
  const fn = h && h[el.dataset.a];
  if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.enter){
    e.preventDefault();
    const L = e.target.closest('.layer'), h = L ? L._on : A, fn = h && h[e.target.dataset.enter];
    if (fn) fn(e.target, e);
  } else if (e.key === 'Escape' && stack.length) stack[stack.length - 1].cancel();
});
let sw = null;
scroller.addEventListener('touchstart', e => { const el = e.target.closest('[data-swipe]'); if (!el || e.touches.length > 1){ sw = null; return; } const t = e.touches[0]; sw = { x: t.clientX, y: t.clientY, at: Date.now() }; }, { passive: true });
scroller.addEventListener('touchend', e => {
  if (!sw) return; const t = e.changedTouches[0], dx = t.clientX - sw.x, dy = t.clientY - sw.y, fast = Date.now() - sw.at < 700; sw = null;
  if (!fast || Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.6) return;
  ui.week = addD(ui.week, dx < 0 ? 7 : -7); render();
}, { passive: true });
document.addEventListener('touchstart', () => {}, { passive: true });
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false }));
document.addEventListener('dblclick', e => e.preventDefault(), { passive: false });
document.addEventListener('focusout', () => setTimeout(() => { const a = document.activeElement; if (!a || !/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) window.scrollTo(0, 0); }, 60));
window.addEventListener('storage', e => { if (e.key === KEY){ D = load(); OCC.clear(); refreshAll(); } });

function tick(){
  const t = today();
  if (t !== ui.lastToday){ if (ui.week === monday(ui.lastToday)) ui.week = monday(t); ui.lastToday = t; OCC.clear(); refreshAll(); return; }
  if (ui.tab === 'day' || ui.tab === 'week') render();
}
setInterval(() => { if (!document.hidden) tick(); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

if (D.v !== DATA_V) D.v = DATA_V;
try { const raw = localStorage.getItem(KEY); if (raw && JSON.parse(raw).v !== DATA_V) save(); } catch (e) {}
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded && !stack.length){ reloaded = true; location.reload(); } });
}
</script>
