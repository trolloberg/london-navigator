<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Trip Assistant</title>
<meta name="description" content="Dein persönlicher Reise-Assistent: Eckdaten rein, Plan, Packliste und Tools raus.">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d1113" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Trip">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --surface-2:#efede7; --ink:#111517; --ink-2:#3b4246; --muted:#7a8287;
  --line:rgba(17,21,23,.08); --accent:#1d6b5a; --accent-ink:#fff; --accent-soft:#e2efe9;
  --hot:#d9603b; --hot-soft:#fbe8e1; --ok:#2e7d4f;
  --r-lg:22px; --r:16px; --r-sm:12px;
  --shadow:0 1px 1px rgba(17,21,23,.03),0 6px 24px rgba(17,21,23,.06);
  --bar:rgba(246,245,241,.82);
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1113; --surface:#171c1f; --surface-2:#20272a; --ink:#eef1f2; --ink-2:#c4cbce; --muted:#8c979c;
    --line:rgba(255,255,255,.08); --accent:#5cc4a6; --accent-ink:#06231c; --accent-soft:#16312a;
    --hot:#f08a64; --hot-soft:#3a2219; --ok:#6cc38e; --shadow:none; --bar:rgba(13,17,19,.82);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--ink);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;text-size-adjust:100%;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
input,textarea,select{-webkit-user-select:text;user-select:text}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);text-decoration:none}
h1,h2,h3,p{margin:0}
svg.i{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.sm{width:18px;height:18px}

/* ---------- App-Shell: nichts verschiebt sich ---------- */
#app{position:fixed;inset:0;display:flex;flex-direction:column}
.top{flex:none;padding:calc(var(--safe-t) + 10px) 16px 10px;display:flex;align-items:center;gap:8px;background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-bottom:1px solid transparent;z-index:5}
.top.line{border-bottom-color:var(--line)}
.top .ttl{flex:1;min-width:0;text-align:center;font-weight:600;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .side{width:76px;display:flex}
.top .side.r{justify-content:flex-end}
.tbtn{display:inline-flex;align-items:center;gap:2px;background:none;border:0;padding:6px 4px;color:var(--accent);font-weight:500;font-size:1rem}
.cell .tbtn{color:var(--muted)}
.tbtn.round{width:36px;height:36px;border-radius:50%;background:var(--surface-2);color:var(--ink);justify-content:center;padding:0}
.scroll{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.page{max-width:640px;margin:0 auto;padding:4px 16px 28px}
.tabs{flex:none;display:flex;padding:6px 8px calc(var(--safe-b) + 6px);background:var(--bar);-webkit-backdrop-filter:saturate(1.6) blur(18px);backdrop-filter:saturate(1.6) blur(18px);border-top:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;padding:6px 0 2px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:500;color:var(--muted)}
.tabs button.on{color:var(--accent)}

/* ---------- Typografie ---------- */
.lt{font-size:2rem;font-weight:700;letter-spacing:-.025em;line-height:1.1}
.h2{font-size:1.2rem;font-weight:700;letter-spacing:-.015em}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:26px 2px 10px}
.sec .h2{font-size:1.12rem}
.sec .aside{font-size:.85rem;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.xs{font-size:.75rem}
.num{font-variant-numeric:tabular-nums}

/* ---------- Bausteine ---------- */
.card{background:var(--surface);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);border:1px solid var(--line)}
.card+.card{margin-top:12px}
.group{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:52px;position:relative;background:none;border:0;width:100%;text-align:left}
.cell+.cell::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.cell .grow{flex:1;min-width:0}
.sub{font-size:.82rem;color:var(--muted);margin-top:1px}
.ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);flex:none}
.ic.hot{background:var(--hot-soft);color:var(--hot)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:14px 18px;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:1rem;width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--hot-soft);color:var(--hot)}
.btn.sm{padding:9px 14px;font-size:.9rem;width:auto;border-radius:12px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.gap{height:12px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 14px;font-size:.92rem;font-weight:500;color:var(--ink-2)}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 6px;font-size:.88rem;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.badge{display:inline-flex;align-items:center;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted)}
.badge.hot{background:var(--hot-soft);color:var(--hot)}
.badge.acc{background:var(--accent-soft);color:var(--accent)}
.prog{height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;border-radius:6px;background:var(--accent);transition:width .3s}
.check{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:flex;align-items:center;justify-content:center;color:transparent;background:none;padding:0}
.check.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.done-t{text-decoration:line-through;color:var(--muted)}
.empty{text-align:center;padding:40px 20px;color:var(--muted)}

/* Formular */
.field{margin-top:16px}
.field>label{display:block;font-size:.8rem;font-weight:600;color:var(--muted);margin:0 2px 6px;text-transform:uppercase;letter-spacing:.04em}
.inp{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:14px;font-size:16px;outline:none;-webkit-appearance:none;appearance:none;min-height:50px}
.inp:focus{border-color:var(--accent)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-height:50px}
.stepper button{width:52px;height:50px;border:0;background:none;font-size:1.4rem;color:var(--accent)}
.stepper b{flex:1;text-align:center;font-size:1.05rem}
.toggle{width:51px;height:31px;border-radius:999px;background:var(--surface-2);position:relative;border:0;flex:none;transition:background .2s}
.toggle::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .2s}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(20px)}
.sug{margin-top:8px}
.steps{display:flex;gap:6px;margin:6px 0 20px}
.steps i{flex:1;height:4px;border-radius:4px;background:var(--surface-2)}
.steps i.on{background:var(--accent)}

/* Hero */
.hero{border-radius:26px;padding:20px;color:#fff;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.12)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.08)}
.hero .k{font-size:.78rem;font-weight:600;text-transform:uppercase;letter-spacing:.08em;opacity:.75}
.hero .big{font-size:2.6rem;font-weight:700;letter-spacing:-.03em;line-height:1.05;margin-top:6px}
.hero .meta{margin-top:10px;font-size:.92rem;opacity:.85}
.hero .glass{background:rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;margin-top:16px;position:relative;z-index:1}
.trip-card{border-radius:22px;padding:18px;color:#fff;display:block;width:100%;border:0;text-align:left;position:relative;overflow:hidden}
.trip-card+.trip-card{margin-top:12px}
.trip-card .d{font-size:1.5rem;font-weight:700;letter-spacing:-.02em}

/* Plan */
.days{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 6px;margin:0 -16px;scrollbar-width:none;overscroll-behavior-x:contain}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:8px 0;width:60px;text-align:center}
.day .w{font-size:.72rem;font-weight:600;color:var(--muted);text-transform:uppercase}
.day .n{font-size:1.25rem;font-weight:700}
.day.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.day.on .w{color:inherit;opacity:.7}
.tl{position:relative;padding-left:0}
.ev{display:flex;gap:12px;position:relative}
.ev .t{width:46px;flex:none;text-align:right;font-weight:600;font-size:.9rem;padding-top:15px}
.ev .rail{width:14px;flex:none;position:relative;display:flex;justify-content:center}
.ev .rail::before{content:"";position:absolute;top:0;bottom:0;width:2px;background:var(--line)}
.ev:first-child .rail::before{top:20px}
.ev:last-child .rail::before{bottom:calc(100% - 22px)}
.ev .dot{width:12px;height:12px;border-radius:50%;background:var(--surface);border:3px solid var(--accent);margin-top:18px;position:relative;z-index:1}
.ev.fx .dot{border-color:var(--hot)}
.ev.dn .dot{background:var(--accent)}
.ev .body{flex:1;min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 12px 12px 14px;margin:6px 0;display:flex;gap:10px;align-items:flex-start;box-shadow:var(--shadow)}
.ev .body .grow{cursor:pointer}
.ev .ti{font-weight:600;line-height:1.3}
.ev .ds{font-size:.85rem;color:var(--muted);margin-top:3px}
.ev .pin{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}

/* Wetter */
.wx{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px}
.wx::-webkit-scrollbar{display:none}
.wx .d{flex:none;width:72px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 4px;text-align:center}
.wx .e{font-size:1.5rem;line-height:1.4}

/* Tools-Kacheln */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-height:112px}
.tile .v{font-size:.82rem;color:var(--muted);margin-top:auto}
.tile b{font-size:.98rem}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fd .2s}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:calc(100% - var(--safe-t) - 24px);display:flex;flex-direction:column;border-radius:24px 24px 0 0;animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet .sh{display:flex;align-items:center;padding:14px 16px 6px}
.sheet .sh .h2{flex:1}
.sheet .sb{overflow-y:auto;overscroll-behavior:contain;padding:4px 16px calc(var(--safe-b) + 20px)}
.grab{width:38px;height:5px;border-radius:5px;background:var(--line);margin:8px auto 0}
@keyframes up{from{transform:translateY(100%)}}
@keyframes fd{from{opacity:0}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--safe-b) + 84px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-size:.9rem;font-weight:500;z-index:80;max-width:88%;text-align:center;animation:fd .2s}
.loader{position:fixed;inset:0;background:var(--bg);z-index:70;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
.spin{width:34px;height:34px;border:3px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:.95rem}
.kv span:nth-child(odd){color:var(--muted)}
.note{background:var(--hot-soft);color:var(--hot);border-radius:14px;padding:12px 14px;font-size:.9rem}
.info{background:var(--accent-soft);color:var(--accent);border-radius:14px;padding:12px 14px;font-size:.9rem}
.lang-hd{display:flex;align-items:center;gap:12px}
.cell.ph{cursor:pointer}
.ph-n{font-size:1.08rem;font-weight:600;line-height:1.35;margin-top:2px}
.ph-h{font-size:.86rem;color:var(--muted);font-style:italic;margin-top:2px}
.say{width:38px;height:38px;border-radius:50%;border:0;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.show-ov{position:fixed;inset:0;z-index:70;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(var(--safe-t) + 28px) 24px calc(var(--safe-b) + 64px);animation:fd .2s}
.show-ov .de{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:18px}
.show-ov .big{font-size:2.6rem;font-weight:700;line-height:1.2;letter-spacing:-.015em;overflow-wrap:anywhere}
.show-ov .big.long{font-size:1.9rem}
.show-ov .hint{font-size:1.1rem;color:var(--muted);font-style:italic;margin-top:14px}
.show-ov .x{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 22px);font-size:.85rem;color:var(--muted)}
.qty{font-size:.8rem;font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:8px;padding:2px 7px;margin-right:6px}
.hide{display:none!important}
</style>
</head>
<body>
<div id="app"></div>
<script>
'use strict';
/* =========================================================
   Trip Assistant – v0.2 (16.10.2026)
   Komplett eigenständig, keine KI nötig. Daten bleiben lokal.
   Optionale freie Online-Daten: Open-Meteo (Orte, Wetter),
   OpenStreetMap/Overpass (echte Sehenswürdigkeiten),
   Frankfurter (EZB-Wechselkurse).
   ========================================================= */
const APP_VERSION = '0.3.0';
const LS_KEY = 'ta.trips.v1';

const COUNTRIES = {
  GB:{n:'Großbritannien',cur:'GBP',em:'999 oder 112',plug:'G',tip:'10–12,5 % im Restaurant, oft schon als „service charge“ auf der Rechnung. Im Pub kein Trinkgeld am Tresen.',drive:'links'},
  IE:{n:'Irland',cur:'EUR',em:'112 oder 999',plug:'G',tip:'10–15 % im Restaurant, Pub kein Muss.',drive:'links'},

  NL:{n:'Niederlande',cur:'EUR',em:'112',plug:'C/F',tip:'5–10 % oder aufrunden. Viele Läden nur Karte.',drive:'rechts'},
  BE:{n:'Belgien',cur:'EUR',em:'112',plug:'C/E',tip:'Service inklusive, aufrunden ist nett.',drive:'rechts'},
  LU:{n:'Luxemburg',cur:'EUR',em:'112',plug:'C/F',tip:'5–10 %.',drive:'rechts'},
  AT:{n:'Österreich',cur:'EUR',em:'112',plug:'C/F',tip:'5–10 %, beim Bezahlen direkt sagen.',drive:'rechts'},
  CH:{n:'Schweiz',cur:'CHF',em:'112 (Polizei 117, Rettung 144)',plug:'J (C passt)',tip:'Service inklusive, aufrunden.',drive:'rechts'},
  DE:{n:'Deutschland',cur:'EUR',em:'112 (Polizei 110)',plug:'C/F',tip:'5–10 %.',drive:'rechts'},
  DK:{n:'Dänemark',cur:'DKK',em:'112',plug:'K (C passt)',tip:'Service inklusive, Trinkgeld optional.',drive:'rechts'},
  SE:{n:'Schweden',cur:'SEK',em:'112',plug:'C/F',tip:'Optional, 5–10 %. Fast überall nur Karte.',drive:'rechts'},
  NO:{n:'Norwegen',cur:'NOK',em:'112 (Polizei), 113 (Rettung)',plug:'C/F',tip:'Optional, aufrunden.',drive:'rechts'},
  FI:{n:'Finnland',cur:'EUR',em:'112',plug:'C/F',tip:'Nicht erwartet.',drive:'rechts'},
  IS:{n:'Island',cur:'ISK',em:'112',plug:'C/F',tip:'Nicht erwartet.',drive:'rechts'},
  PL:{n:'Polen',cur:'PLN',em:'112',plug:'C/E',tip:'ca. 10 %.',drive:'rechts'},
  CZ:{n:'Tschechien',cur:'CZK',em:'112',plug:'C/E',tip:'ca. 10 %, beim Bezahlen sagen.',drive:'rechts'},
  HU:{n:'Ungarn',cur:'HUF',em:'112',plug:'C/F',tip:'10–15 %, Service-Aufschlag prüfen.',drive:'rechts'},
  HR:{n:'Kroatien',cur:'EUR',em:'112',plug:'C/F',tip:'ca. 10 %.',drive:'rechts'},
  SI:{n:'Slowenien',cur:'EUR',em:'112',plug:'C/F',tip:'5–10 %.',drive:'rechts'},
  SK:{n:'Slowakei',cur:'EUR',em:'112',plug:'C/E',tip:'5–10 %.',drive:'rechts'},
  GR:{n:'Griechenland',cur:'EUR',em:'112',plug:'C/F',tip:'5–10 % oder aufrunden.',drive:'rechts'},
  CY:{n:'Zypern',cur:'EUR',em:'112',plug:'G',tip:'ca. 10 %.',drive:'links'},
  MT:{n:'Malta',cur:'EUR',em:'112',plug:'G',tip:'5–10 %.',drive:'links'},
  RO:{n:'Rumänien',cur:'RON',em:'112',plug:'C/F',tip:'ca. 10 %.',drive:'rechts'},
  BG:{n:'Bulgarien',cur:'EUR',em:'112',plug:'C/F',tip:'ca. 10 %.',drive:'rechts'},
  EE:{n:'Estland',cur:'EUR',em:'112',plug:'C/F',tip:'Optional, 5–10 %.',drive:'rechts'},
  LV:{n:'Lettland',cur:'EUR',em:'112',plug:'C/F',tip:'Optional, 5–10 %.',drive:'rechts'},
  LT:{n:'Litauen',cur:'EUR',em:'112',plug:'C/F',tip:'Optional, 5–10 %.',drive:'rechts'},
  TR:{n:'Türkei',cur:'TRY',em:'112',plug:'C/F',tip:'5–10 %.',drive:'rechts'},
  US:{n:'USA',cur:'USD',em:'911',plug:'A/B (110 V)',tip:'18–20 % im Restaurant sind Pflicht-Kultur, 1–2 $ pro Drink.',drive:'rechts'},
  CA:{n:'Kanada',cur:'CAD',em:'911',plug:'A/B (110 V)',tip:'15–20 %.',drive:'rechts'},
  MX:{n:'Mexiko',cur:'MXN',em:'911',plug:'A/B (127 V)',tip:'10–15 %.',drive:'rechts'},
  AE:{n:'Vereinigte Arabische Emirate',cur:'AED',em:'999 (Polizei), 998 (Rettung)',plug:'G',tip:'10–15 %, Service-Charge prüfen.',drive:'rechts'},
  EG:{n:'Ägypten',cur:'EGP',em:'122 (Polizei), 123 (Rettung)',plug:'C/F',tip:'10–15 %, kleines Bakschisch üblich.',drive:'rechts'},

const SPEECH_CC = {en:{US:'en-US',AU:'en-AU',IE:'en-IE',IN:'en-IN',ZA:'en-ZA',NZ:'en-NZ',CA:'en-CA'},fr:{CA:'fr-CA',BE:'fr-BE',CH:'fr-CH'},nl:{BE:'nl-BE'},it:{CH:'it-CH'},zht:{HK:'zh-HK',MO:'zh-HK'},ar:{EG:'ar-EG',AE:'ar-AE'}};
function tripLangs(t){
  const cc = t.dest?.cc || '', where = `${t.dest?.region||''} ${t.dest?.name||''}`;
  const r = LANG_REGIONS.find(([c, re]) => c === cc && re.test(where));
  const parts = (r ? r[2] : LANG_BY_CC[cc] || 'en').split(',');
  const miss = parts[0][0] === '*' ? parts.shift().slice(1) : null;
  const list = parts.filter(l => LANGS[l]);
  return {miss, list: list.length ? list : ['en'], cc};
}
function langState(t){
  const s = tripLangs(t);
  s.cur = t.lang && LANGS[t.lang] ? t.lang : s.list[0];
  return s;
}
function speechTag(l, cc){
  if (SPEECH_CC[l]?.[cc]) return SPEECH_CC[l][cc];
  if (l === 'es' && /^(MX|GT|BZ|HN|SV|NI|CR|PA|CU|DO|PR|CO|VE|EC|PE|BO|CL|AR|UY|PY|US)$/.test(cc)) return 'es-MX';
  return LANGS[l].tag;
}
function speak(text, tag){
  if (!('speechSynthesis' in window)) return;
  const s = speechSynthesis, vs = s.getVoices(), low = tag.toLowerCase(), base = low.split('-')[0];
  const norm = v => v.lang.replace('_', '-').toLowerCase();
  const v = vs.find(x => norm(x) === low) || vs.find(x => norm(x).split('-')[0] === base);
  if (vs.length && !v) return toast('Für diese Sprache ist auf deinem Gerät keine Stimme installiert.');
  s.cancel();
  const u = new SpeechSynthesisUtterance(text.replace(/\s*\/\s*/g, ', ').replace(/…/g, ''));
  u.lang = v ? v.lang : tag; if (v) u.voice = v; u.rate = .9;
  s.speak(u);
}
function showPhrase(it, tag, say){
  const d = document.createElement('div'); d.className = 'show-ov';
  d.innerHTML = `<div class="de">${esc(it.de)}</div><div class="big ${it.nat.length > 26 ? 'long' : ''}" dir="auto">${esc(it.nat)}</div>${it.hint ? `<div class="hint">${esc(it.hint)}</div>` : ''}${say ? `<button class="btn ghost" data-say style="width:auto;margin-top:28px;padding:12px 22px">${I('vol','sm')}Anhören</button>` : ''}<div class="x">Antippen zum Schließen</div>`;
  d.onclick = e => { if (e.target.closest('[data-say]')) return speak(it.nat, tag); d.remove(); };
  document.body.appendChild(d);
}

const isoDate = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parseD = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addDays = (s, n) => { const d = parseD(s); d.setDate(d.getDate()+n); return isoDate(d); };
const daysBetween = (a, b) => Math.round((parseD(b) - parseD(a)) / 864e5);
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'];
const fmtDay = s => { const d = parseD(s); return `${WD[d.getDay()]}, ${d.getDate()}.${d.getMonth()+1}.`; };
const fmtShort = s => { const d = parseD(s); return `${d.getDate()}.${d.getMonth()+1}.`; };
const fmtLong = s => parseD(s).toLocaleDateString('de-DE', {weekday:'long', day:'numeric', month:'long'});
const toMin = t => { if (!t) return null; const [h,m] = t.split(':').map(Number); return h*60+(m||0); };
const toT = m => { m = Math.max(0, Math.min(23*60+59, Math.round(m))); return `${pad(Math.floor(m/60))}:${pad(m%60)}`; };
const mapsQ = q => 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
const mapsDir = q => 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(q);
const todayIso = () => isoDate(new Date());
const slug = s => s.toLowerCase().replace(/[^a-z0-9äöüß]+/g, '-').slice(0, 40);
const fmtMoney = (v, c) => { try { return new Intl.NumberFormat('de-DE', {style:'currency', currency:c, maximumFractionDigits: Math.abs(v) >= 1000 ? 0 : 2}).format(v); } catch { return v.toFixed(2)+' '+c; } };
const WMO = c => c==null?'·':c===0?'☀️':c<=2?'🌤️':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'🌨️':c<=82?'🌧️':c<=86?'🌨️':'⛈️';
const hueOf = s => { let h = 0; for (const ch of (s||'x')) h = (h*31 + ch.charCodeAt(0)) % 360; return h; };
const grad = s => { const h = hueOf(s); return `background:linear-gradient(135deg,hsl(${h},42%,22%),hsl(${(h+35)%360},48%,36%))`; };

function migrate(t){
  if (t.v === 2) return t;
  const n = {...blankTrip(), ...t, v:2};
  const oldDone = new Set([...(t.checks?.prep||[]), ...(t.checks?.pack||[])].filter(x=>x.done).map(x=>x.t));
  n.prepDone = {}; prepList(n).forEach(x => { if (oldDone.has(x.t)) n.prepDone[x.key] = true; });
  n.todos = (t.checks?.custom || []).map(x => ({id:x.id||uid(), t:x.t, done:!!x.done}));
  if (t.weather?.days?.length) n.weather = {...t.weather, kind:'forecast'};
  delete n.checks; delete n.chat; delete n.tips; delete n.notes; delete n.destQ;

}

/* =========================================================
   Logik: Plan, Tipps, Packliste, Vorbereitung
   ========================================================= */
const tripDays = t => { const n = Math.max(0, daysBetween(t.start, t.end)); return Array.from({length:n+1}, (_,i) => addDays(t.start, i)); };
const cinfo = t => COUNTRIES[t.dest?.cc] || null;

function generatePlan(t){
  const days = tripDays(t), city = t.dest?.name || '';
  const interests = t.interests.length ? t.interests : ['kultur','food','foto'];
  const used = new Set();
  const realPlace = cat => {
    const p = (t.places||[]).find(x => x.cat === cat && !used.has(x.name));
    if (!p) return null; used.add(p.name);
    return {t:p.name, d:PLACE_DESC[cat] || '', map:mapsQ(p.name + (city?', '+city:'')), real:true};
  };
  const pool = [...(TYPE_IDEAS[t.type]||[]).map(x => ({...x, cat:t.type})), ...interests.flatMap(k => (IDEAS[k]||[]).map(x => ({...x, cat:k})))];
  let pi = 0;
  const nextIdea = () => {
    if (!pool.length) return null;
    const base = pool[(pi++) % pool.length];
    const real = PLACE_DESC[base.cat] && base.cat !== 'food' ? realPlace(base.cat) : null;
    return real || {...base, map: mapsQ(base.q + ' ' + city)};
  };
  const stay = t.stay?.addr || t.stay?.name || '';
  const out = [];
  days.forEach((date, idx) => {
    const items = [];
    const add = (time, title, desc = '', extra = {}) => items.push({id:uid(), time, title, desc, done:false, ...extra});
    const first = idx === 0, last = idx === days.length - 1;
    let dayStart = 9*60, dayEnd = 22*60;
    const fixed = (t.fixed||[]).filter(f => f.date === date);
    const dep = toMin(t.depTime), arr = toMin(t.arrTime), back = toMin(t.retTime);
    if (first){
      if (t.mode === 'flug'){
        if (dep != null){ add(toT(dep-150), 'Los zum Flughafen', 'Rund 2 Stunden vor Abflug dort sein: Gepäckabgabe und Sicherheitskontrolle.', {kind:'reise'}); add(toT(dep), 'Abflug'+(t.outbound?' · '+t.outbound:''), 'Bordkarte im Wallet, Ausweis griffbereit.', {fixed:true}); }
        if (arr != null) add(toT(arr), 'Landung'+(city?' in '+city:''), 'Ortszeit. Mobile Daten oder eSIM einschalten, dann Transfer in die Stadt.', {fixed:true});
      } else if (t.mode === 'zug' || t.mode === 'bus'){
        if (dep != null){ add(toT(dep-30), t.mode==='zug' ? 'Zum Bahnhof' : 'Zum Busbahnhof', 'Gleis bzw. Steig kurz vorher in der App prüfen.', {kind:'reise'}); add(toT(dep), 'Abfahrt'+(t.outbound?' · '+t.outbound:''), '', {fixed:true}); }
        if (arr != null) add(toT(arr), 'Ankunft'+(city?' in '+city:''), '', {fixed:true});
      } else if (t.mode === 'auto'){
        if (dep != null) add(toT(dep), 'Abfahrt mit dem Auto', 'Tanken, Vignette oder Maut prüfen, Route offline speichern.', {fixed:true});
        if (arr != null) add(toT(arr), 'Ankunft und Parkplatz', '', {fixed:true});
      }
      const a = arr != null ? arr : (dep != null ? dep + 180 : 12*60);
      if (stay) add(toT(a + (t.mode==='flug' ? 75 : 40)), 'Unterkunft: Check-in oder Gepäck abgeben', stay, {map:mapsDir(stay)});
      dayStart = a + (t.mode==='flug' ? 135 : 90);
    }
    if (last && days.length > 1){
      if (stay) add('10:30', 'Check-out', 'Gepäck bei Bedarf an der Rezeption lassen.');
      if (back != null){
        const lead = t.mode === 'flug' ? 180 : t.mode === 'auto' ? 15 : 45;
        add(toT(back-lead), t.mode==='flug' ? 'Los zum Flughafen' : t.mode==='auto' ? 'Gepäck ins Auto' : 'Zum Bahnhof', t.mode==='flug' ? 'Transferzeit plus 2 Stunden Puffer am Flughafen.' : '');
        add(toT(back), 'Rückreise'+(t.inbound?' · '+t.inbound:''), '', {fixed:true});
        dayEnd = back - lead - 30;
      } else dayEnd = 16*60;
    } else if (first && days.length === 1 && back != null){
      add(toT(back - (t.mode==='flug'?180:45)), 'Rückweg starten'); add(toT(back), 'Rückreise'+(t.inbound?' · '+t.inbound:''), '', {fixed:true}); dayEnd = back - 210;
    }
    const busy = [];
    fixed.forEach(f => {
      const m = toMin(f.time);
      if (m != null){ add(toT(m-60), 'Aufbruch: '+f.title, f.place ? 'Anfahrt mit 15 Minuten Puffer.' : '', {map: f.place ? mapsDir(f.place) : null}); busy.push([m-60, m + (f.dur ? +f.dur*60 : 180)]); }
      add(f.time || '', f.title, f.place || '', {fixed:true, map: f.place ? mapsQ(f.place) : null});
    });
    const free = (s, e) => s >= dayStart && e <= dayEnd && !busy.some(([a,b]) => s < b && e > a);
    const slots = t.type === 'business'
      ? [[19*60, 21*60, 'abend']]
      : [[10*60, 12*60, 'vorm'], [12*60+30, 13*60+30, 'mittag'], [14*60, 17*60, 'nachm'], [17*60+30, 19*60, 'golden'], [19*60+30, 21*60+30, 'abend']];
    slots.forEach(([s, e, kind]) => {
      if (!free(s, e)) return;
      let idea;
      const city2 = ' ' + city;
      if (kind === 'mittag'){ const b = idx % 2 ? IDEAS.food[2] : IDEAS.food[0]; idea = (idx % 2 === 0 && realPlace('food')) || {...b, map:mapsQ(b.q+city2)}; }
      else if (kind === 'abend'){ const b = (t.interests.includes('nightlife') && idx % 2) ? IDEAS.nightlife[1] : IDEAS.food[1]; idea = {...b, map:mapsQ(b.q+city2)}; }
      else if (kind === 'golden'){ if (t.interests.includes('foto')) idea = realPlace('foto') || {...IDEAS.foto[0], map:mapsQ('viewpoint'+city2)}; else if (t.interests.includes('nightlife')) idea = {...IDEAS.nightlife[0], map:mapsQ('rooftop bar'+city2)}; }
      else idea = nextIdea();
      if (!idea) return;
      add(toT(s), idea.t, idea.d, {map: idea.map, real: !!idea.real});
    });
    items.sort((a,b) => (toMin(a.time) ?? 9999) - (toMin(b.time) ?? 9999));
    let title = first ? 'Anreise' : (last && days.length>1) ? 'Abreise' : `Tag ${idx+1}`;
    if (fixed.length) title += ' · ' + fixed.map(f=>f.title).join(', ');
    out.push({date, title, items});
  });
  return {days: out, created: Date.now()};
}

function generateTips(t){
  const c = cinfo(t), tips = [];
  const T = (title, text) => tips.push({title, text});
  if (c){
    T('Bezahlen', c.cur !== 'EUR' ? `Landeswährung ${c.cur}. Am besten Kreditkarte ohne Auslandsgebühr, am Terminal immer in ${c.cur} zahlen und die Umrechnung in Euro ablehnen.` : 'Euro-Land, Karte geht fast überall. Etwas Bargeld für Kleinigkeiten.');
    T('Strom', PLUG_OK(c.plug) ? `Steckertyp ${c.plug}: deutsche Stecker passen in der Regel.` : `Steckertyp ${c.plug}: Reiseadapter einpacken.`);
    T('Trinkgeld', c.tip);
    if (c.drive === 'links') T('Linksverkehr', 'Beim Überqueren zuerst nach rechts schauen.');
    if (!/^(DE|AT|BE|BG|CY|CZ|DK|EE|ES|FI|FR|GR|HR|HU|IE|IT|LT|LU|LV|MT|NL|PL|PT|RO|SE|SI|SK|IS|NO|LI)$/.test(t.dest.cc))
      T('Mobile Daten', 'Außerhalb der EU gilt kein EU-Roaming. Eine eSIM vorher installieren und erst vor Ort aktivieren.');
    if (t.dest.cc === 'GB') T('Einreise UK', 'Für Deutsche ist eine ETA nötig (UK-ETA-App). In Bus und U-Bahn einfach kontaktlos mit der Karte zahlen.');
    if (t.dest.cc === 'US') T('Einreise USA', 'ESTA rechtzeitig vor Abflug beantragen, nur über die offizielle Seite.');
  }
  T('Offline-Karte', `In Google Maps das Gebiet „${t.dest?.name||'Zielort'}“ herunterladen. Spart Daten und hilft ohne Netz.`);
  if (t.mode === 'flug') T('Flug', `Online-Check-in öffnet meist 24–48 Stunden vorher.${t.carryOn ? ' Nur Handgepäck: Flüssigkeiten bis 100 ml in einen 1-Liter-Beutel, Powerbank ins Handgepäck.' : ''}`);
  if (t.mode === 'zug') T('Bahn', 'Am Freitag und Sonntag lohnt sich eine Reservierung. Ab 60 Minuten Verspätung gibt es Geld zurück.');
  if (t.mode === 'auto') T('Auto', 'Vignette, Maut und Umweltzonen prüfen. Warnweste und Verbandskasten sind in vielen Ländern Pflicht.');
  if (t.type === 'event') T('Event', 'Ticket als Wallet-Pass und Screenshot speichern. Taschenregeln des Veranstalters prüfen und Gepäck vorher in der Unterkunft lassen.');
  if (t.type === 'business') T('Geschäftsreise', 'Belege direkt in den Ausgaben erfassen und fotografieren.');
  if (t.type === 'strand') T('Strand', 'Wertsachen nicht unbeaufsichtigt lassen. Sonnencreme ist vor Ort oft teurer.');
  if (t.type === 'wandern') T('Wandern', 'Route und Wetter am Vorabend prüfen und jemandem Bescheid geben.');
  if (t.budget === 'low') T('Sparen', 'Mittagsmenüs sind günstiger als Abendessen, Tageskarten für den Nahverkehr nutzen.');
  if (t.budget === 'high') T('Komfort', 'Top-Restaurants und Rooftops 1–2 Wochen vorher reservieren, Fast-Track-Tickets buchen.');
  if (t.people > 1) T('Gruppe', 'Ausgaben mit „Wer hat bezahlt“ erfassen, die App rechnet aus, wer wem was schuldet.');
  return tips;
}

/* ----- Temperaturen für die Packliste ----- */
function climateOf(t){
  if (t.climate){ const c = CLIMATES.find(x => x[0] === t.climate); if (c) return {tmin:c[2], tmax:c[3], rain:false, src:'manuell', days:null}; }
  const d = t.weather?.days?.filter(x => x.date >= t.start && x.date <= t.end);
  if (d?.length){
    return {tmin:Math.min(...d.map(x=>x.tmin)), tmax:Math.max(...d.map(x=>x.tmax)), tdayMin:Math.min(...d.map(x=>x.tmax)), rain:d.some(x=>x.rain>=40), src: t.weather.kind === 'history' ? 'Vorjahr' : 'Vorhersage', days:d};
  }
  return null;
}
const band = v => v < 0 ? 'frost' : v < 8 ? 'kalt' : v < 15 ? 'kuehl' : v < 21 ? 'mild' : v < 27 ? 'warm' : 'heiss';

function packList(t){
  const n = tripDays(t).length, nights = Math.max(0, n-1), cl = climateOf(t), c = cinfo(t);
  const L = [];
  const A = (cat, name, qty = '', note = '') => L.push({key: cat + ':' + slug(name), cat, t:name, qty, note});
  const tmax = cl ? cl.tmax : 18, tmin = cl ? cl.tmin : 8, tday = cl ? (cl.tdayMin ?? cl.tmax) : 16;
  const k = Math.min(n, 7);
  const bandDay = band(tday), bandNight = band(tmin);
  // Dokumente & Geld
  A('Dokumente & Geld', c && !['DE','AT','CH','NL','BE','LU','FR','IT','ES','PT','PL','CZ','DK','SE','NO','FI','IS','HU','HR','SI','SK','GR','RO','BG','EE','LV','LT','IE','MT','CY'].includes(t.dest?.cc) ? 'Reisepass (noch 6 Monate gültig)' : 'Personalausweis oder Reisepass');
  if (t.mode === 'flug') A('Dokumente & Geld', 'Bordkarten (Wallet + Screenshot)');
  if (t.mode === 'zug' || t.mode === 'bus') A('Dokumente & Geld', 'Tickets (App + Screenshot)');
  if (t.mode === 'auto') A('Dokumente & Geld', 'Führerschein + Fahrzeugschein');
  A('Dokumente & Geld', 'Kreditkarte ohne Auslandsgebühr + Debitkarte', '', 'Getrennt aufbewahren');
  A('Dokumente & Geld', 'Krankenversicherungskarte');
  if (c && c.cur !== 'EUR') A('Dokumente & Geld', `Etwas Bargeld in ${c.cur}`, '', 'Für Trinkgeld und Kleinigkeiten');
  (t.fixed||[]).forEach(f => A('Dokumente & Geld', `Ticket: ${f.title}`));

  // Kleidung nach Temperatur
  const K = 'Kleidung';
  A(K, 'Unterhosen', `${n+1}×`);
  if (bandDay === 'warm' || bandDay === 'heiss') A(K, 'Sneakersocken', `${n+1}×`);

async function geocode(q){
  const r = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=6&language=de&format=json&name=' + encodeURIComponent(q));
  if (!r.ok) throw new Error('offline');
  const j = await r.json();
  return (j.results||[]).map(x => ({name:x.name, country:x.country, cc:x.country_code, region:x.admin1||'', lat:x.latitude, lon:x.longitude, tz:x.timezone}));
}
async function fetchWeather(t){
  if (t.dest?.lat == null) return null;
  const today = todayIso(), lastAvail = addDays(today, 15);
  const daily = 'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset';
  if (t.start <= lastAvail && t.end >= today){
    const s = t.start < today ? today : t.start, e = t.end > lastAvail ? lastAvail : t.end;
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${t.dest.lat}&longitude=${t.dest.lon}&daily=${daily}&timezone=auto&start_date=${s}&end_date=${e}`);
    if (!r.ok) throw new Error('offline');
    const d = (await r.json()).daily;
    return {kind:'forecast', fetched:Date.now(), days:d.time.map((date,i) => ({date, code:d.weather_code[i], tmax:Math.round(d.temperature_2m_max[i]), tmin:Math.round(d.temperature_2m_min[i]), rain:d.precipitation_probability_max[i] ?? 0, sunset:(d.sunset[i]||'').slice(11)}))};
  }
  if (t.end < today) return t.weather || null;
  // Zu weit weg für eine Vorhersage: Werte vom Vorjahr als Richtwert
  const ly = s => { const d = parseD(s); d.setFullYear(d.getFullYear()-1); return isoDate(d); };
  const r = await fetch(`https://archive-api.open-meteo.com/v1/archive?latitude=${t.dest.lat}&longitude=${t.dest.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum&timezone=auto&start_date=${ly(t.start)}&end_date=${ly(t.end)}`);
  if (!r.ok) throw new Error('offline');
  const d = (await r.json()).daily;
  return {kind:'history', fetched:Date.now(), days:d.time.map((date,i) => ({date:addDays(t.start, i), code:d.weather_code[i], tmax:Math.round(d.temperature_2m_max[i]), tmin:Math.round(d.temperature_2m_min[i]), rain:(d.precipitation_sum[i]||0) >= 1 ? 60 : 10}))};
}
// Echte Sehenswürdigkeiten aus OpenStreetMap
async function fetchPlaces(t){
  if (t.dest?.lat == null) return [];
  const {lat, lon} = t.dest, A = r => `(around:${r},${lat},${lon})`;
  const q = `[out:json][timeout:15];(
    nwr${A(3000)}["tourism"~"^(attraction|museum|viewpoint|gallery|zoo|aquarium)$"]["name"];
    nwr${A(3000)}["historic"~"^(monument|castle|palace|memorial|ruins)$"]["name"]["wikidata"];
    nwr${A(3500)}["leisure"="park"]["name"]["wikidata"];
    nwr${A(3000)}["amenity"="marketplace"]["name"];
  );out tags center 120;`;
  const r = await withTimeout(fetch('https://overpass-api.de/api/interpreter', {method:'POST', body:'data=' + encodeURIComponent(q), headers:{'Content-Type':'application/x-www-form-urlencoded'}}), 12000);
  if (!r.ok) throw new Error('overpass');
  const els = (await r.json()).elements || [];
  const seen = new Set(), out = [];
  els.forEach(e => {
    const g = e.tags || {}, name = g['name:de'] || g.name; if (!name || seen.has(name)) return; seen.add(name);
    let cat = null;
    if (g.tourism === 'museum' || g.tourism === 'gallery') cat = 'museen';
    else if (g.tourism === 'viewpoint') cat = 'foto';
    else if (g.tourism === 'zoo' || g.tourism === 'aquarium') cat = 'familie';
    else if (g.leisure === 'park') cat = 'natur';
    else if (g.amenity === 'marketplace') cat = 'food';
    else cat = 'kultur';
    const score = (g.wikidata ? 3 : 0) + (g.wikipedia ? 2 : 0) + (g.website ? 1 : 0) + (g.tourism === 'attraction' ? 1 : 0);
    out.push({name, cat, score});
  });
  return out.sort((a,b) => b.score - a.score).slice(0, 60);
}
let fx = null;
async function loadFx(){
  try { fx = JSON.parse(localStorage.getItem('ta.fx')); } catch {}
  if (fx?.live && Date.now() - fx.at < 6*3600e3) return fx;
  try {
    const r = await withTimeout(fetch('https://api.frankfurter.dev/v1/latest?base=EUR'), 8000);
    if (r.ok){ const j = await r.json(); fx = {at:Date.now(), date:j.date, rates:{EUR:1, ...j.rates}, live:true}; localStorage.setItem('ta.fx', JSON.stringify(fx)); }
  } catch {}
  if (!fx) fx = {at:0, rates:FX_FALLBACK, live:false};
  return fx;
}
const rate = cur => (fx?.rates?.[cur]) ?? FX_FALLBACK[cur] ?? null;
async function refreshWeather(t, quiet = true){
  try {
    const w = await withTimeout(fetchWeather(t), 10000); if (!w) return;
    t.weather = w; save();
    if (state.view === 'trip' && state.tripId === t.id) render();
  } catch { if (!quiet) toast('Wetter ist gerade nicht erreichbar'); }
}

    <div class="field"><label>Rückreise${w.mode==='auto'?'':' · Verbindung (optional)'}</label>${w.mode==='auto'?'':`<input class="inp" id="w-in" placeholder="${w.mode==='flug'?'z. B. EW9467':'z. B. ICE 456'}" value="${esc(w.inbound)}" style="margin-bottom:10px">`}
      <div class="two"><input class="inp" type="time" id="w-ret" value="${w.retTime}" aria-label="Abfahrt zurück"><span></span></div>
      <div class="xs muted" style="margin-top:4px;padding:0 4px">Abfahrt zurück</div></div>
    ${w.mode==='flug' ? `<div class="group" style="margin-top:18px"><div class="cell"><div class="grow"><b>Nur Handgepäck</b><div class="sub">Packliste achtet auf 100-ml-Regel</div></div><button class="toggle ${w.carryOn?'on':''}" data-toggle="carryOn" aria-label="Nur Handgepäck"></button></div></div>` : ''}`;
  if (s === 2) body = `
    <div class="field"><label>Unterkunft</label><input class="inp" id="w-stay" placeholder="Name (z. B. Hotel Arts)" value="${esc(w.stay.name)}"></div>
    <input class="inp" id="w-addr" placeholder="Adresse" value="${esc(w.stay.addr)}" style="margin-top:10px">
    ${sec('Feste Termine', 'Spiel, Konzert, Meeting')}
    ${w.fixed.length ? `<div class="group">${w.fixed.map((f,i) => `<div class="cell"><div class="ic hot">${I('clock','sm')}</div><div class="grow"><b>${esc(f.title)}</b><div class="sub">${fmtDay(f.date)}${f.time?' · '+esc(f.time):''}${f.place?' · '+esc(f.place):''}</div></div><button class="tbtn" data-delfix="${i}" aria-label="Entfernen">${I('x','sm')}</button></div>`).join('')}</div><div class="gap"></div>` : ''}
    <div class="card">
      <input class="inp" id="f-title" placeholder="Was? (z. B. NFL-Spiel)">
      <div class="two" style="margin-top:10px"><select class="inp" id="f-date">${tripDays(w).map(d=>`<option value="${d}">${fmtDay(d)}</option>`).join('')}</select><input class="inp" type="time" id="f-time" aria-label="Uhrzeit"></div>
      <div class="two" style="margin-top:10px"><input class="inp" id="f-place" placeholder="Ort"><input class="inp" type="number" inputmode="decimal" min="0.5" step="0.5" id="f-dur" placeholder="Dauer (Std.)"></div>
      <button class="btn ghost" style="margin-top:12px" data-act="addfix">${I('plus','sm')}Termin hinzufügen</button>
    </div>`;
  if (s === 3) body = `
    <div class="field"><label>Art der Reise</label>${chips(TYPES,'type')}</div>
    <div class="field"><label>Interessen</label>${chips(INTERESTS,'interests',true)}</div>
    <div class="field"><label>Budget</label>${seg(BUDGETS,'budget')}</div>`;
  return `<div class="steps">${WSTEPS.map((_,i)=>`<i class="${i<=s?'on':''}"></i>`).join('')}</div>
    <div class="lt" style="font-size:1.65rem">${WSTEPS[s]}</div>${body}
    <div class="row" style="margin-top:26px">${s>0?`<button class="btn ghost" style="width:auto;padding:14px 18px" data-act="wback">${I('left','sm')}</button>`:''}
      <button class="btn" data-act="wnext">${s===WSTEPS.length-1 ? (state.editing?'Speichern':'Reise erstellen') : 'Weiter'}</button></div>`;
}
function readWizard(){
  const w = state.wiz, v = id => $('#'+id)?.value;
  if ($('#w-dest')){ const q = v('w-dest').trim(); if (!w.dest || q !== w.dest.name){ w.destQ = q; if (w.dest && q !== w.dest.name) w.dest = null; } }
  if ($('#w-start')){ w.start = v('w-start') || w.start; w.end = v('w-end') || w.end; if (w.end < w.start) w.end = w.start; }
  if ($('#w-dep')){ w.outbound = (v('w-out')||'').trim(); w.depTime = v('w-dep'); w.arrTime = v('w-arr'); w.inbound = (v('w-in')||'').trim(); w.retTime = v('w-ret'); }
  if ($('#w-stay')){ w.stay = {name:v('w-stay').trim(), addr:v('w-addr').trim()}; }
}
let sugTimer = null;
function bindWizard(){
  const inp = $('#w-dest'); if (!inp) return;
  inp.addEventListener('input', () => {
    clearTimeout(sugTimer); const q = inp.value.trim();
    if (q.length < 2){ $('#w-sug').innerHTML = ''; return; }
    sugTimer = setTimeout(async () => {
      try {
        const res = await geocode(q); state._sug = res;
        $('#w-sug').innerHTML = res.length ? `<div class="group">${res.map((r,i)=>`<button class="cell" data-sug="${i}"><div class="ic">${I('pin','sm')}</div><div class="grow"><b>${esc(r.name)}</b><div class="sub">${esc([r.region,r.country].filter(Boolean).join(', '))}</div></div></button>`).join('')}</div>` : '';
      } catch { $('#w-sug').innerHTML = '<div class="small muted" style="padding:6px 4px">Offline: Das Ziel wird ohne Wetter gespeichert.</div>'; }
    }, 280);
  });
}
async function finishWizard(){
  const w = state.wiz;
  if (!w.dest && w.destQ) w.dest = {name:w.destQ, country:'', cc:'', lat:null, lon:null, tz:null};
  if (!w.dest){ state.wizStep = 0; render(true); return toast('Bitte ein Reiseziel eingeben.'); }
  const old = getTrip(w.id);
  const loader = document.createElement('div'); loader.className = 'loader';
  loader.innerHTML = `<div class="spin"></div><div><b>Plane ${esc(w.dest.name)} …</b><div class="small muted" style="margin-top:4px">Sehenswürdigkeiten, Wetter und Packliste</div></div>`;
  document.body.appendChild(loader);
  const placesChanged = !old || old.dest?.name !== w.dest.name;
  await Promise.all([
    placesChanged || !w.places?.length ? fetchPlaces(w).then(p => { w.places = p; }).catch(() => { w.places = w.places || []; }) : null,
    fetchWeather(w).then(x => { if (x) w.weather = x; }).catch(() => {})
  ]);
  w.plan = generatePlan(w);
  delete w.destQ;
  if (old) trips[trips.indexOf(old)] = w; else trips.push(w);
  save(); loader.remove(); state.editing = false;
  go('trip', {tripId:w.id, tab:'plan', day:w.start});
  toast(old ? 'Gespeichert, Plan aktualisiert' : 'Deine Reise ist fertig geplant');
}

/* ---------- Heute ---------- */
function viewToday(t){
  const today = todayIso(), dd = daysBetween(today, t.start), c = cinfo(t), n = tripDays(t).length;
  const during = today >= t.start && today <= t.end;
  const dayIdx = daysBetween(t.start, today);
  const day = t.plan?.days.find(d => d.date === (during ? today : t.start));
  let next = null;
  if (day){
    const nowM = new Date().getHours()*60 + new Date().getMinutes();
    next = during ? day.items.find(i => !i.done && (toMin(i.time) ?? 0) >= nowM - 20) : day.items[0];
  }
  const hk = t.end < today ? 'Reise beendet' : during ? `Tag ${dayIdx+1} von ${n}` : 'Abreise';
  const hb = t.end < today ? esc(t.dest?.name||'') : during ? 'Heute' : dd === 0 ? 'Heute' : dd === 1 ? 'Morgen' : `in ${dd} Tagen`;
  const prep = prepList(t), prepDone = prep.filter(x => t.prepDone?.[x.key]).length;
  const pack = packList(t), packDone = pack.filter(x => t.packDone?.[x.key]).length;
  const openPrep = prep.filter(x => !t.prepDone?.[x.key]).sort((a,b)=>(a.due||'').localeCompare(b.due||''));
  const lt = t.dest?.tz ? new Date().toLocaleTimeString('de-DE', {timeZone:t.dest.tz, hour:'2-digit', minute:'2-digit'}) : null;
  const em = c ? c.em.match(/\d+/)[0] : '112';
  return `
  <div class="hero" style="${grad(t.dest?.name)};margin-top:8px">
    <div class="k">${hk}</div><div class="big">${hb}</div>
    <div class="meta">${fmtDay(t.start)} – ${fmtDay(t.end)}${lt ? ' · Ortszeit ' + lt : ''}</div>
    ${next ? `<div class="glass"><div class="xs" style="opacity:.75;font-weight:600;text-transform:uppercase;letter-spacing:.06em">${during ? 'Als Nächstes' : 'Los geht’s mit'}</div>
      <div class="row" style="margin-top:4px"><b class="num">${esc(next.time||'')}</b><span class="grow">${esc(next.title)}</span>${next.map?`<a href="${esc(next.map)}" target="_blank" rel="noopener" style="color:#fff">${I('pin','sm')}</a>`:''}</div></div>` : ''}
  </div>
  <div class="tiles" style="margin-top:12px;grid-template-columns:1fr 1fr 1fr">
    <a class="tile" style="min-height:0;align-items:center;text-align:center;gap:6px;color:var(--ink)" href="tel:${em}"><div class="ic hot">${I('phone','sm')}</div><span class="small"><b>Notruf</b><br><span class="muted">${em}</span></span></a>
    ${t.stay?.addr||t.stay?.name ? `<a class="tile" style="min-height:0;align-items:center;text-align:center;gap:6px;color:var(--ink)" target="_blank" rel="noopener" href="${esc(mapsDir(t.stay.addr||t.stay.name))}"><div class="ic">${I('home','sm')}</div><span class="small"><b>Unterkunft</b><br><span class="muted">Route</span></span></a>` : `<button class="tile" style="min-height:0;align-items:center;text-align:center;gap:6px" data-act="edit"><div class="ic">${I('home','sm')}</div><span class="small"><b>Unterkunft</b><br><span class="muted">eintragen</span></span></button>`}
    <button class="tile" style="min-height:0;align-items:center;text-align:center;gap:6px" data-tool="exp"><div class="ic">${I('wallet','sm')}</div><span class="small"><b>Ausgabe</b><br><span class="muted">erfassen</span></span></button>
  </div>
  ${weatherBlock(t)}
  ${t.end >= today ? `${sec('Bereit?')}
  <div class="group">
    <button class="cell" data-goto="packen:prep"><div class="ic">${I('list','sm')}</div><div class="grow"><b>Vorbereitung</b><div class="sub">${openPrep.length ? 'Als Nächstes: ' + esc(openPrep[0].t) : 'Alles erledigt'}</div><div class="prog" style="margin-top:8px"><i style="width:${prep.length?prepDone/prep.length*100:0}%"></i></div></div><span class="small muted num">${prepDone}/${prep.length}</span></button>
    <button class="cell" data-goto="packen:pack"><div class="ic">${I('bag','sm')}</div><div class="grow"><b>Packliste</b><div class="sub">${pack.length - packDone} Sachen offen</div><div class="prog" style="margin-top:8px"><i style="width:${pack.length?packDone/pack.length*100:0}%"></i></div></div><span class="small muted num">${packDone}/${pack.length}</span></button>
  </div>` : ''}
  ${sec('Tipps für diese Reise')}
  <div class="group">${generateTips(t).map(x => `<div class="cell" style="align-items:flex-start"><div class="ic">${I('bulb','sm')}</div><div class="grow"><b>${esc(x.title)}</b><div class="sub" style="color:var(--ink-2)">${esc(x.text)}</div></div></div>`).join('')}</div>`;
}
function weatherBlock(t){
  if (t.dest?.lat == null) return '';
  const w = t.weather;
  if (!w?.days?.length) return `${sec('Wetter')}<div class="card small muted">Wird geladen, sobald du online bist.</div>`;
  return `${sec('Wetter', w.kind === 'history' ? 'Richtwerte vom Vorjahr' : 'Vorhersage')}
    <div class="wx">${w.days.map(d => `<div class="d"><div class="xs muted" style="font-weight:600">${fmtDay(d.date).split(',')[0]} ${fmtShort(d.date)}</div><div class="e">${WMO(d.code)}</div><b class="num">${d.tmax}°</b> <span class="muted num">${d.tmin}°</span>${w.kind==='forecast'?`<div class="xs muted">${d.rain}% Regen</div>`:''}</div>`).join('')}</div>`;
}

/* ---------- Plan ---------- */
function viewPlan(t){
  const p = t.plan; if (!p) return '<div class="empty">Kein Plan.</div>';
  const sel = p.days.find(d => d.date === state.day) || p.days.find(d => d.date === todayIso()) || p.days[0];
  state.day = sel.date;
  const done = sel.items.filter(i => i.done).length;
  return `
  <div class="days" style="margin-top:8px">${p.days.map(d => { const x = parseD(d.date); return `<button class="day ${d.date===sel.date?'on':''}" data-day="${d.date}"><div class="w">${WD[x.getDay()]}</div><div class="n">${x.getDate()}</div></button>`; }).join('')}</div>
  <div style="margin:18px 2px 8px"><div class="h2">${esc(sel.title)}</div><div class="small muted" style="margin-top:2px">${fmtLong(sel.date)} · ${done}/${sel.items.length} erledigt</div></div>
  <div class="tl">${sel.items.map(i => `
    <div class="ev ${i.fixed?'fx':''} ${i.done?'dn':''}">
      <div class="t num ${i.fixed?'':'muted'}" style="${i.fixed?'color:var(--hot)':''}">${esc(i.time||'')}</div>
      <div class="rail"><div class="dot"></div></div>
      <div class="body">
        <div class="grow" data-edititem="${i.id}"><div class="ti ${i.done?'done-t':''}">${esc(i.title)}</div>${i.desc?`<div class="ds">${esc(i.desc)}</div>`:''}${i.fixed?'<div style="margin-top:6px"><span class="badge hot">Fix</span></div>':''}</div>
        ${i.map?`<a class="pin" href="${esc(i.map)}" target="_blank" rel="noopener" aria-label="Karte">${I('pin','sm')}</a>`:''}
        <button class="check ${i.done?'on':''}" data-done="${i.id}" aria-label="Erledigt">${I('check','sm')}</button>
      </div>
    </div>`).join('') || '<div class="empty">Frei, nichts geplant.</div>'}</div>
  <button class="btn ghost" style="margin-top:14px" data-additem="${sel.date}">${I('plus','sm')}Eintrag hinzufügen</button>
  <p class="xs muted" style="text-align:center;margin-top:16px">Tippe auf einen Eintrag zum Bearbeiten. ${(t.places||[]).length ? 'Orte aus OpenStreetMap.' : ''}</p>`;
}

/* ---------- Packen ---------- */
function viewPack(t){
  const seg = state.packSeg;
  const segs = `<div class="seg" style="margin-top:8px">${[['pack','Packliste'],['outfit','Outfits'],['prep','Vorbereitung']].map(([k,l])=>`<button class="${seg===k?'on':''}" data-seg="${k}">${l}</button>`).join('')}</div>`;
  if (seg === 'prep'){
    const L = prepList(t), done = L.filter(x => t.prepDone?.[x.key]).length;
    return segs + `<div style="margin:18px 2px 10px"><div class="row"><div class="h2 grow">Vor der Abreise</div><span class="small muted num">${done}/${L.length}</span></div><div class="prog" style="margin-top:8px"><i style="width:${L.length?done/L.length*100:0}%"></i></div></div>
      <div class="group">${L.map(x => { const on = t.prepDone?.[x.key]; const late = !on && x.due && x.due < todayIso(); return `<div class="cell"><button class="check ${on?'on':''}" data-prep="${x.key}" aria-label="Erledigt">${I('check','sm')}</button><div class="grow"><div class="${on?'done-t':''}">${esc(x.t)}</div>${!on && x.due ? `<div class="sub" style="${late?'color:var(--hot)':''}">bis ${fmtDay(x.due)}</div>` : ''}</div>${x.link?`<a href="${esc(x.link)}" target="_blank" rel="noopener" class="tbtn">${I('link','sm')}</a>`:''}</div>`; }).join('')}</div>
      ${sec('Eigene To-dos')}
      <div class="group">${(t.todos||[]).map(x => `<div class="cell"><button class="check ${x.done?'on':''}" data-todo="${x.id}">${I('check','sm')}</button><div class="grow ${x.done?'done-t':''}">${esc(x.t)}</div><button class="tbtn" data-deltodo="${x.id}">${I('x','sm')}</button></div>`).join('')}
        <div class="cell"><input class="inp" id="todo-in" placeholder="Neues To-do" style="min-height:42px;padding:10px 12px"><button class="tbtn round" data-act="addtodo" aria-label="Hinzufügen">${I('plus','sm')}</button></div></div>`;
  }
  const cl = climateOf(t);
  const climateBar = `<div class="card" style="margin-top:14px;display:flex;align-items:center;gap:12px"><div class="ic">${I('thermo','sm')}</div>
    <div class="grow">${cl ? `<b class="num">${cl.tmin}° bis ${cl.tmax} °C</b>${cl.rain?' · Regen möglich':''}<div class="sub">${cl.src === 'manuell' ? 'Von dir eingestellt' : cl.src === 'Vorjahr' ? 'Richtwert vom Vorjahr' : 'Laut Wettervorhersage'}</div>` : `<b>Temperatur unbekannt</b><div class="sub">Stell sie ein, damit die Liste passt</div>`}</div>
    <button class="btn ghost sm" data-act="climate">Ändern</button></div>`;
  if (seg === 'outfit'){
    const days = cl?.days;
    return segs + climateBar + sec('Was ziehe ich an?') + (days?.length ? `<div class="group">${days.map(d => `<div class="cell" style="align-items:flex-start"><div style="width:44px;text-align:center"><div class="xs muted" style="font-weight:600">${fmtDay(d.date).split(',')[0]}</div><div style="font-size:1.4rem">${WMO(d.code)}</div><div class="xs num"><b>${d.tmax}°</b> <span class="muted">${d.tmin}°</span></div></div><div class="grow"><div class="small" style="color:var(--ink-2);line-height:1.6">${outfitFor(d).map(x=>esc(x)).join(' · ')}</div>${d.date===t.start&&t.mode==='flug'?'<div class="sub" style="margin-top:4px">Reisetag: Jacke und schwerste Schuhe anziehen, spart Platz im Koffer.</div>':''}</div></div>`).join('')}</div>`
      : cl ? `<div class="card"><div class="small" style="line-height:1.6">${outfitFor({tmax:cl.tmax, tmin:cl.tmin, rain:cl.rain?60:0}).join(' · ')}</div><div class="sub" style="margin-top:6px">Tagesgenaue Outfits erscheinen, sobald die Vorhersage da ist (16 Tage vorher).</div></div>` : '<div class="empty">Stell zuerst die Temperatur ein.</div>');
  }
  const L = packList(t), done = L.filter(x => t.packDone?.[x.key]).length;
  const cats = [...new Set(L.map(x => x.cat))];
  return segs + climateBar + `
    <div style="margin:18px 2px 0"><div class="row"><div class="grow small muted">${t.people > 1 ? `Mengen pro Person (${t.people} Personen)` : 'Mengen für deine Reise'}</div><span class="small muted num">${done}/${L.length}</span></div><div class="prog" style="margin-top:8px"><i style="width:${L.length?done/L.length*100:0}%"></i></div></div>
    ${cats.map(cat => { const items = L.filter(x => x.cat === cat); const cd = items.filter(x => t.packDone?.[x.key]).length; return `${sec(esc(cat), `${cd}/${items.length}`)}
      <div class="group">${items.map(x => { const on = t.packDone?.[x.key]; return `<div class="cell"><button class="check ${on?'on':''}" data-pack="${esc(x.key)}" aria-label="Eingepackt">${I('check','sm')}</button><div class="grow"><div class="${on?'done-t':''}">${x.qty?`<span class="qty num">${esc(x.qty)}</span>`:''}${esc(x.t)}</div>${x.note?`<div class="sub">${esc(x.note)}</div>`:''}</div><button class="tbtn" data-hidepack="${esc(x.key)}" aria-label="Entfernen">${I('x','sm')}</button></div>`; }).join('')}</div>`; }).join('')}
    ${sec('Etwas fehlt?')}
    <div class="group"><div class="cell"><input class="inp" id="pack-in" placeholder="Eigener Gegenstand" style="min-height:42px;padding:10px 12px"><button class="tbtn round" data-act="addpack" aria-label="Hinzufügen">${I('plus','sm')}</button></div></div>
    ${Object.keys(t.packHidden||{}).length ? `<button class="btn ghost" style="margin-top:12px" data-act="unhide">Entfernte Punkte zurückholen (${Object.keys(t.packHidden).length})</button>` : ''}`;
}

/* ---------- Tools ---------- */

    ${t.mode==='flug'&&t.outbound?`<a class="cell" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(t.outbound.split(' ')[0]+' flight status')}" style="color:var(--ink)"><div class="ic">${I('plane','sm')}</div><div class="grow">Flugstatus ${esc(t.outbound.split(' ')[0])}</div>${I('right','sm')}</a>`:''}
    ${t.mode==='flug'&&t.inbound?`<a class="cell" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(t.inbound.split(' ')[0]+' flight status')}" style="color:var(--ink)"><div class="ic">${I('plane','sm')}</div><div class="grow">Flugstatus ${esc(t.inbound.split(' ')[0])}</div>${I('right','sm')}</a>`:''}

/* ---------- Sheets ---------- */
function sheet(title, inner, onMount){
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  bg.innerHTML = `<div class="sheet"><div class="grab"></div><div class="sh"><div class="h2">${title}</div><button class="tbtn round" data-close aria-label="Schließen">${I('x','sm')}</button></div><div class="sb">${inner}</div></div>`;
  bg.addEventListener('click', e => { if (e.target === bg || e.target.closest('[data-close]')) bg.remove(); });
  document.body.appendChild(bg); onMount && onMount(bg); return bg;
}
function openTool(t, k){

        ${t.expenses.length ? sec('Verlauf') + `<div class="group">${t.expenses.slice().reverse().map(e => `<div class="cell"><div class="grow"><b>${esc(e.desc||'Ausgabe')}</b><div class="sub">${fmtDay(e.date)}${people>1?' · '+esc(e.who||names[0]):''}</div></div><span class="num">${fmtMoney(e.amt,e.cur)}</span><button class="tbtn" data-delexp="${e.id}">${I('x','sm')}</button></div>`).join('')}</div>` : ''}`;

  if (k === 'fx'){

      <select class="inp" id="fx-cur">${Object.keys(FX_FALLBACK).filter(x=>x!=='EUR').map(x=>`<option ${x===(t.fxCur||(cur!=='EUR'?cur:'USD'))?'selected':''}>${x}</option>`).join('')}</select>

  if (k === 'words'){

      const {miss, list, cur, cc} = langState(t), L = LANGS[cur], tag = speechTag(cur, cc), land = c?.n || t.dest?.country || '';

      let n = 0;
      $('.sb', bg).innerHTML = `

        ${groups.map(([g, arr]) => sec(g) + `<div class="group">${arr.map(it => `<div class="cell ph" data-show="${n++}"><div class="grow"><div class="sub">${esc(it.de)}</div><div class="ph-n" dir="auto">${esc(it.nat)}</div>${it.hint ? `<div class="ph-h">${esc(it.hint)}</div>` : ''}</div>${say ? `<button class="say" data-say="${n-1}" aria-label="Anhören">${I('vol','sm')}</button>` : ''}</div>`).join('')}</div>`).join('')}
        ${items.length ? `<p class="small muted" style="margin-top:12px;text-align:center">Antippen zeigt den Satz groß zum Vorzeigen${say ? ', der Lautsprecher liest ihn vor' : ''}.</p>` : ''}
        <div class="field"><label>Andere Sprache</label><select class="inp" id="lang-pick"><option value="">Automatisch: ${esc(LANGS[list[0]].n)}</option>${Object.keys(LANGS).sort((a, b) => LANGS[a].n.localeCompare(LANGS[b].n, 'de')).map(l => `<option value="${l}" ${t.lang===l?'selected':''}>${esc(LANGS[l].n)}</option>`).join('')}</select></div>`;
      const pick = l => { if (!l || l === list[0]) delete t.lang; else t.lang = l; save(); draw(bg); render(); };
      bg.querySelectorAll('[data-lang]').forEach(b => b.onclick = () => pick(b.dataset.lang));

      bg.querySelectorAll('[data-show]').forEach(b => b.onclick = () => showPhrase(items[+b.dataset.show], tag, say));
    };

function afterTrip(t){
  const stale = !t.weather || (Date.now() - (t.weather.fetched||0) > 3*3600e3) || (t.weather.kind === 'history' && t.start <= addDays(todayIso(), 15));
  if (t.dest?.lat != null && stale && t.end >= todayIso() && !afterTrip.busy){ afterTrip.busy = true; refreshWeather(t).finally(() => afterTrip.busy = false); }
}

/* =========================================================
   Eingaben
   ========================================================= */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act],[data-tab],[data-open],[data-chip],[data-sug],[data-toggle],[data-delfix],[data-step],[data-done],[data-edititem],[data-additem],[data-day],[data-seg],[data-pack],[data-hidepack],[data-prep],[data-todo],[data-deltodo],[data-tool],[data-goto]');
  if (!el || el.closest('.sheet')) return;
  const t = state.tripId ? getTrip(state.tripId) : null, d = el.dataset;
  if (d.tab){ state.tab = d.tab; render(true); return; }
  if (d.goto){ const [tab, seg] = d.goto.split(':'); state.tab = tab; state.packSeg = seg; render(true); return; }
  if (d.open){ go('trip', {tripId:d.open, tab:'heute', day:null}); return; }
  if (d.chip){ readWizard(); const w = state.wiz; if (d.multi === '1'){ const s = new Set(w[d.chip]); s.has(d.v) ? s.delete(d.v) : s.add(d.v); w[d.chip] = [...s]; } else w[d.chip] = d.v; render(); return; }
  if (d.sug){ readWizard(); const r = state._sug[+d.sug]; state.wiz.dest = r; state.wiz.destQ = r.name; render(); return; }
  if (d.toggle){ readWizard(); state.wiz[d.toggle] = !state.wiz[d.toggle]; render(); return; }
  if (d.step){ readWizard(); state.wiz.people = Math.max(1, Math.min(20, state.wiz.people + +d.step)); $('#w-people').textContent = state.wiz.people; return; }
  if (d.delfix){ readWizard(); state.wiz.fixed.splice(+d.delfix, 1); render(); return; }
  if (d.day){ state.day = d.day; render(true); return; }
  if (d.seg){ state.packSeg = d.seg; render(true); return; }
  if (d.tool && t){ openTool(t, d.tool); return; }
  if (d.done && t){ for (const day of t.plan.days){ const i = day.items.find(x => x.id === d.done); if (i){ i.done = !i.done; break; } } save(); render(); return; }
  if (d.edititem && t){ openItemEditor(t, state.day, d.edititem); return; }
  if (d.additem && t){ openItemEditor(t, d.additem, null); return; }
  if (d.pack && t){ t.packDone = t.packDone || {}; t.packDone[d.pack] ? delete t.packDone[d.pack] : t.packDone[d.pack] = true; save(); render(); return; }
  if (d.hidepack && t){ if (d.hidepack.startsWith('eigen:')) t.packCustom = t.packCustom.filter(x => 'eigen:'+x.id !== d.hidepack); else { t.packHidden = t.packHidden || {}; t.packHidden[d.hidepack] = true; } save(); render(); return; }
  if (d.prep && t){ t.prepDone = t.prepDone || {}; t.prepDone[d.prep] ? delete t.prepDone[d.prep] : t.prepDone[d.prep] = true; save(); render(); return; }
  if (d.todo && t){ const x = t.todos.find(x => x.id === d.todo); x.done = !x.done; save(); render(); return; }
  if (d.deltodo && t){ t.todos = t.todos.filter(x => x.id !== d.deltodo); save(); render(); return; }
  switch (d.act){
    case 'home': go('home'); break;
    case 'new': state.editing = false; go('wizard', {wiz:blankTrip(), wizStep:0}); break;
    case 'edit': state.editing = true; go('wizard', {wiz:JSON.parse(JSON.stringify(t)), wizStep:0}); break;
    case 'cancel-edit': state.editing = false; go('trip'); break;
    case 'settings': openSettings(); break;
    case 'tripmenu': openTripMenu(t); break;
    case 'climate': openClimate(t); break;
    case 'wback': readWizard(); state.wizStep--; render(true); break;
    case 'wnext':
      readWizard();
      if (state.wizStep === 0 && !state.wiz.dest && !state.wiz.destQ) return toast('Bitte ein Reiseziel eingeben.');
      if (state.wizStep < WSTEPS.length-1){ state.wizStep++; render(true); } else finishWizard();
      break;
    case 'addfix': {
      readWizard(); const title = $('#f-title').value.trim(); if (!title) return toast('Was ist der Termin?');
      state.wiz.fixed.push({title, date:$('#f-date').value, time:$('#f-time').value, place:$('#f-place').value.trim(), dur:$('#f-dur').value});
      state.wiz.fixed.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)); render(); break; }
    case 'addtodo': { const v = $('#todo-in').value.trim(); if (!v) return; t.todos.push({id:uid(), t:v, done:false}); save(); render(); break; }
    case 'addpack': { const v = $('#pack-in').value.trim(); if (!v) return; t.packCustom = t.packCustom || []; t.packCustom.push({id:uid(), t:v}); save(); render(); break; }
    case 'unhide': t.packHidden = {}; save(); render(); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'todo-in'){ e.preventDefault(); $('[data-act=addtodo]').click(); }
  if (e.target.id === 'pack-in'){ e.preventDefault(); $('[data-act=addpack]').click(); }
});
/* Kein Zoomen, kein Verschieben der Ansicht */
['gesturestart','gesturechange','gestureend'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), {passive:false}));
document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, {passive:false});
document.addEventListener('dblclick', e => e.preventDefault(), {passive:false});
window.addEventListener('scroll', () => { if (window.scrollY || window.scrollX) window.scrollTo(0,0); });

/* ---------- Start ---------- */
load(); render(true);
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
  // Neue Version automatisch übernehmen (nur wenn schon eine ältere lief)
  const hadSW = !!navigator.serviceWorker.controller; let reloaded = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW && !reloaded){ reloaded = true; location.reload(); } });
}
</script>
</body>
